<title>Heardback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Heardback: find real internship and new-grad jobs, spot ghost listings, and track every application and interview round.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (232px) + top bar + scrolling workspace; bottom tab bar under 760px.
   Identity: cool ink neutrals with a faint blue bias, one cobalt accent, semantic status hues kept apart from the accent. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --surface-3: #e8ebf0;
  --line: #e2e6ec;
  --line-strong: #cfd5de;
  --fg: #12161d;
  --fg-2: #4a5361;
  --fg-3: #6b7482;
  --accent: #3150d6;
  --accent-hover: #2843bb;
  --accent-soft: #eaeefc;
  --accent-fg: #ffffff;
  --accent-text: #2a46c4;
  --ok: #1d7a4f;
  --ok-soft: #e5f4ec;
  --wait: #9a6100;
  --wait-soft: #fbf1dd;
  --bad: #c0352b;
  --bad-soft: #fbe9e7;
  --ghost: #6d6787;
  --ghost-soft: #eeedf4;
  --info: #2a6f9e;
  --info-soft: #e5f0f8;
  --shadow-float: 0 1px 2px rgba(18, 22, 29, .06), 0 8px 24px rgba(18, 22, 29, .10);
  --shadow-pop: 0 2px 4px rgba(18, 22, 29, .06), 0 16px 48px rgba(18, 22, 29, .16);
  --scrim: rgba(18, 22, 29, .32);
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);

  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 14px;
  --fs-lg: 17px;
  --fs-xl: 24px;

  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --rail: 232px;
  --top: 56px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-fast: 120ms;
  --t-med: 180ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --surface-3: #232830;
    --line: #262b33; --line-strong: #353c46;
    --fg: #e9ecf1; --fg-2: #aab2bf; --fg-3: #8a93a1;
    --accent: #6f8bff; --accent-hover: #8aa0ff; --accent-soft: #1c2440; --accent-fg: #0b1020; --accent-text: #93a8ff;
    --ok: #4cc38a; --ok-soft: #12291e; --wait: #e2a740; --wait-soft: #2b2112; --bad: #f0776c; --bad-soft: #2e1715;
    --ghost: #a59fc2; --ghost-soft: #221f2e; --info: #6cb4e6; --info-soft: #132433;
    --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
    --shadow-pop: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 48px rgba(0, 0, 0, .6);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --surface-3: #232830;
  --line: #262b33; --line-strong: #353c46;
  --fg: #e9ecf1; --fg-2: #aab2bf; --fg-3: #8a93a1;
  --accent: #6f8bff; --accent-hover: #8aa0ff; --accent-soft: #1c2440; --accent-fg: #0b1020; --accent-text: #93a8ff;
  --ok: #4cc38a; --ok-soft: #12291e; --wait: #e2a740; --wait-soft: #2b2112; --bad: #f0776c; --bad-soft: #2e1715;
  --ghost: #a59fc2; --ghost-soft: #221f2e; --info: #6cb4e6; --info-soft: #132433;
  --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
  --shadow-pop: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 48px rgba(0, 0, 0, .6);
  --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--fs-md); line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01" on, "cv11" on;
  overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: var(--fs-xs); }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
::selection { background: var(--accent-soft); }

/* ---------- App frame ---------- */
#app { height: 100%; }
.frame { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }
.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px; min-height: 0;
  padding: 12px 10px 12px max(10px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.brand-name { font-weight: 650; font-size: var(--fs-lg); letter-spacing: -0.02em; }
.brand-mark { width: 26px; height: 26px; flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.nav-label { font-size: var(--fs-xs); color: var(--fg-3); padding: 6px 10px 4px; letter-spacing: .02em; }
.nav-item {
  display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px;
  border-radius: var(--r-md); color: var(--fg-2); font-weight: 500; border: 0; background: none; width: 100%; text-align: left;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item[aria-current="page"] .ico { color: var(--accent-text); }
.nav-item .ico { color: var(--fg-3); }
.nav-count { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.nav-item[aria-current="page"] .nav-count { color: var(--accent-text); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 4px 0; }
.goal-card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-sm); }
.meter { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width var(--t-med) var(--ease); }
.meter.ok > i { background: var(--ok); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.topbar {
  height: var(--top); flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 20px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.top-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search-trigger {
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; min-width: 260px;
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); color: var(--fg-3);
  transition: border-color var(--t-fast);
}
.search-trigger:hover { border-color: var(--line-strong); }
.search-trigger .kbd { margin-left: auto; }
.workspace { flex: 1; min-height: 0; overflow: auto; scroll-behavior: smooth; }
.page { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.page.wide { max-width: none; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: var(--fs-xl); letter-spacing: -0.025em; }
.page-head p { color: var(--fg-2); margin-top: 4px; }
.page-head .spacer { flex: 1; }
.bottom-nav { display: none; }
.example-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: var(--r-lg); border: 1px dashed var(--line-strong); background: var(--surface);
  font-size: var(--fs-sm); color: var(--fg-2);
}
.example-banner b { color: var(--fg); font-weight: 600; }
.example-banner .spacer { flex: 1; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--fg); font-weight: 500; font-size: var(--fs-sm); white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast);
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:active { transform: translateY(0.5px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn.primary.danger-solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.primary.danger-solid:hover { filter: brightness(.94); background: var(--bad); }
.btn.sm { height: 28px; padding: 0 9px; font-size: var(--fs-xs); border-radius: var(--r-sm); }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }
.btn.block { width: 100%; }
.btn .kbd { margin-left: 4px; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface);
  font-family: var(--mono); font-size: 11px; color: var(--fg-3); line-height: 1;
}
.btn.primary .kbd { background: transparent; border-color: rgba(255,255,255,.35); color: inherit; opacity: .85; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
.hint { font-size: var(--fs-xs); color: var(--fg-3); }
.input, .select, .textarea {
  width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--fg); font-size: var(--fs-sm);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--fg-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: vertical; line-height: 1.5; min-height: 96px; }
.select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.input-icon { position: relative; display: flex; align-items: center; }
.input-icon .ico { position: absolute; left: 10px; color: var(--fg-3); pointer-events: none; }
.input-icon .input { padding-left: 32px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); cursor: pointer; min-height: 28px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-strong); transition: background var(--t-fast); pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform var(--t-med) var(--ease); }
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i { box-shadow: var(--focus); }

.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); gap: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; background: transparent; border-radius: 6px; font-size: var(--fs-sm); color: var(--fg-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(18,22,29,.08), 0 0 0 1px var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px;
  border: 1px solid var(--line-strong); background: var(--surface); font-size: var(--fs-sm); color: var(--fg-2); font-weight: 500;
  transition: all var(--t-fast) var(--ease);
}
.chip:hover { border-color: var(--fg-3); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* ---------- Badges & status ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px;
  font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); border: 1px solid transparent;
  font-variant-numeric: tabular-nums;
}
.badge.outline { background: transparent; border-color: var(--line-strong); }
.badge.accent { background: var(--accent-soft); color: var(--accent-text); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.wait { background: var(--wait-soft); color: var(--wait); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.ghost { background: var(--ghost-soft); color: var(--ghost); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.example { background: transparent; border: 1px dashed var(--line-strong); color: var(--fg-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3); }
.dot.saved { background: var(--fg-3); }
.dot.applied { background: var(--accent); }
.dot.screen { background: var(--info); }
.dot.interview { background: var(--wait); }
.dot.offer { background: var(--ok); }
.dot.rejected { background: var(--bad); }
.dot.ghosted { background: var(--ghost); }
.logo {
  width: 32px; height: 32px; flex: none; border-radius: var(--r-md); display: grid; place-items: center;
  font-weight: 600; font-size: var(--fs-sm); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line);
  letter-spacing: -0.02em;
}
.logo.lg { width: 48px; height: 48px; font-size: var(--fs-lg); border-radius: var(--r-lg); }
.logo.sm { width: 24px; height: 24px; font-size: 11px; border-radius: var(--r-sm); }

/* ghost meter */
.gscore { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.gbars { display: inline-flex; gap: 2px; align-items: flex-end; }
.gbars i { width: 3px; border-radius: 1px; background: var(--surface-3); }
.gbars i:nth-child(1) { height: 6px; } .gbars i:nth-child(2) { height: 9px; } .gbars i:nth-child(3) { height: 12px; }
.gscore.low { color: var(--ok); } .gscore.low .gbars i:nth-child(1) { background: var(--ok); }
.gscore.mid { color: var(--wait); } .gscore.mid .gbars i:nth-child(-n+2) { background: var(--wait); }
.gscore.high { color: var(--bad); } .gscore.high .gbars i { background: var(--bad); }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.card-pad { padding: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { font-size: var(--fs-md); font-weight: 600; }
.card-head .spacer { flex: 1; }
.card-body { padding: 16px; }
.section-title { font-size: var(--fs-md); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.section-title .count { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row .spacer { flex: 1; }
.divider { height: 1px; background: var(--line); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.stat { display: flex; flex-direction: column; gap: 4px; padding: 16px; min-width: 0; }
.stat-label { font-size: var(--fs-sm); color: var(--fg-2); }
.stat-value { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-sub { font-size: var(--fs-xs); color: var(--fg-3); }
.stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stats-row > .stat + .stat { border-left: 1px solid var(--line); }

/* table */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-sm); }
.table th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: var(--fs-xs); padding: 0 12px; height: 36px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.table th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 4px; align-items: center; }
.table td { padding: 0 12px; height: 48px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr { transition: background var(--t-fast); cursor: pointer; }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tr[aria-selected="true"] { background: var(--accent-soft); }

/* empty, skeleton */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px; }
.empty .empty-ico { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.empty h3 { font-size: var(--fs-md); }
.empty p { color: var(--fg-2); max-width: 42ch; font-size: var(--fs-sm); }
.skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-sm); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade var(--t-med) var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal {
  position: fixed; z-index: 41; left: 50%; top: 12vh; transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px)); max-height: 76vh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
  animation: rise var(--t-med) var(--ease);
}
.modal.lg { width: min(760px, calc(100vw - 32px)); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.modal-head h2 { font-size: var(--fs-lg); }
.modal-head .spacer { flex: 1; }
.modal-body { padding: 4px 18px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
.drawer {
  position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; animation: slide var(--t-med) var(--ease);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-body { flex: 1; overflow: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 20px; }
.drawer-foot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.menu { position: fixed; z-index: 50; min-width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-float); padding: 4px; animation: rise var(--t-fast) var(--ease); }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; background: none; border-radius: var(--r-sm); font-size: var(--fs-sm); text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); box-shadow: none; }

/* command palette */
.palette { top: 14vh; width: min(620px, calc(100vw - 32px)); max-height: 64vh; overflow: hidden; }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; border-bottom: 1px solid var(--line); }
.palette-input input { flex: 1; border: 0; background: none; outline: none; font-size: var(--fs-lg); min-width: 0; }
.palette-list { overflow: auto; padding: 6px; }
.palette-group { font-size: var(--fs-xs); color: var(--fg-3); padding: 10px 10px 4px; }
.palette-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 10px; border: 0; background: none; border-radius: var(--r-md); text-align: left; font-size: var(--fs-sm); }
.palette-item[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-text); }
.palette-item .sub { color: var(--fg-3); font-size: var(--fs-xs); }
.palette-item[aria-selected="true"] .sub { color: var(--accent-text); opacity: .8; }
.palette-foot { display: flex; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--fg-3); }

/* toast */
.toasts { position: fixed; z-index: 60; bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; background: var(--fg); color: var(--bg); border-radius: var(--r-md); box-shadow: var(--shadow-float); font-size: var(--fs-sm); animation: rise var(--t-med) var(--ease); max-width: calc(100vw - 32px); }
.toast button { border: 0; background: none; color: inherit; font-weight: 600; opacity: .85; padding: 2px 6px; border-radius: 4px; }
.toast button:hover { opacity: 1; }
.toast .ico { flex: none; }

/* ---------- Find ---------- */
.find-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; }
.filters { position: sticky; top: 0; display: flex; flex-direction: column; gap: 18px; }
.filter-group { display: flex; flex-direction: column; gap: 8px; }
.filter-group h4 { font-size: var(--fs-xs); font-weight: 500; color: var(--fg-3); letter-spacing: .02em; }
.job-row {
  display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 16px; cursor: pointer; transition: background var(--t-fast);
  background: var(--surface);
}
.job-row:hover { background: var(--surface-2); }
.job-row[aria-selected="true"] { background: var(--accent-soft); }
.job-title { font-weight: 500; color: var(--fg); }
.job-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--fg-2); font-size: var(--fs-sm); min-width: 0; }
.job-meta .sep { color: var(--line-strong); }
.job-side { display: flex; align-items: center; gap: 10px; }
.fresh { font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fresh.new { color: var(--ok); font-weight: 500; }
.fit { font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--fg-2); min-width: 40px; text-align: center; }
.fit.hi { background: var(--accent-soft); color: var(--accent-text); }

/* ---------- Pipeline ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; min-height: 420px; align-items: start; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; min-height: 160px; transition: border-color var(--t-fast), background var(--t-fast); }
.col.drop { border-color: var(--accent); background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; font-weight: 600; font-size: var(--fs-sm); }
.col-head .count { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.col-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 10px; min-height: 60px; }
.app-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  cursor: grab; transition: box-shadow var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.app-card:hover { border-color: var(--line-strong); box-shadow: 0 1px 2px rgba(18,22,29,.06); }
.app-card.dragging { opacity: .45; }
.app-card:focus-visible { box-shadow: var(--focus); }
.app-card-top { display: flex; gap: 10px; align-items: flex-start; }
.app-card-title { font-weight: 500; font-size: var(--fs-sm); line-height: 1.35; }
.app-card-co { font-size: var(--fs-xs); color: var(--fg-2); }
.app-card-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--fg-3); }

/* timeline */
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; }
.tl-item { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; }
.tl-item::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-3); }
.tl-text { font-size: var(--fs-sm); }
.tl-when { font-size: var(--fs-xs); color: var(--fg-3); }

/* rounds */
.round { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.round-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stage-steps { display: flex; gap: 4px; }
.stage-steps button { flex: 1; height: 6px; border-radius: 99px; border: 0; background: var(--surface-3); padding: 0; }
.stage-steps button.on { background: var(--accent); }

/* today */
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; }
.task-ico { width: 28px; height: 28px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); }
.task-ico.wait { background: var(--wait-soft); color: var(--wait); }
.task-ico.accent { background: var(--accent-soft); color: var(--accent-text); }
.task-ico.ok { background: var(--ok-soft); color: var(--ok); }
.task-ico.ghost { background: var(--ghost-soft); color: var(--ghost); }
.task-ico.bad { background: var(--bad-soft); color: var(--bad); }
.task-title { font-size: var(--fs-sm); font-weight: 500; }
.task-sub { font-size: var(--fs-xs); color: var(--fg-2); }
.task-actions { display: flex; gap: 6px; }
.greeting h1 { font-size: var(--fs-xl); letter-spacing: -0.025em; }
.greeting p { color: var(--fg-2); margin-top: 4px; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg-3); font-size: 11px; font-family: var(--font); }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.funnel-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 72px; gap: 12px; align-items: center; font-size: var(--fs-sm); }
.funnel-bar { height: 26px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.funnel-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; transition: width var(--t-med) var(--ease); }

/* onboarding */
.onboard-wrap { position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow: auto; display: flex; justify-content: center; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.onboard { width: min(600px, 100%); display: flex; flex-direction: column; gap: 24px; }
.onboard-steps { display: flex; gap: 6px; }
.onboard-steps i { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-3); }
.onboard-steps i.on { background: var(--accent); }
.onboard h1 { font-size: var(--fs-xl); letter-spacing: -0.025em; }
.onboard .lede { color: var(--fg-2); font-size: var(--fs-md); margin-top: 6px; }

/* misc */
.ai-box { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); padding: 12px 14px; font-size: var(--fs-sm); white-space: pre-wrap; line-height: 1.6; }
.ai-label { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--fg-3); }
.reason-list { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.reason-list li { display: flex; gap: 8px; align-items: flex-start; }
.reason-list ul, ul.reason-list { list-style: none; margin: 0; padding: 0; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 16px; font-size: var(--fs-sm); }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; min-width: 0; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); color: var(--fg-2); border: 1px solid var(--line); }
.callout.info { background: var(--info-soft); border-color: transparent; color: var(--fg); }
.callout.wait { background: var(--wait-soft); border-color: transparent; color: var(--fg); }
.callout .ico { flex: none; margin-top: 2px; }
.footer-note { font-size: var(--fs-xs); color: var(--fg-3); text-align: center; padding: 8px 16px 24px; }
.celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 70; display: grid; place-items: center; }
.celebrate-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 22px 26px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; animation: rise 240ms var(--ease); }
.celebrate-ring { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.ico { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }
.ico.lg { width: 20px; height: 20px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .find-layout { grid-template-columns: minmax(0, 1fr); }
  .filters { position: static; }
  .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats-row > .stat:nth-child(3) { border-left: 0; }
  .stats-row > .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .search-trigger { min-width: 0; }
  .search-trigger .label-text, .search-trigger .kbd { display: none; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); flex: none; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .bottom-nav button { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--fg-3); font-size: 11px; font-weight: 500; }
  .bottom-nav button[aria-current="page"] { color: var(--accent-text); }
  .topbar { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .page { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 18px; }
  .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  .drawer { width: 100vw; border-left: 0; }
  .kv { grid-template-columns: 110px minmax(0, 1fr); }
  .hide-sm { display: none !important; }
  .toasts { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  .modal { top: auto; bottom: 0; transform: translateX(-50%); width: 100vw; border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 88vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .palette { top: 8px; bottom: auto; border-radius: var(--r-lg); width: calc(100vw - 16px); }
}
@media (max-width: 520px) {
  .cols-4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .job-row { grid-template-columns: 32px minmax(0, 1fr); }
  .job-side { grid-column: 2; justify-content: flex-start; }
  .top-title { font-size: var(--fs-md); }
  .funnel-row { grid-template-columns: 84px minmax(0, 1fr) 56px; }
  .btn { min-height: 36px; }
  .nav-item, .chip { min-height: 36px; }
}
@media (min-width: 861px) { .show-sm { display: none !important; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ===== Find jobs, job drawer, companies, company drawer ===== */
.find-page { gap: 20px; }
.find-aside { top: 16px; max-height: calc(100vh - var(--top) - 32px); overflow-y: auto; padding: 2px 4px 8px 2px; margin: -2px 0 0 -2px; scrollbar-width: thin; }
.find-fgroups { display: flex; flex-direction: column; gap: 20px; }
.find-fgroups .filter-group h4 { margin: 0; }
.find-fgroups .seg { align-self: flex-start; }
.find-fgroups .hint { line-height: 1.4; }
.chip .find-chip-n { font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; font-weight: 400; }
.chip[aria-pressed="true"] .find-chip-n { color: var(--accent-text); opacity: .75; }

/* toolbar */
.find-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.find-search { flex: 1; min-width: 200px; }
.find-search .input { height: 40px; font-size: var(--fs-md); padding-right: 36px; }
.find-search .input::-webkit-search-cancel-button { cursor: pointer; }
.find-kbd { position: absolute; right: 10px; pointer-events: none; }
.find-fbtn { display: none; height: 40px; }
.find-fcount { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font-size: var(--fs-xs); font-weight: 600; }
.find-bar { display: flex; align-items: center; gap: 12px; min-height: 34px; flex-wrap: wrap; }
.find-bar .spacer { flex: 1; }
.find-count { font-size: var(--fs-sm); color: var(--fg-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.find-count strong { color: var(--fg); font-weight: 600; }
.find-prefs { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); }
.find-prefs .sep, .find-dsub .sep { color: var(--line-strong); }
.find-link { border: 0; background: none; padding: 0; color: var(--accent-text); font-size: inherit; font-weight: 500; cursor: pointer; }
.find-link:hover { text-decoration: underline; text-underline-offset: 2px; }
.find-sort-sm { width: auto; min-width: 150px; }

/* results */
.find-results { overflow: hidden; }
.find-row { min-height: 64px; }
.find-row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.find-row-title {
  display: block; max-width: 100%; border: 0; background: none; padding: 0; text-align: left; color: var(--fg);
  font-weight: 500; font-size: var(--fs-md); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.find-row-meta { font-size: var(--fs-sm); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
.find-side { display: grid; grid-template-columns: 60px 84px 28px 92px; align-items: center; gap: 8px; justify-items: end; }
.find-c-ghost { justify-content: center; width: 28px; }
.find-c-fit, .find-c-ghost, .find-c-fresh, .find-c-act { display: inline-flex; align-items: center; justify-content: flex-end; }
.find-c-fit .fit { min-width: 56px; white-space: nowrap; }
.find-c-fresh .fresh { text-align: right; }
.find-save.on { color: var(--accent-text); }
.find-stage { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 99px; }
.find-more { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 0; font-size: var(--fs-sm); flex-wrap: wrap; }
.find-keys { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-xs); color: var(--fg-3); }
.find-keys .kbd + .kbd { margin-left: -2px; }
.find-keys .kbd { margin-left: 6px; }
.find-foot { padding-top: 0; }
.find-row-co { grid-template-columns: minmax(0, 1fr) auto; }
.find-results-tight .find-side { grid-template-columns: 60px 72px 28px 28px; }
.find-results-tight .find-c-act .badge { display: none; }

/* drawer */
.find-dhead { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: flex-start; }
.find-dtitle { font-size: var(--fs-lg); line-height: 1.3; letter-spacing: -0.015em; }
.find-dsub { font-size: var(--fs-sm); gap: 6px; }
.find-co { font-size: var(--fs-sm); }
.find-ext { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); }
.find-kv { grid-template-columns: 132px minmax(0, 1fr); row-gap: 10px; }
.find-locs { display: flex; flex-direction: column; gap: 2px; }
.find-small { font-size: var(--fs-sm); }
.find-gbig-row { display: flex; align-items: center; gap: 16px; }
.find-gbig { display: flex; align-items: baseline; gap: 2px; font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; line-height: 1; min-width: 72px; }
.find-gbig-of { font-size: var(--fs-sm); color: var(--fg-3); font-weight: 500; }
.find-gbig.low { color: var(--ok); } .find-gbig.mid { color: var(--wait); } .find-gbig.high { color: var(--bad); }
.find-r-ico { color: var(--fg-3); margin-top: 3px; }
.find-details { border-top: 1px solid var(--line); padding-top: 10px; font-size: var(--fs-sm); }
.find-details summary { cursor: pointer; color: var(--fg-2); font-weight: 500; width: max-content; max-width: 100%; border-radius: var(--r-sm); }
.find-details summary:hover { color: var(--fg); }
.find-details[open] summary { margin-bottom: 8px; }
.find-rubric { margin: 0 0 8px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--fg-2); }
.find-rubric b { color: var(--fg); font-weight: 500; }
.find-fit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-sm); }
.find-fit-list li { display: grid; grid-template-columns: 20px 72px minmax(0, 1fr); gap: 8px; align-items: start; }
.find-fit-k { color: var(--fg); font-weight: 500; }
.find-fit-ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
.find-fit-ico.ok { background: var(--ok-soft); color: var(--ok); }
.find-fit-ico.bad { background: var(--bad-soft); color: var(--bad); }
.find-fit-ico.none { background: var(--surface-2); color: var(--fg-3); font-size: var(--fs-xs); }
.find-mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.find-mini .stat { padding: 12px 16px; }
.find-mini .stat + .stat { border-left: 1px solid var(--line); }
.find-mini-v { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }

.find-season-line { border-top: 1px solid var(--line); padding: 10px 16px; font-size: var(--fs-xs); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; line-height: 1.5; }

/* Claude blocks */

/* company drawer */

.find-stat .stat-sub { line-height: 1.4; }
.find-n { color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.find-season-nums { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: var(--fs-sm); }
.find-applink, .find-corow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%;
  padding: 10px 16px; min-height: 56px; border: 0; background: var(--surface); text-align: left; cursor: pointer; transition: background var(--t-fast);
}
.find-applink:hover, .find-corow:hover { background: var(--surface-2); }

/* companies table */

.find-cotable td:first-child { max-width: 320px; }
.find-coname { font-weight: 500; }
.find-cotable tbody tr:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 0; }
.find-split { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); }

@media (max-width: 1100px) {

}
@media (max-width: 860px) {

  .find-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .find-stat:nth-child(3n) { border-right: 1px solid var(--line); }
  .find-stat:nth-child(2n) { border-right: 0; }
  .find-stat:nth-last-child(-n+3) { border-bottom: 1px solid var(--line); }
  .find-stat:nth-last-child(-n+2) { border-bottom: 0; }
  .find-mini { grid-template-columns: minmax(0, 1fr); }
  .find-mini .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
  .find-mini .stat { flex-direction: row; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; padding: 10px 16px; }
  .find-mini .stat-label { flex: 1; }

@media (max-width: 520px) {

  .find-row { align-items: start; padding: 12px 16px; row-gap: 6px; }

  .find-row-co { grid-template-columns: minmax(0, 1fr); }
  .find-row-co .find-side { grid-column: 1; }
  .find-row-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .find-row-meta { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .find-side { grid-column: 2; display: flex; justify-content: flex-start; gap: 10px; flex-wrap: wrap; }
  .find-c-fit:empty { display: none; }
  .find-c-act { margin-left: auto; }
  .find-c-act .btn.sm.icon { width: 36px; height: 36px; }
  .find-c-fit .fit { min-width: 0; }
  .find-gbig-row { gap: 12px; }
}

/* ===== Pipeline ===== */
.pl-page.wide { max-width: 1680px; }
.pl-head { align-items: flex-end; }

.pl-small { font-size: var(--fs-xs); }
.pl-sep { color: var(--line-strong); }

/* Board */
.pl-board {

}

.pl-col-hide { color: var(--fg-3); }
.pl-col-empty {
  flex: 1; min-height: 64px; display: grid; place-items: center; text-align: center; padding: 12px;
  border: 1px dashed var(--line-strong); border-radius: var(--r-md); color: var(--fg-3); font-size: var(--fs-xs);
}

  border: 1px dashed var(--line-strong); border-radius: var(--r-lg); background: transparent; color: var(--fg-2);
  transition: border-color var(--t-fast), background var(--t-fast);
}

.pl-rail.drop { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
.pl-rail-count { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; }
.pl-rail-label { writing-mode: vertical-rl; font-size: var(--fs-sm); font-weight: 600; letter-spacing: .01em; }

.pl-card { gap: 6px; padding: 10px 10px 10px 12px; user-select: none; -webkit-user-select: none; }
.pl-card:active { cursor: grabbing; }
.pl-card:focus-visible { border-color: var(--accent); }
.pl-card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }

.pl-menu { width: 216px; }

/* Table */

/* Empty state */

}

/* Drawer */

.pl-stepper { display: flex; flex-direction: column; gap: 10px; }

.pl-step {
  display: flex; flex-direction: column; gap: 7px; align-items: stretch; padding: 4px 2px 6px; border: 0; background: none;
  font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; text-align: left; border-radius: var(--r-sm); min-width: 0;
}

.pl-step-s { display: none; }
.pl-step:hover i { background: var(--line-strong); }

}

.pl-tabs { margin-bottom: -6px; }

.pl-ov { display: flex; flex-direction: column; gap: 22px; }

.pl-contact-form { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 6px; }

.pl-round { gap: 12px; padding: 14px; background: var(--surface); }
.pl-round-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pl-round-type { flex: 1 1 160px; max-width: 200px; font-weight: 500; }
.pl-round-at { flex: 1 1 200px; max-width: 240px; }
.pl-round-out { display: flex; align-items: center; gap: 12px; }

.pl-outcome { flex: 1; }

.pl-tl { padding-top: 6px; }
.pl-tl .tl-dot .ico { width: 12px; height: 12px; }

.pl-notes { min-height: 340px; line-height: 1.6; font-size: var(--fs-md); }

/* Modals */
.pl-foot-note { font-size: var(--fs-xs); color: var(--fg-3); align-self: center; }
.pl-draft { min-height: 260px; font-size: var(--fs-sm); line-height: 1.6; }
.pl-draft.busy { color: var(--fg-2); background: var(--surface-2); }
.pl-thinking { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--fg-2); }
.pl-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: pl-spin 0.8s linear infinite; }
@keyframes pl-spin { to { transform: rotate(360deg); } }

.pl-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.pl-form .field > label .faint { font-weight: 400; font-size: var(--fs-xs); margin-left: 4px; }
.pl-form .input[disabled] { background: var(--surface-2); color: var(--fg-3); }

.pl-raw { min-height: 200px; font-size: var(--fs-sm); line-height: 1.55; transition: min-height var(--t-med) var(--ease); }
.pl-raw.short { min-height: 96px; height: 96px; }
.pl-ai-row { margin-top: -4px; }
.pl-samples { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pl-samples .chip { height: 28px; font-size: var(--fs-xs); }
.pl-preview { display: flex; flex-direction: column; overflow: hidden; }
.pl-preview-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pl-preview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px; }
.pl-span2 { grid-column: 1 / -1; }
.pl-plan { display: flex; gap: 10px; padding: 12px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--fg); }
.pl-plan .ico { flex: none; margin-top: 2px; color: var(--accent-text); }
.pl-plan p { margin-top: 2px; }
.pl-plan.subtle { background: var(--surface-2); border-bottom: 0; border-top: 1px solid var(--line); }
.pl-plan.subtle .ico { color: var(--fg-3); }

/* Responsive */
@media (max-width: 1100px) {
  .pl-filter { width: 200px; }
}
@media (max-width: 860px) {
  .pl-head { align-items: stretch; flex-direction: column; gap: 12px; }
  .pl-head > .spacer { display: none; }
  .pl-tools { width: 100%; }
  .pl-filter { flex: 1 1 100%; width: auto; order: 3; }
  .pl-tools .seg { flex: 1; }
  .pl-tools .seg button { flex: 1; justify-content: center; }
  .pl-board { margin-inline: -16px; padding-inline: 16px; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; gap: 10px; min-height: 60vh; }
  .pl-col { flex: 0 0 82%; min-width: 0; max-width: none; scroll-snap-align: start; }
  .pl-rail { scroll-snap-align: start; }
  .pl-empty-actions { grid-template-columns: minmax(0, 1fr); }
  .pl-close-btn { height: 36px; }
  .pl-kv { grid-template-columns: 110px minmax(0, 1fr); }
  .pl-preview-grid, .pl-form { grid-template-columns: minmax(0, 1fr); }
  .pl-round-grid { grid-template-columns: minmax(0, 1fr); }
  .pl-contact-form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pl-contact-form .btn { grid-column: auto; }
}
@media (max-width: 520px) {
  .pl-add-btn { flex: 1; }
  .example-banner > .ico { display: none; }
  .pl-dhead .logo { display: none; }
  .pl-step-l { display: none; }
  .pl-step-s { display: block; }
  .pl-stage-line > .pl-small { flex-basis: 100%; margin-bottom: 2px; }
  .pl-stage-line > .spacer { display: none; }
  .pl-close-btn { flex: 1; justify-content: center; }
  .pl-outcome button { padding: 0 4px; }
  .pl-table { min-width: 0; table-layout: fixed; }
  .pl-table th:nth-child(2) { width: 134px; }
  .pl-table th:nth-child(n+3), .pl-table td:nth-child(n+3) { display: none; }
  .pl-table td { height: auto; padding-block: 10px; }
  .pl-table td:first-child { padding-left: 12px; } .pl-table td:nth-child(2) { padding-right: 12px; }
  .pl-tcell .logo { display: none; }
  .pl-tcell { align-items: flex-start; }
  .pl-tcell .badge { display: none; }
  .pl-tnext-m { display: block; margin-top: 2px; white-space: normal; }
  .pl-stage-sel .select { width: 118px; }
  .pl-more { width: 36px; height: 36px; margin: -8px -6px -8px 0; }
  .pl-step { min-height: 36px; justify-content: flex-end; }
  .pl-round-type, .pl-round-at { max-width: none; flex: 1 1 100%; }
  .pl-round-out { flex-direction: column; align-items: stretch; gap: 6px; }
  .pl-tabs .seg button { padding: 0 4px; height: 34px; }
  .pl-round-foot .btn { flex: 1; }
  .pl-quicknote { flex-direction: column; }
  .pl-next-card { padding: 12px; }
}
.pl-status .ico { margin-top: 1px; }

/* ===== Onboarding, Settings, Interview prep (prep.css) ===== */

/* ---------- Onboarding ---------- */
.onboard-wrap { padding-block: 40px 0; }
.onboard { gap: 24px; width: min(640px, 100%); }
.onb-brand { display: flex; align-items: center; gap: 12px; }
.onb-brand .spacer { flex: 1; }
.onb-word { font-size: var(--fs-lg); font-weight: 650; letter-spacing: -0.02em; }
.onb-value { margin-top: -12px; color: var(--fg-2); font-size: var(--fs-md); }
.onb-link { border: 0; background: none; padding: 6px 4px; color: var(--fg-2); font-size: var(--fs-sm); font-weight: 500; border-radius: var(--r-sm); min-height: 32px; }
.onb-link:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
.onb-progress { display: flex; flex-direction: column; gap: 8px; padding-top: 24px; border-top: 1px solid var(--line); }
.onb-step-label { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; letter-spacing: .02em; }
.onboard-steps i { transition: background var(--t-med) var(--ease); }
.onboard h1:focus { outline: none; box-shadow: none; }
.onb-card { display: flex; flex-direction: column; }
.onb-card-pad { padding: 20px; }
.onb-group { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.onb-group + .onb-group { border-top: 1px solid var(--line); }
.onb-group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.onb-group-head h3 { font-size: var(--fs-sm); font-weight: 600; }
.onb-switches { display: flex; flex-wrap: wrap; gap: 12px 28px; padding-top: 4px; }
.onb-switches > label { min-height: 32px; }
.onb-name { max-width: 280px; }
.onb-foot {
  position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
  margin-top: 8px; padding: 16px 0 max(24px, env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
}
.onb-foot .spacer { flex: 1; }
.onb-foot .btn { height: 40px; padding: 0 16px; font-size: var(--fs-md); }
.onb-time { font-size: var(--fs-sm); }

/* resume editor (onboarding step 2 + resume modal) */
.onb-resume { gap: 14px; }
.onb-resume-head { display: flex; align-items: center; gap: 8px; }
.onb-resume-head .spacer { flex: 1; }
.onb-file { cursor: pointer; }
.onb-file:focus-within { box-shadow: var(--focus); }
.onb-textarea { min-height: 180px; font-size: var(--fs-sm); }
.onb-meta { margin-top: -6px; }
.onb-meta .onb-link { margin-left: auto; font-size: var(--fs-xs); padding: 2px 4px; min-height: 0; }
.onb-skill { padding-right: 9px; }
.onb-skill .ico { opacity: .7; }
.onb-skill:hover .ico { opacity: 1; }
.onb-add { max-width: 380px; }
.onb-add .input { flex: 1; min-width: 0; }
.onb-privacy { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-xs); color: var(--fg-2); padding-top: 12px; border-top: 1px solid var(--line); }
.onb-privacy .ico { color: var(--ok); margin-top: 1px; }

/* step 3 */
.onb-count { display: flex; flex-direction: column; gap: 6px; padding: 20px; border-bottom: 1px solid var(--line); }
.onb-big { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; }
.onb-big-label { font-size: var(--fs-md); font-weight: 500; color: var(--fg-2); }
.onb-count + .callout { margin: 16px 20px; }
.onb-job { cursor: default; padding: 12px 20px; }
.onb-job:hover { background: var(--surface); }
.onb-source { padding: 12px 20px; border-top: 1px solid var(--line); }
.onb-ex { align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.onb-ex input { margin-top: 2px; }

/* ---------- Settings ---------- */
.pf-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.pf-col { gap: 16px; }
.pf-card .card-head h2 { font-size: var(--fs-md); font-weight: 600; }
.pf-card .card-head .ico { color: var(--fg-3); }
.pf-sub { padding: 14px 20px 0; font-size: var(--fs-sm); color: var(--fg-2); }
.pf-rows { display: flex; flex-direction: column; padding: 4px 20px 6px; }
.pf-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 8px 24px; align-items: center; padding: 14px 0; }
.pf-row.top { align-items: start; }
.pf-row + .pf-row { border-top: 1px solid var(--line); }
.pf-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pf-control { min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.pf-control > .chips { flex: 1; }
.pf-input { max-width: 320px; }
.pf-num .input { width: 88px; }
.pf-value { font-size: var(--fs-sm); }
.pf-file { cursor: pointer; align-self: flex-start; }
.pf-file:focus-within { box-shadow: var(--focus); }
.pf-statement { font-size: var(--fs-sm); line-height: 1.6; }
.pf-text { font-size: var(--fs-sm); line-height: 1.6; }
.pf-facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-xs); color: var(--fg-2); }
.pf-facts li { display: flex; gap: 8px; align-items: flex-start; }
.pf-facts .ico { color: var(--ok); margin-top: 2px; }
.pf-meta { gap: 4px 16px; }
.pf-more { display: flex; flex-direction: column; padding: 4px; }
.pf-more-item { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; border: 0; background: none; text-align: left; border-radius: var(--r-md); }
.pf-more-item + .pf-more-item { border-top: 1px solid var(--line); border-radius: 0; }
.pf-more-item:hover { background: var(--surface-2); }
.pf-more-ico { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: var(--r-md); background: var(--surface-2); color: var(--fg-2); }
.pf-more-title { font-weight: 500; font-size: var(--fs-md); }
.pf-version { font-size: var(--fs-xs); color: var(--fg-3); text-align: center; padding: 4px 0; }


/* ---------- Interview prep ---------- */
.prep-layout { display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: 24px; align-items: start; }
.prep-side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prep-picker { display: none; }
.prep-list-card { padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.prep-group { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; letter-spacing: .02em; padding: 10px 10px 4px; }
.prep-none { font-size: var(--fs-sm); color: var(--fg-3); padding: 4px 10px 8px; }
.prep-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.prep-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border: 0; background: none;
  border-radius: var(--r-md); text-align: left; transition: background var(--t-fast) var(--ease);
}
.prep-item:hover { background: var(--surface-2); }
.prep-item[aria-current="true"] { background: var(--accent-soft); }
.prep-item[aria-current="true"] .prep-item-title { color: var(--accent-text); }
.prep-item-main { flex: 1; gap: 0; }
.prep-item-title { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
.prep-item-sub { font-size: var(--fs-xs); color: var(--fg-2); }
.prep-item-ico { width: 24px; height: 24px; flex: none; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.prep-when { font-size: var(--fs-xs); color: var(--fg-3); white-space: nowrap; }
.prep-when.soon, .prep-soon { color: var(--wait); font-weight: 500; }

.prep-work { gap: 16px; min-width: 0; }
.prep-head { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.prep-head-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
.prep-head-main .spacer { flex: 1; }
.prep-head-ico { width: 48px; height: 48px; flex: none; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); }
.prep-h2 { font-size: var(--fs-lg); letter-spacing: -0.015em; }
.prep-facts { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); justify-content: start; gap: 8px 40px; margin: 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
.prep-facts dt { font-size: var(--fs-xs); color: var(--fg-3); }
.prep-facts dd { margin: 0; min-width: 0; }
.prep-pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
.prep-cat { width: auto; min-width: 150px; }

.prep-qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.prep-qlist li { display: flex; gap: 12px; font-size: var(--fs-sm); padding: 8px 0; }
.prep-qlist-lg { padding: 4px 0; }
.prep-qlist-lg li { display: block; padding: 0; }
.prep-qlist-lg li + li { border-top: 1px solid var(--line); }
.prep-qbtn { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px 16px; border: 0; background: none; text-align: left; font-size: var(--fs-sm); color: var(--fg); border-radius: 0; transition: background var(--t-fast); min-height: 44px; }
.prep-qbtn:hover { background: var(--surface-2); }
.prep-qn { width: 20px; flex: none; color: var(--fg-3); font-size: var(--fs-xs); font-weight: 500; padding-top: 1px; text-align: right; }
.prep-qtext { flex: 1; min-width: 0; line-height: 1.5; }
.prep-chev { color: var(--fg-3); margin-top: 2px; transition: transform var(--t-fast) var(--ease); }
.prep-qbtn[aria-expanded="true"] .prep-chev { transform: rotate(180deg); }
.prep-tip { font-size: var(--fs-sm); color: var(--fg-2); line-height: 1.55; }
.prep-tip-in { padding: 0 16px 12px 48px; margin-top: -4px; }
.prep-card-foot { padding: 10px 16px; border-top: 1px solid var(--line); }

.prep-cta { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; font-size: var(--fs-sm); }
.prep-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.prep-point { display: flex; flex-direction: column; gap: 8px; }
.prep-point + .prep-point { padding-top: 14px; border-top: 1px solid var(--line); }
.prep-point-text { font-size: var(--fs-sm); font-weight: 500; padding-left: 10px; border-left: 2px solid var(--accent); line-height: 1.5; }
.prep-star-guide { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-xs); color: var(--fg-2); padding: 10px 12px; margin-bottom: 16px; border-radius: var(--r-md); background: var(--surface-2); }
.prep-star-guide b { color: var(--fg); font-weight: 600; }
.prep-star-guide .faint { flex-basis: 100%; }
.prep-point-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-xs); color: var(--fg-2); padding-left: 12px; }
.prep-point-meta > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.prep-r { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.prep-point-meta b.num { color: var(--fg); font-weight: 600; }
.prep-ask { list-style: none; margin: 0; padding: 4px 16px 8px; display: flex; flex-direction: column; }
.prep-ask li { position: relative; padding: 10px 0 10px 16px; font-size: var(--fs-sm); line-height: 1.5; }
.prep-ask li + li { border-top: 1px solid var(--line); }
.prep-ask li::before { content: ""; position: absolute; left: 2px; top: 18px; width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); }
.prep-two { align-items: stretch; }
.prep-notes-card { display: flex; flex-direction: column; }
.prep-notes-body { flex: 1; display: flex; }
.prep-notes-body .textarea { flex: 1; min-height: 160px; }
.prep-count { font-size: var(--fs-sm); white-space: nowrap; }
.prep-saved { display: inline-flex; align-items: center; gap: 4px; }

/* practice */
.prep-practice { border-color: var(--accent); }
.prep-practice-body { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 24px; align-items: start; }
.prep-q-big { font-size: var(--fs-lg); font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
.prep-timer-col { display: flex; flex-direction: column; }
.prep-timer { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 12px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); text-align: center; }
.prep-clock { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; font-family: var(--mono); line-height: 1.1; }
.prep-clock.low { color: var(--wait); }
.prep-clock.done { color: var(--bad); }
.prep-practice-foot { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.prep-practice-foot .spacer { flex: 1; }
.prep-thinking { gap: 8px; }
.prep-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: prepPulse 1.1s var(--ease) infinite alternate; }
@keyframes prepPulse { from { opacity: .3; } to { opacity: 1; } }

@media (max-width: 1100px) {
  .pf-layout { grid-template-columns: minmax(0, 1fr); }
  .pf-aside { position: static; }
  .prep-layout { grid-template-columns: 240px minmax(0, 1fr); }
  .prep-two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .prep-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .prep-side { position: static; }
  .prep-picker { display: flex; flex-direction: column; gap: 6px; }
  .prep-picker .select { min-height: 44px; }
  .prep-list-card { display: none; }
  .prep-practice-body { grid-template-columns: minmax(0, 1fr); }
  .prep-timer-col { order: -1; }
  .prep-timer { flex-direction: row; flex-wrap: wrap; justify-content: space-between; padding: 12px 14px; text-align: left; }
  .prep-timer .hint { flex-basis: 100%; }
  .prep-facts { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .prep-facts > div { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 12px; }
  .pf-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .pf-rows { padding: 2px 16px 4px; }
  .pf-sub { padding: 12px 16px 0; }
  .pf-input { max-width: none; }
  .onboard-wrap { padding-block: 20px 0; }
  .onboard { gap: 20px; }
  .onb-group { padding: 16px; }
  .onb-card-pad { padding: 16px; }
  .onb-count { padding: 16px; }
  .onb-job { padding: 12px 16px; }
  .onb-source { padding: 12px 16px; }
  .onb-name { max-width: none; }
  .onb-add { max-width: none; }
}
@media (max-width: 520px) {
  .onb-foot .btn { height: 44px; }
  .prep-item { min-height: 52px; }
  .prep-practice-foot .btn { min-height: 44px; }
  .prep-pick .seg { width: 100%; }
  .prep-pick .seg button { flex: 1; padding: 0 6px; }
  .prep-cat { width: 100%; }
}

/* ===== Today ===== */
.td-head { display: flex; align-items: flex-end; gap: 16px; }
.td-head .spacer { flex: 1; }
.td-date { font-size: var(--fs-sm); color: var(--fg-3); white-space: nowrap; padding-bottom: 2px; }
.td-col { gap: 16px; }
.td-count { font-size: var(--fs-xs); font-weight: 600; color: var(--fg-2); background: var(--surface-2); border-radius: 99px; padding: 1px 8px; min-width: 22px; text-align: center; }
.td-small { font-size: var(--fs-sm); }
.td-link { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.td-link .ico { width: 14px; height: 14px; }
.td-card-foot { padding: 10px 16px; border-top: 1px solid var(--line); }
.td-card-foot.td-small { font-size: var(--fs-xs); }
.td-mini-empty { display: flex; align-items: center; gap: 12px; padding: 16px; flex-wrap: wrap; }

/* tasks */
.td-task { grid-template-columns: 28px minmax(0, 1fr) auto; }
.td-task-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.td-task-title { border: 0; background: none; padding: 0; text-align: left; color: var(--fg); cursor: pointer; line-height: 1.4; }

<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.umd.js"></script>

<script>
/* --- js/00-core.js --- */
/* ===== Heardback core: rendering, store, persistence, utilities ===== */
const { h, render, Fragment } = preact;
const { useState, useEffect, useMemo, useRef, useCallback, useLayoutEffect } = preactHooks;
const html = htm.bind(h);

const DAY = 86400000;
const now = () => Date.now();
const uid = (p = "") => p + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cx = (...a) => a.filter(Boolean).join(" ");
const pluralize = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

/* ---------- Dates ---------- */
const fmt = {
  ago(ts) {
    if (!ts) return "";
    const s = Math.max(0, (now() - ts) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    const d = Math.floor(s / 86400);
    if (d < 30) return `${d}d ago`;
    if (d < 365) return `${Math.floor(d / 30)}mo ago`;
    return `${Math.floor(d / 365)}y ago`;
  },
  days(ts) { return Math.floor((now() - ts) / DAY); },
  date(ts, opts) { return ts ? new Date(ts).toLocaleDateString(undefined, opts || { month: "short", day: "numeric" }) : ""; },
  dateY(ts) { return ts ? new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : ""; },
  time(ts) { return ts ? new Date(ts).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : ""; },
  dateTime(ts) { return ts ? `${fmt.date(ts, { weekday: "short", month: "short", day: "numeric" })} · ${fmt.time(ts)}` : ""; },
  until(ts) {
    const d = ts - now();
    if (d < 0) return fmt.ago(ts);
    const m = d / 60000;
    if (m < 60) return `in ${Math.max(1, Math.round(m))}m`;
    if (m < 1440) return `in ${Math.round(m / 60)}h`;
    const days = Math.round(m / 1440);
    return days === 1 ? "tomorrow" : `in ${days} days`;
  },
  pct(x, digits = 0) { return x == null || isNaN(x) ? "—" : `${(x * 100).toFixed(digits)}%`; },
  num(n) { return n == null ? "—" : n.toLocaleString(); },
  dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; },
  startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); },
  toInput(ts) { if (!ts) return ""; const d = new Date(ts); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; },
  toDateInput(ts) { if (!ts) return ""; const d = new Date(ts); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; },
  fromInput(v) { const t = new Date(v).getTime(); return isNaN(t) ? null : t; },
};

/* ---------- Safe storage ---------- */
const storage = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

/* ---------- Stages ---------- */
const STAGES = [
  { id: "saved", label: "Saved", short: "Saved" },
  { id: "applied", label: "Applied", short: "Applied" },
  { id: "screen", label: "Screen", short: "Screen" },
  { id: "interview", label: "Interviews", short: "Interview" },
  { id: "offer", label: "Offer", short: "Offer" },
  { id: "rejected", label: "Rejected", short: "Rejected" },
  { id: "ghosted", label: "Ghosted", short: "Ghosted" },
];
const STAGE = Object.fromEntries(STAGES.map((s, i) => [s.id, { ...s, i }]));
const ACTIVE_STAGES = ["applied", "screen", "interview"];
const ROUND_TYPES = [
  { id: "recruiter", label: "Recruiter call" },
  { id: "technical", label: "Technical" },
  { id: "behavioral", label: "Behavioral" },
  { id: "case", label: "Case" },
  { id: "onsite", label: "Onsite / Final" },
  { id: "other", label: "Other" },
];
const ROUND = Object.fromEntries(ROUND_TYPES.map((r) => [r.id, r]));
const CATS = ["Software", "Data & AI", "Product", "Quant", "Hardware"];
const LEVELS = [{ id: "intern", label: "Internship" }, { id: "newgrad", label: "New grad" }];

/* ---------- Store ---------- */
const STORE_KEY = "heardback:v1";
const defaultState = () => ({
  v: 1,
  profile: { roles: [], levels: ["intern", "newgrad"], locations: [], remote: true, needsSponsor: false, resume: "", skills: [], onboarded: false, name: "", weeklyGoal: 10 },
  apps: {},
  settings: { theme: "system", followUpDays: 7, ghostDays: 21, shareAnon: false, showExamples: true, hideGhostAbove: 0 },
  dismissed: {},
  ui: { pipelineView: "board", findSort: "new" },
});

function loadState() {
  const s = storage.get(STORE_KEY, null);
  const d = defaultState();
  if (!s || typeof s !== "object") return d;
  return {
    ...d, ...s,
    profile: { ...d.profile, ...(s.profile || {}) },
    settings: { ...d.settings, ...(s.settings || {}) },
    ui: { ...d.ui, ...(s.ui || {}) },
    apps: s.apps || {},
    dismissed: s.dismissed || {},
  };
}

const store = {
  state: loadState(),
  subs: new Set(),
  saveTimer: null,
  get() { return this.state; },
  set(fn) {
    const next = typeof fn === "function" ? fn(this.state) : { ...this.state, ...fn };
    if (next === this.state) return;
    this.state = next;
    this.subs.forEach((f) => f(next));
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => storage.set(STORE_KEY, this.state), 150);
  },
  sub(f) { this.subs.add(f); return () => this.subs.delete(f); },
};
function useStore(sel = (s) => s) {
  const [v, setV] = useState(() => sel(store.get()));
  const selRef = useRef(sel); selRef.current = sel;
  useEffect(() => store.sub((s) => setV(selRef.current(s))), []);
  return v;
}

/* ---------- App (application) operations ---------- */
const Apps = {
  list(s = store.get()) { return Object.values(s.apps).filter((a) => s.settings.showExamples || !a.example); },
  get(id) { return store.get().apps[id]; },
  create(fields) {
    const t = now();
    const a = {
      id: uid("a_"), company: "", title: "", location: "", url: "", jobId: null, stage: "saved",
      createdAt: t, appliedAt: null, lastActivityAt: t, lastReplyAt: null, notes: "", contacts: [], rounds: [],
      events: [], salary: "", source: "manual", example: false, ...fields,
    };
    if (!a.events.length) a.events = [{ id: uid("e_"), at: t, kind: "created", text: a.stage === "saved" ? "Saved" : `Added as ${STAGE[a.stage]?.label || a.stage}` }];
    if (a.stage !== "saved" && !a.appliedAt) a.appliedAt = fields.appliedAt || t;
    store.set((s) => ({ ...s, apps: { ...s.apps, [a.id]: a } }));
    return a;
  },
  update(id, patch) {
    store.set((s) => {
      const a = s.apps[id]; if (!a) return s;
      const p = typeof patch === "function" ? patch(a) : patch;
      return { ...s, apps: { ...s.apps, [id]: { ...a, ...p } } };
    });
  },
  move(id, stage, opts = {}) {
    const a = Apps.get(id); if (!a || a.stage === stage) return;
    const t = opts.at || now();
    const ev = { id: uid("e_"), at: t, kind: "stage", from: a.stage, to: stage, text: `Moved to ${STAGE[stage].label}` };
    const patch = { stage, lastActivityAt: t, events: [...a.events, ev] };
    if (stage !== "saved" && !a.appliedAt) patch.appliedAt = t;
    if (["screen", "interview", "offer", "rejected"].includes(stage) && STAGE[a.stage].i < STAGE[stage].i) patch.lastReplyAt = t;
    Apps.update(id, patch);
    if (stage === "offer" && !opts.silent) celebrate(a);
    if (!opts.silent) toast(`${a.company} moved to ${STAGE[stage].label}`, { undo: () => Apps.update(id, a) });
  },
  remove(id) {
    const a = Apps.get(id);
    store.set((s) => { const apps = { ...s.apps }; delete apps[id]; return { ...s, apps }; });
    toast(`Removed ${a?.company || "application"}`, { undo: () => store.set((s) => ({ ...s, apps: { ...s.apps, [id]: a } })) });
  },

function initials(name = "") {
  const w = name.replace(/[^A-Za-z0-9 &]/g, " ").split(/\s+/).filter(Boolean);

}
function hashHue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h) % 360; }
function norm(s) { return (s || "").toLowerCase().replace(/[^a-z0-9+#.\s]/g, " ").replace(/\s+/g, " ").trim(); }
function csvEscape(v) { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}

/* ===== Job data (published files next to the page) ===== */
const jobsStore = { status: "idle", jobs: [], companies: [], cstats: {}, meta: null, byId: new Map(), byCompany: new Map(), error: null };
const jobSubs = new Set();
function useJobs() { const [v, setV] = useState({ ...jobsStore }); useEffect(() => { const f = () => setV({ ...jobsStore }); jobSubs.add(f); f(); return () => jobSubs.delete(f); }, []); return v; }
async function loadJobs() {
  if (jobsStore.status === "loading") return;
  jobsStore.status = "loading"; jobsStore.error = null; jobSubs.forEach((f) => f());
  try {
    const [jr, cr] = await Promise.all([fetch("data/jobs.json"), fetch("data/companies.json")]);
    if (!jr.ok) throw new Error(`jobs ${jr.status}`);
    const j = await jr.json();
    const c = cr.ok ? await cr.json() : { companies: {} };
    const companies = j.companies || [];
    const jobs = (j.jobs || []).map((x) => {
      const co = companies[x.c] || "Unknown";
      return { ...x, co, p: x.p * 1000, u: (x.u || x.p) * 1000, _s: norm(`${x.t} ${co} ${(x.l || []).join(" ")}`) };
    });
    jobs.sort((a, b) => b.p - a.p);
    const byId = new Map(jobs.map((x) => [x.id, x]));
    const byCompany = new Map();
    for (const x of jobs) { if (!byCompany.has(x.co)) byCompany.set(x.co, []); byCompany.get(x.co).push(x); }
    const cstats = {};
    for (const [k, v] of Object.entries(c.companies || {})) cstats[v.n || companies[+k]] = v;
    Object.assign(jobsStore, { status: "ready", jobs, companies, cstats, meta: { generatedAt: j.generatedAt, source: j.source, stats: j.stats }, byId, byCompany });
  } catch (e) {
    jobsStore.status = "error"; jobsStore.error = String(e?.message || e);
  }
  jobSubs.forEach((f) => f());
}
