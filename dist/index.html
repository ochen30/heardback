/* ===== Fit score: transparent, based only on what the listing states ===== */
function fitScore(job, profile) {
  if (!profile || (!profile.roles?.length && !profile.locations?.length && !profile.skills?.length)) return null;
  const parts = [];
  let score = 0, max = 0;
  // role (35)
  max += 35;
  if (!profile.roles?.length) { score += 20; parts.push({ k: "Role", ok: null, text: "No target roles set" }); }
  else if (profile.roles.includes(job.cat)) { score += 35; parts.push({ k: "Role", ok: true, text: `${job.cat} matches your targets` }); }
  else parts.push({ k: "Role", ok: false, text: `${job.cat} is outside your targets` });
  // level (15)
  max += 15;
  const lv = profile.levels?.length ? profile.levels : ["intern", "newgrad"];
  if (lv.includes(job.lvl)) { score += 15; parts.push({ k: "Level", ok: true, text: job.lvl === "intern" ? "Internship" : "New grad role" }); }
  else parts.push({ k: "Level", ok: false, text: job.lvl === "intern" ? "Internship, you're looking for full-time" : "Full-time, you're looking for internships" });
  // location (20)
  max += 20;
  const locs = profile.locations || [];
  if (!locs.length) { score += 14; parts.push({ k: "Location", ok: null, text: "Open to any location" }); }
  else {
    const hit = locs.find((l) => jobInLoc(job, l)) || (profile.remote && job.r ? "remote" : null);
    if (hit) { score += 20; parts.push({ k: "Location", ok: true, text: hit === "remote" ? "Remote option" : `In ${LOC_OPTIONS.find((o) => o.id === hit)?.label || hit}` }); }
    else parts.push({ k: "Location", ok: false, text: `${(job.l || [])[0] || "Location"} isn't on your list` });
  }
  // sponsorship (10)
  max += 10;
  if (profile.needsSponsor) {
    if (job.sp === "yes") { score += 10; parts.push({ k: "Visa", ok: true, text: "Offers sponsorship" }); }
    else if (job.sp === "no" || job.sp === "citizen") parts.push({ k: "Visa", ok: false, text: job.sp === "citizen" ? "Requires U.S. citizenship" : "Doesn't sponsor visas" });
    else { score += 4; parts.push({ k: "Visa", ok: null, text: "Sponsorship not stated" }); }
  } else { score += 10; }
  // skills (20)
  max += 20;
  const exp = expectedSkills(job);
  const have = new Set(profile.skills || []);
  const matched = exp.filter((s) => have.has(s));
  const missing = exp.filter((s) => !have.has(s));
  if (!profile.skills?.length) { score += 8; parts.push({ k: "Skills", ok: null, text: "Add your resume to compare skills" }); }
  else if (!exp.length) { score += 12; parts.push({ k: "Skills", ok: null, text: "Title doesn't point to specific skills" }); }
  else {
    const r = matched.length / Math.min(exp.length, 4);
    score += Math.round(20 * Math.min(1, r));
    parts.push({ k: "Skills", ok: matched.length ? true : false, text: matched.length ? `You list ${matched.slice(0, 3).join(", ")}` : `Usually asks for ${exp.slice(0, 3).join(", ")}` });
  }
  return { score: Math.round((score / max) * 100), parts, matched, missing, expected: exp };
}

/* ===== Email parsing (rule-based; Claude upgrade lives in the paste modal) ===== */
const EMAIL_KINDS = {
  confirmation: { label: "Application received", stage: "applied" },
  interview: { label: "Interview invite", stage: "interview" },
  screen: { label: "Recruiter screen", stage: "screen" },
  rejection: { label: "Rejection", stage: "rejected" },
  offer: { label: "Offer", stage: "offer" },
  other: { label: "Update", stage: null },
};
function parseEmail(raw) {
  const text = (raw || "").replace(/\r/g, "");
  const low = text.toLowerCase();
  const hdr = (name) => { const m = text.match(new RegExp(`^${name}:\\s*(.+)$`, "im")); return m ? m[1].trim() : ""; };
  const from = hdr("From"), subject = hdr("Subject"), dateH = hdr("Date");
  let kind = "other";
  const has = (...ps) => ps.some((p) => low.includes(p));
  if (has("pleased to offer", "extend an offer", "offer letter", "excited to offer", "formal offer", "offer of employment")) kind = "offer";
  else if (has("unfortunately", "not to move forward", "not be moving forward", "decided to pursue other", "move forward with other", "regret to inform", "position has been filled", "not selected", "will not be proceeding", "other candidates whose", "decided not to proceed")) kind = "rejection";
  else if (has("phone screen", "recruiter call", "initial call", "quick chat", "intro call", "screening call") && !has("technical interview", "onsite", "on-site", "superday", "final round", "panel interview", "coding interview", "system design", "hackerrank", "codesignal", "case interview", "virtual onsite")) kind = "screen";
  else if (has("interview", "schedule a time", "your availability", "calendly", "next round", "onsite", "superday", "technical assessment", "coding challenge", "hackerrank", "codesignal", "phone screen", "recruiter call")) kind = "interview";
  else if (has("thank you for applying", "received your application", "application has been received", "we have received your", "thanks for applying", "application was submitted", "successfully submitted", "thank you for your application", "thank you for your interest")) kind = "confirmation";

  // company
  let company = "";
  const pats = [
    /(?:[Tt]hank you|[Tt]hanks|THANK YOU) for (?:applying|your (?:application|interest)|submitting your application) (?:to|at|in|with) ([A-Z][\w&.'\- ]{1,40}?)(?:[.!,\n]| for | and | on | to | this | next |$)/m,
    /(?:position|role|opportunity|job) (?:at|with) ([A-Z][\w&.'\- ]{1,40}?)(?:[.!,\n]| and | on | to | this | next | in | for |$)/,
    /(?:join|joining) (?:the )?([A-Z][\w&.'\- ]{1,40}?) (?:team|family)/,
    /interest in (?:joining )?([A-Z][\w&.'\- ]{1,40}?)(?:[.!,\n]| and | on | to | this | next | in | for |$)/,
    /^(?:the )?([A-Z][\w&.'\- ]{1,30}?) (?:Recruiting|Talent|Careers|Hiring) Team/m,
  ];
  for (const re of pats) { const m = text.match(re); if (m) { company = m[1].trim().replace(/^the /i, ""); break; } }
  if (!company && from) {
    const nm = from.match(/^"?([^"<@]+?)"?\s*</);
    const dom = from.match(/@([a-z0-9-]+)\./i);
    if (nm && !/no-?reply|notifications|recruit|talent|careers|hiring|workday|greenhouse|lever|ashby/i.test(nm[1])) company = nm[1].replace(/\s+(Recruiting|Careers|Talent).*$/i, "").trim();
    else if (dom && !/gmail|outlook|yahoo|greenhouse|lever|myworkday|workday|ashbyhq|icims|smartrecruiters|hire|jobvite|taleo/i.test(dom[1])) company = dom[1][0].toUpperCase() + dom[1].slice(1);
  }
  if (!company && subject) { const m = subject.match(/(?:at|from|with)\s+([A-Z][\w&.'\- ]{1,30})/); if (m) company = m[1].trim(); }
  if (/^(our|the|we|us|this)$/i.test(company)) company = "";

  // role
  let title = "";
  const tp = [
    /(?:position|role|offer) (?:of|as) (?:an? |the )?([A-Z][\w&/,()+.'\- ]{2,70}?) (?:at|with) /,
    /for (?:the )?(?:position of |role of )?["“]?([A-Z][\w&/,()+.'\- ]{2,70}?)["”]? (?:position|role|opening|internship)/,
    /(?:application|applying|interview|candidacy) for (?:the )?["“]?([A-Z][\w&/()+.'\- ]{2,70}?)["”]?(?: position| role| opening)?(?: at | with |[.!,\n(])/,
    /(?:position|role):\s*([^\n]{3,70})/i,
  ];
  for (const re of tp) { const m = text.match(re); if (m) { title = m[1].trim(); break; } }
  if (!title && subject) { const m = subject.match(/[-–:|]\s*([A-Z][^-–:|]{3,60}(?:Intern|Engineer|Analyst|Scientist|Developer|Manager|Designer|Associate)[^-–:|]*)/); if (m) title = m[1].trim(); }

  // date
  let at = dateH ? Date.parse(dateH) : NaN;
  if (isNaN(at)) at = now();

  // interview time
  let interviewAt = null;
  const body = text.replace(/^(?:From|To|Cc|Bcc|Subject|Date|Sent|Reply-To):.*$/gim, "");
  const dm = body.match(/(?:on\s+)?((?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+)?((?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?(?:\s*(?:at|@|,)?\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm)))?/i);
  if (dm && (kind === "interview" || kind === "screen")) {
    const yr = dm[3] || new Date().getFullYear();
    const t = Date.parse(`${dm[2]} ${yr} ${dm[4] ? dm[4].replace(/(am|pm)/i, " $1") : "10:00 am"}`);
    if (!isNaN(t)) interviewAt = t < now() - 30 * DAY ? Date.parse(`${dm[2]} ${+yr + 1} ${dm[4] || "10:00 am"}`) : t;
  }
  let roundType = null;
  if (kind === "screen") roundType = "recruiter";
  else if (kind === "interview") roundType = /technical|coding|hackerrank|codesignal|leetcode|system design/i.test(text) ? "technical" : /behavioral/i.test(text) ? "behavioral" : /case/i.test(text) ? "case" : /onsite|final|superday/i.test(text) ? "onsite" : "other";

  const next = { confirmation: "Wait for a reply. Follow up in a week if you hear nothing.", screen: "Reply with your availability and prep a 60-second intro.", interview: "Confirm the time and start prep for this round.", rejection: "Log it and move on. Ask for feedback if you had interviews.", offer: "Ask for the offer in writing and the decision deadline.", other: "Review and decide whether anything changed." }[kind];
  return { kind, company, title, at, interviewAt, roundType, next, confidence: (company ? 1 : 0) + (title ? 1 : 0) + (kind !== "other" ? 1 : 0) };
}

/* Fuzzy-match an email to an existing application */
function matchApp(company, title) {
  if (!company) return null;
  const c = norm(company);
  const cands = Object.values(store.get().apps).filter((a) => { const ac = norm(a.company); return ac && (ac === c || ac.includes(c) || c.includes(ac)); });
  if (!cands.length) return null;
  if (title) { const t = norm(title); const exact = cands.find((a) => norm(a.title) === t || norm(a.title).includes(t) || t.includes(norm(a.title))); if (exact) return exact; }
  return cands.sort((a, b) => b.lastActivityAt - a.lastActivityAt)[0];
}

/* --- js/25-logic.js --- */
/* ===== Nudges: what to do today ===== */
function computeTasks(s = store.get()) {
  const t = now();
  const out = [];
  const dis = s.dismissed || {};
  const skip = (key) => dis[key] && dis[key] > t;
  const apps = Apps.list(s);
  for (const a of apps) {
    for (const r of a.rounds || []) {
      if (!r.at) continue;
      const until = r.at - t;
      if (until > 0 && until < 3 * DAY) {
        const key = `prep:${a.id}:${r.id}`;
        if (!skip(key)) out.push({ key, kind: "prep", pri: until < DAY ? 0 : 1, app: a, round: r, icon: "cal", tone: "accent", title: `${ROUND[r.type]?.label || "Interview"} with ${a.company} ${fmt.until(r.at)}`, sub: `${fmt.dateTime(r.at)}${r.interviewers ? " · " + r.interviewers : ""}`, action: "Prep" });
      }
      if (until <= 0 && -until < 2 * DAY && !r.thanked && r.outcome === "pending") {
        const key = `thanks:${a.id}:${r.id}`;
        if (!skip(key)) out.push({ key, kind: "thanks", pri: 0, app: a, round: r, icon: "send", tone: "ok", title: `Send a thank-you note to ${a.company}`, sub: `Within 24 hours of your ${(ROUND[r.type]?.label || "interview").toLowerCase()}${r.interviewers ? " with " + r.interviewers : ""}`, action: "Draft note" });
      }
      if (until <= -DAY && r.outcome === "pending") {
        const key = `outcome:${a.id}:${r.id}`;
        if (!skip(key)) out.push({ key, kind: "outcome", pri: 2, app: a, round: r, icon: "flag", tone: "", title: `How did the ${a.company} ${(ROUND[r.type]?.label || "interview").toLowerCase()} go?`, sub: `It was ${fmt.ago(r.at)}. Log the outcome and a few notes while you remember.`, action: "Log outcome" });
      }
    }
    if (["applied", "screen", "interview"].includes(a.stage)) {
      const silent = Apps.daysSilent(a);
      const upcoming = (a.rounds || []).some((r) => r.at && r.at > t);
      if (!upcoming && silent >= s.settings.ghostDays) {
        const key = `ghost:${a.id}`;
        if (!skip(key)) out.push({ key, kind: "ghost", pri: 3, app: a, icon: "ghost", tone: "ghost", title: `No reply from ${a.company} in ${silent} days`, sub: "Most companies reply within 3 weeks if they're interested. Mark it as ghosted to keep your board honest.", action: "Mark ghosted" });
      } else if (!upcoming && a.stage === "applied" && silent >= s.settings.followUpDays && !a.followedUpAt) {
        const key = `follow:${a.id}`;
        if (!skip(key)) out.push({ key, kind: "follow", pri: 2, app: a, icon: "reply", tone: "wait", title: `Follow up with ${a.company}`, sub: `You applied ${silent} days ago and haven't heard back.`, action: "Draft follow-up" });
      }
    }
    if (a.stage === "saved") {
      const age = Math.floor((t - a.createdAt) / DAY);
      const job = a.jobId ? jobsStore.byId.get(a.jobId) : null;
      if (age >= 3) {
        const key = `apply:${a.id}`;
        if (!skip(key)) out.push({ key, kind: "apply", pri: 4, app: a, icon: "bolt", tone: "", title: `Apply to ${a.company}`, sub: `Saved ${age} days ago${job && job.g >= 50 ? " · this listing shows ghost-job signs" : ". Early applicants get more replies."}`, action: "Open" });
      }
    }
  }
  out.sort((x, y) => x.pri - y.pri);
  return out;
}
function dismissTask(key, days = 365) { store.set((s) => ({ ...s, dismissed: { ...s.dismissed, [key]: now() + days * DAY } })); }

/* ===== Personal stats ===== */
function computeStats(s = store.get(), apps = Apps.list(s)) {
  const applied = apps.filter((a) => a.stage !== "saved" && a.appliedAt);
  const replied = applied.filter((a) => a.lastReplyAt || ["screen", "interview", "offer", "rejected"].includes(a.stage));
  const interviewed = applied.filter((a) => ["interview", "offer"].includes(a.stage) || (a.rounds || []).length || a.events.some((e) => e.to === "interview"));
  const offers = applied.filter((a) => a.stage === "offer" || a.events.some((e) => e.to === "offer"));
  const replyDays = replied.map((a) => a.lastReplyAt && a.appliedAt ? (firstReplyAt(a) - a.appliedAt) / DAY : null).filter((x) => x != null && x >= 0);
  const median = (arr) => { if (!arr.length) return null; const v = [...arr].sort((a, b) => a - b); const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
  const weekStart = startOfWeek(now());
  const thisWeek = applied.filter((a) => a.appliedAt >= weekStart).length;
  const weeks = [];
  for (let i = 7; i >= 0; i--) { const ws = weekStart - i * 7 * DAY; weeks.push({ start: ws, applied: applied.filter((a) => a.appliedAt >= ws && a.appliedAt < ws + 7 * DAY).length, replies: replied.filter((a) => { const r = firstReplyAt(a); return r && r >= ws && r < ws + 7 * DAY; }).length }); }
  return {
    total: apps.length, applied: applied.length, replied: replied.length, interviewed: interviewed.length, offers: offers.length,
    ghosted: applied.filter((a) => a.stage === "ghosted").length, rejected: applied.filter((a) => a.stage === "rejected").length,
    responseRate: applied.length ? replied.length / applied.length : null,
    interviewRate: applied.length ? interviewed.length / applied.length : null,
    medianReplyDays: median(replyDays), thisWeek, weeks,
    active: apps.filter((a) => ACTIVE_STAGES.includes(a.stage)).length,
  };
}
function firstReplyAt(a) {
  const e = (a.events || []).find((e) => e.kind === "stage" && ["screen", "interview", "offer", "rejected"].includes(e.to));
  return e ? e.at : a.lastReplyAt;
}
function startOfWeek(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); const day = (d.getDay() + 6) % 7; return d.getTime() - day * DAY; }

function Palette() {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(0);

  const s = useStore();
  const listRef = useRef(null);
  const close = () => ui.set({ palette: false });

    const acts = [
      { g: "Actions", icon: "plus", label: "Add application", sub: "N", run: () => openModal("add") },
      { g: "Actions", icon: "mail", label: "Paste an email to log it", sub: "E", run: () => openModal("paste") },
      { g: "Actions", icon: "doc", label: "Update your resume", run: () => openModal("resume") },
      { g: "Actions", icon: "moon", label: "Toggle dark mode", run: () => store.set((st) => ({ ...st, settings: { ...st.settings, theme: document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches) ? "light" : "dark" } })) },
      { g: "Actions", icon: "keyboard", label: "Keyboard shortcuts", sub: "?", run: () => openModal("shortcuts") },
      ...NAV.concat([{ id: "prefs", label: "Settings", icon: "prefs" }]).map((x, i) => ({ g: "Go to", icon: x.icon, label: x.label, sub: `G then ${"TFPCIS"[i] || ","}`, run: () => go(x.id) })),
    ];
    const res = [];
    const actHits = n ? acts.filter((a) => norm(a.label).includes(n)) : acts.slice(0, 5);
    res.push(...actHits);
    if (n.length >= 2) {
      const apps = Apps.list(s).filter((a) => norm(`${a.company} ${a.title}`).includes(n)).slice(0, 5);
      res.push(...apps.map((a) => ({ g: "Your applications", logo: a.company, label: `${a.company} · ${a.title}`, sub: STAGE[a.stage].label, run: () => openApp(a.id) })));
      if (jobs.status === "ready") {
        const words = n.split(" ");
        const jm = [];
        for (const j of jobs.jobs) { if (words.every((w) => j._s.includes(w))) { jm.push(j); if (jm.length >= 6) break; } }
        res.push(...jm.map((j) => ({ g: "Jobs", logo: j.co, label: j.t, sub: `${j.co} · ${fmt.ago(j.p)}`, run: () => openJob(j.id) })));
        const cos = jobs.companies.filter((c) => norm(c).includes(n)).slice(0, 4);

      }
    }
    return res;
  }, [q, jobs.status, s]);
  useEffect(() => setSel(0), [q]);
  useEffect(() => { listRef.current?.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" }); }, [sel]);
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel((x) => Math.min(items.length - 1, x + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel((x) => Math.max(0, x - 1)); }
    else if (e.key === "Enter") { e.preventDefault(); const it = items[sel]; if (it) { close(); setTimeout(it.run, 0); } }
  };
  let lastG = null;
  return html`<${Fragment}>

    </div>

}

/* ===== Global keyboard shortcuts ===== */
function useShortcuts() {
  useEffect(() => {
    let gPending = 0;
    const typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && store.get().profile.onboarded) { e.preventDefault(); ui.set({ palette: !ui.state.palette }); return; }
      if (typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
      if (!store.get().profile.onboarded) return;
      if (ui.state.palette || ui.state.modal) return;
      const k = e.key;
      if (gPending && now() - gPending < 1200) {
        gPending = 0;
        const map = { t: "today", f: "find", p: "pipeline", c: "companies", i: "prep", s: "stats", ",": "prefs" };
        if (map[k.toLowerCase()]) { e.preventDefault(); closeDrawer(); go(map[k.toLowerCase()]); }
        return;
      }
      if (k === "g") { gPending = now(); return; }
      if (k === "?") { e.preventDefault(); openModal("shortcuts"); return; }
      if (ui.state.drawer?.kind === "app" && /^[1-7]$/.test(k)) { e.preventDefault(); Apps.move(ui.state.drawer.id, STAGES[+k - 1].id); return; }
      if (ui.state.drawer) return;
      if (k === "n") { e.preventDefault(); openModal("add"); }
      else if (k === "e") { e.preventDefault(); openModal("paste"); }
      else if (k === "/") { e.preventDefault(); go("find"); setTimeout(() => document.getElementById("find-q")?.focus(), 60); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
}

  return html`<div class="toasts" role="status" aria-live="polite">${toasts.map((t) => html`<div class="toast" key=${t.id}><${Icon} name="check" /><span>${t.text}</span>${t.action && html`<button type="button" onClick=${() => { t.action.run(); ui.set((s) => ({ toasts: s.toasts.filter((x) => x.id !== t.id) })); }}>${t.action.label}</button>`}${t.undo && html`<button type="button" onClick=${() => { t.undo(); ui.set((s) => ({ toasts: s.toasts.filter((x) => x.id !== t.id) })); }}>Undo</button>`}</div>`)}</div>`;

    ${showOnboard && html`<${VIEWS.__onboarding} />`}

    <${Celebrate} />
  </div>`;
}

/* --- js/views/find.js --- */
/* ===== Find jobs · Job drawer · Companies · Company drawer =====
   Area-private helpers are prefixed find_. Filters live in store.ui.findFilters
   (null = follow the profile's preferences). */

const FIND_PAGE = 60;
const FIND_POSTED = [
  { id: "any", label: "Any", title: "Any time" }, { id: "1", label: "24h", title: "Last 24 hours" },
  { id: "3", label: "3d", title: "Last 3 days" }, { id: "7", label: "7d", title: "Last 7 days" }, { id: "30", label: "30d", title: "Last 30 days" },
];
const FIND_VISA = [{ id: "any", label: "Any" }, { id: "yes", label: "Offers sponsorship" }, { id: "nocit", label: "Hide citizenship-required" }];
const FIND_SORTS = [{ id: "new", label: "Newest" }, { id: "fit", label: "Best fit" }, { id: "ghost", label: "Fewest ghost signals" }];
const FIND_ATS = { greenhouse: "Greenhouse", lever: "Lever", ashby: "Ashby", workday: "Workday" };
const FIND_DEG = { BS: "Bachelor's", MS: "Master's", PhD: "PhD", AS: "Associate's", MBA: "MBA", Cert: "Certificate" };
const FIND_LV = { intern: "Internship", newgrad: "New grad" };

/* ---------- filter state ---------- */
const find_blank = () => ({ lv: [], roles: [], locs: [], posted: "any", visa: "any", hideGhost: false });
function find_prefFilters(p) {
  const known = (id) => LOC_OPTIONS.some((o) => o.id === id);
  const locs = (p.locations || []).filter(known);
  if (p.remote && locs.length && !locs.includes("remote")) locs.push("remote");
  return { ...find_blank(), lv: [...(p.levels || [])], roles: [...(p.roles || [])], locs };
}
const find_hasPrefs = (p) => !!((p.roles || []).length || (p.locations || []).filter((id) => LOC_OPTIONS.some((o) => o.id === id)).length || ((p.levels || []).length === 1));
const find_pfC = { p: null, f: null };
function find_getFilters(s) {
  if (s.ui.findFilters) return s.ui.findFilters;
  if (find_pfC.p !== s.profile) { find_pfC.p = s.profile; find_pfC.f = find_prefFilters(s.profile); }
  return find_pfC.f;
}
function find_setFilters(patch) {
  store.set((s) => ({ ...s, ui: { ...s.ui, findFilters: patch === null ? null : { ...find_getFilters(s), ...patch } } }));
}
function find_clearAll() { store.set((s) => ({ ...s, ui: { ...s.ui, findFilters: find_blank() } })); }
const find_sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
function find_isPrefs(f, p) {
  const pf = find_prefFilters(p);
  return find_sameSet(f.lv, pf.lv) && find_sameSet(f.roles, pf.roles) && find_sameSet(f.locs, pf.locs);
}
function find_activeCount(f) {
  return (f.lv.length ? 1 : 0) + (f.roles.length ? 1 : 0) + (f.locs.length ? 1 : 0) + (f.posted !== "any" ? 1 : 0) + (f.visa !== "any" ? 1 : 0) + (f.hideGhost ? 1 : 0);
}
const find_toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
const find_state = { q: "" }; // mirrors the debounced search so the mobile filter modal can count matches

/* ---------- per-job location bitmask (computed once per dataset) ---------- */
const find_locC = { jobs: null, m: null };
function find_locMasks(jobs) {
  if (find_locC.jobs !== jobs) {
    const m = new Map();
    for (const j of jobs) { let b = 0; LOC_OPTIONS.forEach((o, i) => { if (jobInLoc(j, o.id)) b |= 1 << i; }); m.set(j.id, b); }
    find_locC.jobs = jobs; find_locC.m = m;
  }
  return find_locC.m;
}
const find_locBit = (id) => 1 << LOC_OPTIONS.findIndex((o) => o.id === id);

/* ---------- filtering: one pass that also yields facet counts ---------- */
const find_cmpC = { jobs: null, f: null, q: null, out: null };
function find_compute(jobs, f, q) {
  if (find_cmpC.jobs === jobs && find_cmpC.f === f && find_cmpC.q === q) return find_cmpC.out;
  const out = find_run(jobs, f, q, true);
  Object.assign(find_cmpC, { jobs, f, q, out });
  return out;
}
function find_run(jobs, f, q, facets) {
  const masks = find_locMasks(jobs);
  const words = norm(q).split(" ").filter(Boolean);
  const locMask = f.locs.reduce((b, id) => b | find_locBit(id), 0);
  const minP = f.posted === "any" ? 0 : now() - +f.posted * DAY;
  const res = [];
  const cLv = {}, cRole = {}, cLoc = new Array(LOC_OPTIONS.length).fill(0);
  for (const j of jobs) {
    if (j.p < minP) continue;
    if (f.visa === "yes" && j.sp !== "yes") continue;
    if (f.visa === "nocit" && j.sp === "citizen") continue;
    if (f.hideGhost && j.g >= 50) continue;
    if (words.length) { let ok = true; for (const w of words) if (!j._s.includes(w)) { ok = false; break; } if (!ok) continue; }
    const m = masks.get(j.id) || 0;
    const okLv = !f.lv.length || f.lv.includes(j.lvl);
    const okRole = !f.roles.length || f.roles.includes(j.cat);
    const okLoc = !locMask || (m & locMask) !== 0;
    if (okLv && okRole && okLoc) res.push(j);
    if (!facets) continue;
    if (okRole && okLoc) cLv[j.lvl] = (cLv[j.lvl] || 0) + 1;
    if (okLv && okLoc) cRole[j.cat] = (cRole[j.cat] || 0) + 1;
    if (okLv && okRole && m) for (let i = 0; i < cLoc.length; i++) if (m & (1 << i)) cLoc[i]++;
  }
  return { res, cLv, cRole, cLoc };
}

/* fit cache (one map per profile object) */
const find_fitC = { p: null, m: new Map() };
function find_fit(job, profile) {
  if (find_fitC.p !== profile) { find_fitC.p = profile; find_fitC.m = new Map(); }
  if (!find_fitC.m.has(job.id)) find_fitC.m.set(job.id, fitScore(job, profile));
  return find_fitC.m.get(job.id);
}
function find_sort(res, sort, profile) {
  if (sort === "fit") {
    const sc = (j) => find_fit(j, profile)?.score ?? -1;
    return [...res].sort((a, b) => sc(b) - sc(a) || b.p - a.p);
  }
  if (sort === "ghost") return [...res].sort((a, b) => a.g - b.g || b.p - a.p);
  return res; // jobs already arrive newest first
}

/* ---------- tracking helpers ---------- */
function find_untrack(id) { store.set((s) => { const apps = { ...s.apps }; delete apps[id]; return { ...s, apps }; }); }
function find_restore(a) { store.set((s) => ({ ...s, apps: { ...s.apps, [a.id]: a } })); }
function find_appFields(job) { return { company: job.co, title: job.t, location: (job.l || [])[0] || "", url: job.url, jobId: job.id, source: "find" }; }
function find_toggleSave(job, app) {
  if (app && app.stage === "saved") { find_untrack(app.id); toast(`Removed ${job.co} from saved`, { undo: () => find_restore(app) }); return; }
  if (app) return;
  const a = Apps.create({ ...find_appFields(job), stage: "saved" });
  toast(`Saved ${job.co} to your pipeline`, { undo: () => find_untrack(a.id) });
}
function find_markApplied(job, app) {
  if (app) { Apps.move(app.id, "applied"); return; }
  const a = Apps.create({ ...find_appFields(job), stage: "applied", appliedAt: now() });
  toast(`Marked ${job.co} as applied`, { undo: () => find_untrack(a.id) });
}
function find_useAppsByJob() {
  const apps = useStore((s) => s.apps);
  return useMemo(() => { const m = new Map(); for (const a of Object.values(apps)) if (a.jobId) m.set(a.jobId, a); return m; }, [apps]);
}

/* ---------- formatting ---------- */
function find_locText(job) {
  const first = (job.l || [])[0] || "Location not listed";
  const more = (job.nl || (job.l || []).length) - 1;
  return more > 0 ? `${first} +${more} more` : first;
}
function find_metaText(job) {
  return [job.co, find_locText(job), FIND_LV[job.lvl] || "", job.term].filter(Boolean).join(" · ");
}
function find_atsName(job) {
  if (FIND_ATS[job.ats]) return FIND_ATS[job.ats];
  try { return new URL(job.url).hostname.replace(/^www\./, ""); } catch { return "Employer site"; }
}
function find_visaText(sp) {
  return { yes: "Offers sponsorship", no: "Does not offer sponsorship", citizen: "U.S. citizenship required" }[sp] || "Not stated in the listing";
}
function find_season(cs) {
  const se = cs?.season;
  if (!se || !se.posted) return null;
  const share = se.open / se.posted;
  const since = se.lastNew ? (now() - se.lastNew * 1000) / DAY : null;
  let read = "", tone = "";
  if (since != null && since <= 7) { read = "Still adding roles"; tone = "ok"; }
  else if (share < 0.15 && since != null && since > 21) { read = "Most of this season's roles have closed"; tone = "wait"; }
  const line = `${pluralize(se.posted, "internship posting")} this season · ${fmt.num(se.open)} still open${se.lastNew ? ` · last new posting ${fmt.ago(se.lastNew * 1000)}` : ""}`;
  return { ...se, share, since, read, tone, line };
}
const find_daysText = (d) => (d == null ? null : `~${Math.max(1, Math.round(d))} ${Math.round(d) === 1 ? "day" : "days"}`);
const find_typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);

/* ---------- shared row ---------- */
function find_Row({ job, app, profile, i, sel, onSelect, inCompany }) {
  const fit = profile ? find_fit(job, profile) : null;
  const open = () => { onSelect && onSelect(i); openJob(job.id); };
  const saved = app && app.stage === "saved";
  const metaT = inCompany ? [find_locText(job), FIND_LV[job.lvl], job.term].filter(Boolean).join(" · ") : find_metaText(job);
  return html`<div class=${cx("job-row find-row", inCompany && "find-row-co")} role="listitem" data-find-i=${i} aria-selected=${sel ? "true" : "false"} onClick=${open}>
    ${!inCompany && html`<${Logo} name=${job.co} />`}
    <div class="find-row-main">
      <button type="button" class="find-row-title" onClick=${(e) => { e.stopPropagation(); open(); }} title=${job.t}>${job.t}</button>
      <div class="find-row-meta" title=${metaT}>${metaT}</div>
    </div>
    <div class="find-side">
      <span class="find-c-fit">${fit && html`<span class=${cx("fit", fit.score >= 75 && "hi")} title=${`Fit ${fit.score}/100 from role, level, location${profile.needsSponsor ? ", visa" : ""} and skills`}>Fit ${fit.score}</span>`}</span>
      <span class="find-c-fresh"><${Fresh} ts=${job.p} /></span>
      <span class="find-c-ghost"><${GhostScore} g=${job.g} compact /></span>
      <span class="find-c-act" onClick=${(e) => e.stopPropagation()}>
        ${app && !saved
          ? html`<button type="button" class="find-stage" onClick=${() => openApp(app.id)} title="Open in pipeline"><${StageBadge} stage=${app.stage} /></button>`
          : html`<${Btn} kind="ghost" size="sm" icon=${saved ? "bookmarkOn" : "bookmark"} cls=${cx("find-save", saved && "on")} aria-pressed=${saved ? "true" : "false"} aria-label=${saved ? `Remove ${job.t} at ${job.co} from saved` : `Save ${job.t} at ${job.co}`} title=${saved ? "Saved. Click to remove" : "Save to pipeline (S)"} onClick=${() => find_toggleSave(job, app)} />`}
      </span>
    </div>
  </div>`;
}

/* ---------- filter controls (sidebar and mobile modal) ---------- */
function find_FilterControls({ px, f, counts, profile }) {
  const n = (x) => html`<span class="find-chip-n">${fmt.num(x || 0)}</span>`;
  const roles = CATS.concat(counts.cRole.Other ? ["Other"] : []);

    <div class="filter-group" role="group" aria-labelledby=${px + "-lv"}>
      <h4 id=${px + "-lv"}>Level</h4>
      <div class="chips">${LEVELS.map((l) => html`<${Chip} key=${l.id} on=${f.lv.includes(l.id)} onClick=${() => find_setFilters({ lv: find_toggle(f.lv, l.id) })}>${l.label}${n(counts.cLv[l.id])}</${Chip}>`)}</div>
    </div>

      <h4 id=${px + "-role"}>Role</h4>
      <div class="chips">${roles.map((r) => html`<${Chip} key=${r} on=${f.roles.includes(r)} onClick=${() => find_setFilters({ roles: find_toggle(f.roles, r) })}>${r}${n(counts.cRole[r])}</${Chip}>`)}</div>
    </div>
    <div class="filter-group" role="group" aria-labelledby=${px + "-loc"}>

      <div class="chips">${LOC_OPTIONS.map((o, i) => html`<${Chip} key=${o.id} on=${f.locs.includes(o.id)} onClick=${() => find_setFilters({ locs: find_toggle(f.locs, o.id) })}>${o.label}${n(counts.cLoc[i])}</${Chip}>`)}</div>
    </div>
    <div class="filter-group">
      <h4>Posted</h4>
      <${Seg} label="Posted within" value=${f.posted} options=${FIND_POSTED} onChange=${(v) => find_setFilters({ posted: v })} />
    </div>
    <div class="filter-group" role="group" aria-labelledby=${px + "-visa"}>
      <h4 id=${px + "-visa"}>Visa</h4>
      <div class="chips">${FIND_VISA.map((v) => html`<${Chip} key=${v.id} on=${f.visa === v.id} onClick=${() => find_setFilters({ visa: v.id })}>${v.label}</${Chip}>`)}</div>
      ${f.visa === "yes" && html`<span class="hint">Very few listings state sponsorship either way, so this filter hides most jobs.</span>`}
    </div>
    <div class="filter-group">
      <h4>Ghost jobs</h4>

      <span class="hint">Hides listings with several warning signs (score 50 or more).</span>
    </div>
    ${find_activeCount(f) > 0 && html`<div><${Btn} kind="ghost" size="sm" icon="x" onClick=${find_clearAll}>Clear filters</${Btn}></div>`}

}

MODALS.findFilters = () => {
  const jobs = useJobs();
  const s = useStore();
  const f = find_getFilters(s);
  const counts = jobs.status === "ready" ? find_compute(jobs.jobs, f, find_state.q) : { res: [], cLv: {}, cRole: {}, cLoc: [] };
  return html`<${Modal} title="Filters" onClose=${closeModal} foot=${html`
    <${Btn} kind="ghost" onClick=${find_clearAll} disabled=${!find_activeCount(f)}>Clear filters</${Btn}>
    <span class="spacer" style="flex:1"></span>
    <${Btn} kind="primary" onClick=${closeModal}>Show ${fmt.num(counts.res.length)} ${counts.res.length === 1 ? "match" : "matches"}</${Btn}>`}>
    <${find_FilterControls} px="find-m" f=${f} counts=${counts} profile=${s.profile} />
  </${Modal}>`;
};

/* ---------- VIEWS.find ---------- */
VIEWS.find = function FindView() {
  const jobs = useJobs();
  const s = useStore();
  const profile = s.profile;
  const f = find_getFilters(s);
  const sort = s.ui.findSort || "new";
  const byJob = find_useAppsByJob();
  const [qIn, setQIn] = useState(find_state.q);
  const [q, setQ] = useState(find_state.q);
  const [shown, setShown] = useState(FIND_PAGE);
  const [sel, setSel] = useState(-1);
  const sentinel = useRef(null);

  useEffect(() => { const t = setTimeout(() => { setQ(qIn); find_state.q = qIn; }, 120); return () => clearTimeout(t); }, [qIn]);

  const ready = jobs.status === "ready";
  const counts = useMemo(() => (ready ? find_compute(jobs.jobs, f, q) : null), [ready, jobs.jobs, f, q]);
  const list = useMemo(() => (counts ? find_sort(counts.res, sort, profile) : []), [counts, sort, profile]);
  useEffect(() => { setShown(FIND_PAGE); setSel(-1); }, [list]);

  // auto-load more as the sentinel scrolls into view
  useEffect(() => {
    const el = sentinel.current;
    if (!el || shown >= list.length || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) setShown((n) => Math.min(list.length, n + FIND_PAGE)); }, { rootMargin: "400px" });
    io.observe(el);
    return () => io.disconnect();
  }, [shown, list]);

  // J / K / Enter / S
  const kref = useRef({}); kref.current = { list, sel, shown, byJob };
  useEffect(() => {
    let lastG = 0;
    const onKey = (e) => {
      if (find_typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
      if (ui.state.modal || ui.state.palette || ui.state.drawer) return;
      const k = e.key.toLowerCase();
      if (k === "g") { lastG = now(); return; }
      if (now() - lastG < 1200) { lastG = 0; return; } // let the shell handle "G then …"
      const { list, sel, shown, byJob } = kref.current;
      if (!list.length) return;
      if (k === "j" || k === "k") {
        e.preventDefault();
        const next = clamp(sel + (k === "j" ? 1 : -1), 0, list.length - 1);
        if (next >= shown) setShown(Math.min(list.length, next + FIND_PAGE));
        setSel(next);
        setTimeout(() => document.querySelector(`.find-results [data-find-i="${next}"]`)?.scrollIntoView({ block: "nearest" }), 0);
      } else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); openJob(list[sel].id); }
      else if (k === "s" && sel >= 0) { e.preventDefault(); const j = list[sel]; find_toggleSave(j, byJob.get(j.id)); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const meta = jobs.meta || {};
  const st = meta.stats || {};
  const genAt = meta.generatedAt ? Date.parse(meta.generatedAt) : null;
  const usingPrefs = find_hasPrefs(profile) && find_isPrefs(f, profile);
  const nActive = find_activeCount(f);

  const head = html`<div class="page-head">
    <div>
      <h1>Find jobs</h1>
      <p>${ready
        ? html`<span class="num">${fmt.num(st.active || jobs.jobs.length)}</span> open internship and new-grad roles from <span class="num">${fmt.num(st.companies || jobs.byCompany.size)}</span> companies${genAt ? ` · updated ${fmt.ago(genAt)}` : ""}`
        : "Open internship and new-grad roles, checked for ghost-job signals."}</p>
    </div>
  </div>`;

  if (!ready) {
    return html`<div class="page find-page">${head}
      <div class="find-layout">
        <aside class="filters find-aside" aria-label="Filters">${[0, 1, 2].map((i) => html`<div class="filter-group" key=${i}><div class="skel" style="height:10px;width:60px"></div><div class="skel" style="height:30px;width:100%"></div></div>`)}</aside>
        <div class="stack">
          ${jobs.status === "error"
            ? html`<div class="card"><${Empty} icon="alert" title="Couldn't load job listings" action=${html`<${Btn} kind="primary" icon="refresh" onClick=${() => loadJobs()}>Try again</${Btn}>`}>The listings file didn't load (${jobs.error || "unknown error"}). Check your connection and try again.</${Empty}></div>`
            : html`<div class="card find-results"><${Skeleton} rows=${9} /></div>`}
        </div>
      </div>
    </div>`;
  }

  // empty-state suggestion: which single change brings back the most jobs
  let suggestion = null;
  if (!list.length) {
    const cands = [];
    if (q) cands.push({ label: "Clear the search", desc: "Clearing the search", run: () => { setQIn(""); setQ(""); find_state.q = ""; }, n: find_run(jobs.jobs, f, "", false).res.length });
    const tries = [["locs", [], "Any location", "Removing the location filter"], ["roles", [], "Any role", "Removing the role filter"], ["lv", [], "Any level", "Removing the level filter"], ["posted", "any", "Any posting date", "Removing the date filter"], ["visa", "any", "Any visa status", "Removing the visa filter"], ["hideGhost", false, "Show listings with strong ghost signals", "Showing listings with strong ghost signals"]];
    for (const [k, v, label, desc] of tries) {
      const cur = f[k]; if (Array.isArray(cur) ? !cur.length : cur === v) continue;
      cands.push({ label, desc, run: () => find_setFilters({ [k]: v }), n: find_run(jobs.jobs, { ...f, [k]: v }, q, false).res.length });
    }
    suggestion = cands.filter((c) => c.n > 0).sort((a, b) => b.n - a.n)[0] || null;
  }

  const rows = list.slice(0, shown);
  return html`<div class="page find-page">
    ${head}
    <div class="find-layout">
      <aside class="filters find-aside" aria-label="Filters">
        <${find_FilterControls} px="find-f" f=${f} counts=${counts} profile=${profile} />
      </aside>
      <div class="stack find-main">
        <div class="find-toolbar">
          <div class="input-icon find-search">
            <${Icon} name="search" />
            <input id="find-q" class="input" type="search" placeholder="Search title, company or location" value=${qIn} onInput=${(e) => setQIn(e.currentTarget.value)} onKeyDown=${(e) => { if (e.key === "Escape" && qIn) { e.stopPropagation(); setQIn(""); } else if (e.key === "Enter") { setQ(qIn); find_state.q = qIn; } }} aria-label="Search jobs" autocomplete="off" />
            ${!qIn && html`<span class="kbd find-kbd hide-sm">/</span>`}
          </div>
          <${Btn} cls="find-fbtn" icon="filter" onClick=${() => openModal("findFilters")} aria-label=${`Filters${nActive ? `, ${nActive} active` : ""}`}>Filters${nActive ? html`<span class="find-fcount num">${nActive}</span>` : null}</${Btn}>
        </div>
        <div class="find-bar">
          <div class="find-count">
            <strong class="num">${fmt.num(list.length)}</strong> ${list.length === 1 ? "match" : "matches"}
            ${find_hasPrefs(profile) && (usingPrefs
              ? html`<span class="find-prefs"><span class="sep">·</span>Using your preferences<span class="sep">·</span><button type="button" class="find-link" onClick=${find_clearAll}>Show all</button></span>`
              : html`<span class="find-prefs"><span class="sep">·</span><button type="button" class="find-link" onClick=${() => find_setFilters(null)}>Use my preferences</button></span>`)}
          </div>
          <span class="spacer"></span>
          <div class="find-sort hide-sm"><${Seg} label="Sort by" value=${sort} options=${FIND_SORTS} onChange=${(v) => store.set((x) => ({ ...x, ui: { ...x.ui, findSort: v } }))} /></div>
          <select id="find-sort-sm" class="select find-sort-sm show-sm" aria-label="Sort by" value=${sort} onChange=${(e) => { const v = e.currentTarget.value; store.set((x) => ({ ...x, ui: { ...x.ui, findSort: v } })); }}>
            ${FIND_SORTS.map((o) => html`<option key=${o.id} value=${o.id}>${o.label}</option>`)}
          </select>
        </div>
        ${list.length

/* ---------- Claude helper hook ---------- */
function find_useAI() {
  const [st, setSt] = useState({ busy: false, err: "", out: null, partial: "" });
  const ctl = useRef(null);
  useEffect(() => () => ctl.current?.abort(), []);
  const run = async (fn) => {
    ctl.current?.abort();
    const c = new AbortController(); ctl.current = c;
    setSt({ busy: true, err: "", out: null, partial: "" });
    try {
      const out = await fn(c.signal, (partial) => { if (!c.signal.aborted) setSt((x) => ({ ...x, partial })); });
      if (!c.signal.aborted) setSt({ busy: false, err: "", out, partial: "" });
    } catch (e) {
      if (c.signal.aborted || e?.name === "AbortError" || e?.code === "aborted") setSt((x) => ({ ...x, busy: false }));
      else setSt({ busy: false, err: aiErr(e), out: null, partial: "" });
    }
  };
  const stop = () => { ctl.current?.abort(); setSt((x) => ({ ...x, busy: false })); };
  return [st, run, stop];
}
function find_Thinking({ onStop, text }) {
  return html`<div class="find-think"><span class="find-pulse" aria-hidden="true"></span><span class="muted">${text || "Thinking…"}</span><span class="spacer" style="flex:1"></span><${Btn} size="sm" onClick=${onStop}>Stop</${Btn}></div>`;
}

const CO_SORTS = [{ id: "open", label: "Most open roles" }, { id: "hiring", label: "Still hiring" }, { id: "fast", label: "Fastest to close" }, { id: "ghost", label: "Fewest ghost signals" }, { id: "az", label: "A–Z" }];
const find_stillShare = (c) => (c.season && c.season.posted ? c.season.open / c.season.posted : null);
const find_ghostShareC = { jobs: null, m: null };
function find_ghostShare(jobsState) {
  if (find_ghostShareC.jobs !== jobsState.jobs) {
    const m = new Map();
    for (const [co, list] of jobsState.byCompany) { let g = 0; for (const j of list) if (j.g >= 50) g++; m.set(co, list.length ? g / list.length : 0); }
    find_ghostShareC.jobs = jobsState.jobs; find_ghostShareC.m = m;
  }
  return find_ghostShareC.m;
}
function find_useAppsByCompany() {
  const s = useStore();
  return useMemo(() => { const m = new Map(); for (const a of Apps.list(s)) { const k = norm(a.company); m.set(k, (m.get(k) || 0) + 1); } return m; }, [s.apps, s.settings.showExamples]);
}

function find_Brief({ name, cs }) {
  const key = `heardback:find:brief:${name}`;
  const cached = storage.get(key, null);
  const fresh = cached && now() - cached.at < DAY ? cached : null;
  const [st, run, stop] = find_useAI();
  const text = st.out || st.partial || (fresh && fresh.text) || "";
  const go = () => run(async (signal, onPartial) => {
    const cats = Object.entries(cs?.cats || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} (${v})`).join(", ");
    const prompt = `Write a short, neutral overview of the company "${name}" for a student weighing an internship or new-grad role there.
Use 4 to 6 bullets starting with "- ": what the company does, rough size or stage, main products, and anything useful to know as an early-career applicant.
Only state things you are confident about from general knowledge. If you don't know this company well, or the name is ambiguous, say so in one sentence and stop. Do not guess about hiring practices, culture or response rates. Plain text, no headings, no bold.
For context, public listing data currently shows ${cs?.open || 0} open roles${cats ? ` in ${cats}` : ""}${(cs?.locs || []).length ? `, mostly in ${cs.locs.slice(0, 3).join("; ")}` : ""}.`;
    const r = await askClaude(prompt, { signal, modelTier: "quick", onText: ({ text }) => onPartial(text) });
    const out = (r?.text || "").trim();
    if (out) storage.set(key, { at: now(), text: out });
    return out;
  });
  return html`<section class="card" aria-labelledby="find-brief-h">
    <div class="card-head"><h3 id="find-brief-h">Company overview</h3><span class="spacer"></span>${!st.busy && html`<${Btn} size="sm" icon="spark" onClick=${go}>${text ? "Refresh" : "Brief me on this company"}</${Btn}>`}</div>
    <div class="card-body stack-sm">
      ${st.busy && html`<${find_Thinking} onStop=${stop} text=${st.partial ? "Writing…" : "Thinking…"} />`}
      ${text ? html`<div class="ai-box">${text}</div>` : !st.busy && html`<p class="muted find-small">Claude can write a quick overview from its general knowledge.</p>`}
      ${st.err && html`<div class="callout wait"><${Icon} name="alert" /><span>${st.err}</span></div>`}
      ${text && html`<span class="ai-label"><${Icon} name="spark" />AI-generated from Claude's general knowledge. May be out of date. Verify before relying on it.${fresh && !st.out && !st.busy ? ` Saved ${fmt.ago(fresh.at)}.` : ""}</span>`}
    </div>
  </section>`;
}

/* --- js/views/onboarding.js --- */
/* ===== Onboarding (first run) + shared resume editor =====
   Three steps: targets -> resume (optional) -> live matching roles. Finishable in under a minute.
   Shared with prefs.js: OnbResumeEditor, onbEditorInit, onbEditorSkills, onbToggle, onbLocChoices. */

const onbToggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
const onbLocChoices = () => LOC_OPTIONS.filter((o) => o.id !== "remote");
const ONB_SKILL_NAMES = SKILLS.map((s) => s[0]);

/* ---------- Resume editor state: text + manual adds/removals on top of detected skills ---------- */
function onbEditorInit(profile) {
  const text = profile.resume || "";
  const det = extractSkills(text);
  const skills = profile.skills || [];
  return { text, added: skills.filter((s) => !det.includes(s)), removed: det.filter((s) => !skills.includes(s)) };
}
function onbEditorSkills(v) {
  const det = extractSkills(v.text).filter((s) => !v.removed.includes(s));
  return [...det, ...v.added.filter((s) => !det.includes(s))];
}
function onbCleanSkill(raw) {
  const t = (raw || "").trim().replace(/\s+/g, " ").slice(0, 40);
  if (!t) return "";
  const known = ONB_SKILL_NAMES.find((n) => n.toLowerCase() === t.toLowerCase());
  return known || t;
}

function OnbResumeEditor({ value, onChange, idp = "res" }) {
  const [add, setAdd] = useState("");
  const [fileNote, setFileNote] = useState(null);
  const skills = onbEditorSkills(value);
  const detected = extractSkills(value.text);
  const setText = (text) => onChange({ ...value, text });
  const remove = (s) => onChange(detected.includes(s) ? { ...value, removed: [...value.removed, s] } : { ...value, added: value.added.filter((x) => x !== s) });
  const addSkill = () => {
    const s = onbCleanSkill(add);
    if (!s) return;
    setAdd("");
    if (skills.some((x) => x.toLowerCase() === s.toLowerCase())) return;
    if (detected.includes(s)) onChange({ ...value, removed: value.removed.filter((x) => x !== s) });
    else onChange({ ...value, added: [...value.added, s] });
  };
  const onFile = (e) => {
    const f = e.currentTarget.files && e.currentTarget.files[0];
    e.currentTarget.value = "";
    if (!f) return;
    if (/\.(txt|md|markdown|text)$/i.test(f.name) || /^text\//.test(f.type)) {
      const r = new FileReader();
      r.onload = () => { setText(String(r.result || "").slice(0, 40000)); setFileNote({ ok: true, text: `Read ${f.name}. Check the text below.` }); };
      r.onerror = () => setFileNote({ ok: false, text: `Couldn't read ${f.name}. Paste the text instead.` });
      r.readAsText(f);
    } else {
      setFileNote({ ok: false, text: `${/\.pdf$/i.test(f.name) ? "PDF" : /\.docx?$/i.test(f.name) ? "Word" : "That"} files can't be read here. Open it, copy all the text, and paste it below. Files stay on your device.` });
    }
  };
  const words = (value.text.trim().match(/\S+/g) || []).length;
  return html`<div class="stack onb-resume">
    <div class="onb-resume-head">
      <label class="label" for=${idp + "-text"}>Resume text</label>
      <span class="spacer"></span>
      <label class="btn sm onb-file"><${Icon} name="upload" />Upload .txt or .md<input id=${idp + "-file"} class="sr" type="file" accept=".txt,.md,.markdown,.pdf,.doc,.docx,text/plain,text/markdown" onChange=${onFile} /></label>
    </div>
    ${fileNote && html`<div class=${cx("callout", fileNote.ok ? "info" : "wait")} role="status"><${Icon} name=${fileNote.ok ? "check" : "info"} /><span>${fileNote.text}</span></div>`}
    <textarea id=${idp + "-text"} class="textarea onb-textarea" placeholder="Paste the text of your resume here. Experience, projects, skills: plain text is fine." value=${value.text} onInput=${(e) => setText(e.currentTarget.value)}></textarea>
    <div class="row onb-meta"><span class="hint num">${words ? pluralize(words, "word") : "Nothing pasted yet"}</span>${value.text && html`<button type="button" class="onb-link" onClick=${() => setText("")}>Clear text</button>`}</div>
    <div class="stack-sm">
      <div class="row"><span class="label">Skills</span><span class="faint num" style="font-size:var(--fs-xs)">${skills.length || ""}</span></div>
      <span class="hint">${value.text ? "Found in your resume. Remove any that don't fit and add ones we missed." : "We'll pick these up from your resume. You can also add them by hand."}</span>
      ${skills.length ? html`<div class="chips">${skills.map((s) => html`<button type="button" key=${s} class="chip onb-skill" aria-pressed="true" aria-label=${"Remove " + s} title=${"Remove " + s} onClick=${() => remove(s)}>${s}<${Icon} name="x" size=${12} /></button>`)}</div>` : null}
      <form class="row onb-add" onSubmit=${(e) => { e.preventDefault(); addSkill(); }}>
        <input id=${idp + "-add"} class="input" list=${idp + "-skill-list"} placeholder="Add a skill, e.g. SQL" value=${add} onInput=${(e) => setAdd(e.currentTarget.value)} aria-label="Add a skill" autocomplete="off" />
        <datalist id=${idp + "-skill-list"}>${ONB_SKILL_NAMES.filter((n) => !skills.includes(n)).map((n) => html`<option key=${n} value=${n} />`)}</datalist>
        <${Btn} type="submit" icon="plus" disabled=${!add.trim()}>Add</${Btn}>
      </form>
    </div>
    <p class="onb-privacy"><${Icon} name="shield" /><span>Your resume stays in this browser. It's only sent to Claude when you click an AI action.</span></p>
  </div>`;
}

/* ---------- Matching (step 3) ---------- */
function onbGenTs(meta) {
  const g = meta && meta.generatedAt; if (!g) return null;
  const t = typeof g === "number" ? (g < 1e12 ? g * 1000 : g) : Date.parse(g);
  return isNaN(t) ? null : t;
}
function onbMatches(jobs, p) {
  const lv = p.levels.length ? p.levels : ["intern", "newgrad"];
  const locs = p.locations.filter((l) => l !== "remote");
  const out = [];
  for (const j of jobs) {
    if (!lv.includes(j.lvl)) continue;
    if (p.roles.length && !p.roles.includes(j.cat)) continue;
    if (locs.length && !(locs.some((l) => jobInLoc(j, l)) || (p.remote && j.r))) continue;
    if (!locs.length && !p.remote && j.r && j.nl <= 1 && (j.l || []).every((x) => /remote/i.test(x))) continue;
    if (p.needsSponsor && (j.sp === "no" || j.sp === "citizen")) continue;
    out.push(j);
  }
  return out;
}
function onbTop(list, p, n = 5) {
  return list
    .map((j) => ({ j, f: fitScore(j, p) }))
    .sort((a, b) => (b.f?.score || 0) - (a.f?.score || 0) || (a.j.g || 0) - (b.j.g || 0) || b.j.p - a.j.p)
    .slice(0, n);
}
function onbSummary(p) {
  const lv = p.levels.length === 1 ? (p.levels[0] === "intern" ? "Internships" : "New grad roles") : "Internships and new grad roles";
  const roles = p.roles.length ? p.roles.join(", ") : "all roles";
  const locs = p.locations.filter((l) => l !== "remote").map((l) => LOC_OPTIONS.find((o) => o.id === l)?.label || l);
  const where = locs.length ? `${locs.slice(0, 3).join(", ")}${locs.length > 3 ? ` +${locs.length - 3}` : ""}${p.remote ? ", or remote" : ""}` : p.remote ? "any location, including remote" : "any location";
  return `${lv} · ${roles} · ${where}${p.needsSponsor ? " · sponsorship not ruled out" : ""}`;
}

}

      <div class="onb-switches">

        <${Switch} id="onb-sponsor" checked=${d.needsSponsor} onChange=${(v) => set({ needsSponsor: v })} label="I'll need visa sponsorship" />
      </div>

      <input id="onb-name" class="input onb-name" autocomplete="given-name" placeholder="e.g. Sam" value=${d.name} maxlength="40" onInput=${(e) => set({ name: e.currentTarget.value })} aria-labelledby="onb-g-name" />
    </${OnbGroup}>

function OnbStepMatches({ d, examples, setExamples }) {
  const J = useJobs();
  const list = useMemo(() => (J.status === "ready" ? onbMatches(J.jobs, d) : []), [J.status, J.jobs, d]);
  const top = useMemo(() => onbTop(list, d), [list, d]);
  const low = list.filter((j) => (j.g || 0) < 25).length;
  return html`<div class="stack onb-matches">
    <div class="card">
      ${J.status === "error"

VIEWS.__onboarding = function Onboarding() {
  const start = useMemo(() => store.get().profile, []);
  const [step, setStep] = useState(0);
  const [d, setD] = useState(() => ({
    levels: start.levels?.length ? start.levels : ["intern", "newgrad"], roles: start.roles || [], locations: start.locations || [],
    remote: start.remote !== false, needsSponsor: !!start.needsSponsor, name: start.name || "",
  }));
  const [res, setRes] = useState(() => onbEditorInit(start));
  const [examples, setExamples] = useState(false);
  const top = useRef(null);
  const set = (patch) => setD((x) => ({ ...x, ...patch }));

  useEffect(() => { top.current?.scrollTo?.({ top: 0 }); const h = document.getElementById("onb-title"); h && h.focus({ preventScroll: true }); }, [step]);
  const commit = (done) => {

  };
  const finish = () => {
    commit(true);

  };

  return html`<div class="onboard-wrap" ref=${top} role="dialog" aria-modal="true" aria-label="Set up Heardback">

const PL_MAIN = ["saved", "applied", "screen", "interview", "offer"];
const PL_CLOSED = ["rejected", "ghosted"];
const PL_OUTCOMES = [{ id: "pending", label: "Pending" }, { id: "passed", label: "Passed" }, { id: "failed", label: "Didn't pass" }, { id: "cancelled", label: "Cancelled" }];
const PL_MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

/* ---------- helpers ---------- */
function plUi(patch) { store.set((s) => ({ ...s, ui: { ...s.ui, ...patch } })); }
function plCollapsed(s) { return s.ui.pipelineCollapsed || { rejected: true, ghosted: true }; }
function plSetCollapsed(stage, v) { const c = plCollapsed(store.get()); plUi({ pipelineCollapsed: { ...c, [stage]: v } }); }
function plUpcoming(a, t = now()) {
  return (a.rounds || []).filter((r) => r.at && r.at > t && r.outcome !== "cancelled").sort((x, y) => x.at - y.at)[0] || null;
}
function plWhen(ts) {
  const d0 = fmt.startOfDay(now()), d1 = fmt.startOfDay(ts);
  const diff = Math.round((d1 - d0) / DAY);
  const day = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff > 1 && diff < 7 ? new Date(ts).toLocaleDateString(undefined, { weekday: "short" }) : fmt.date(ts);
  return `${day} ${fmt.time(ts)}`;
}
function plStageAt(a, stage) {
  const ev = [...(a.events || [])].reverse().find((e) => e.kind === "stage" && e.to === stage);
  return ev ? ev.at : null;
}
function plHref(u) { const x = (u || "").trim(); if (!x) return ""; return /^https?:\/\//i.test(x) ? x : `https://${x}`; }
function plFromDate(v) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3], 12).getTime() : null; }
function plFurthest(a) {
  let i = PL_MAIN.includes(a.stage) ? STAGE[a.stage].i : STAGE.applied.i;
  for (const e of a.events || []) if (e.to && PL_MAIN.includes(e.to)) i = Math.max(i, STAGE[e.to].i);
  if (!a.appliedAt && !PL_MAIN.includes(a.stage)) i = Math.max(i, 0);
  return i;
}
function plFocusCard(id) {
  setTimeout(() => { const el = document.querySelector(`[data-card="${id}"]`); if (el) { el.focus(); el.scrollIntoView({ block: "nearest", inline: "nearest" }); } }, 40);
}
function plSortInCol(list) {
  const t = now();
  return [...list].sort((x, y) => {
    const ux = plUpcoming(x, t), uy = plUpcoming(y, t);
    if (ux && uy) return ux.at - uy.at;
    if (ux) return -1; if (uy) return 1;
    return (y.lastActivityAt || 0) - (x.lastActivityAt || 0);
  });
}

function plFirstName(s) { return (s || "").replace(/\([^)]*\)/g, "").split(/[,&;]| and /)[0].trim(); }

/* Card / table status line */
function plStatus(a, st) {
  const t = now();
  const up = plUpcoming(a, t);
  if (up && !PL_CLOSED.includes(a.stage)) return { icon: "cal", tone: "accent", text: `${ROUND[up.type]?.label || "Round"} · ${plWhen(up.at)}`, title: fmt.dateTime(up.at) };
  if (a.stage === "saved") return { icon: "bookmark", text: `Saved ${fmt.ago(a.createdAt)}` };
  if (a.stage === "offer") return { icon: "trophy", tone: "ok", text: `Offer ${fmt.ago(plStageAt(a, "offer") || a.lastReplyAt || a.lastActivityAt)}` };
  if (a.stage === "rejected") return { icon: "x", text: `Closed ${fmt.ago(plStageAt(a, "rejected") || a.lastActivityAt)}` };
  if (a.stage === "ghosted") return { icon: "ghost", text: `Ghosted ${fmt.ago(plStageAt(a, "ghosted") || a.lastActivityAt)}` };
  const silent = Apps.daysSilent(a);
  if (silent >= st.followUpDays) return { icon: silent >= st.ghostDays ? "ghost" : "clock", tone: "wait", text: `Silent ${silent}d`, title: `No reply in ${silent} days` };
  if (a.stage === "applied") return { icon: "send", text: `Applied ${fmt.ago(a.appliedAt)}` };
  return { icon: "reply", text: `Replied ${fmt.ago(a.lastReplyAt || a.lastActivityAt)}` };
}

/* What to do next, used by the table (short) and the drawer callout */
function plNextStep(a, st) {
  const t = now();
  const up = plUpcoming(a, t);
  const silent = Apps.daysSilent(a);
  const label = (r) => ROUND[r.type]?.label || "Interview";
  if (PL_CLOSED.includes(a.stage)) return a.stage === "rejected"
    ? { kind: "closed", icon: "flag", short: "Closed", title: "This one is closed", sub: "If you had interviews, it's fair to ask for brief feedback. Otherwise, let it go." }
    : { kind: "closed", icon: "ghost", short: "Closed", title: "Marked as ghosted", sub: "If they reply after all, move it back to the right stage." };
  if (a.stage === "offer") return { kind: "offer", icon: "trophy", tone: "ok", short: "Get the offer in writing", title: "You have an offer", sub: "Ask for the offer in writing and the decision deadline before you reply." };
  if (up) return { kind: "upcoming", icon: "cal", tone: "info", round: up, short: `${label(up)} ${fmt.until(up.at)}`, title: `${label(up)} ${fmt.until(up.at)}`, sub: `${fmt.dateTime(up.at)}${up.interviewers ? " · with " + up.interviewers : ""}` };
  const past = (a.rounds || []).filter((r) => r.at && r.at <= t && r.outcome === "pending").sort((x, y) => y.at - x.at)[0];
  if (past && !past.thanked && t - past.at < 2 * DAY) return { kind: "thanks", icon: "send", tone: "info", round: past, short: "Send a thank-you", title: "Send a thank-you note", sub: `Your ${label(past).toLowerCase()} was ${fmt.ago(past.at)}. A short note within 24 hours helps.` };
  if (past) return { kind: "outcome", icon: "flag", round: past, short: "Log the outcome", title: `How did the ${label(past).toLowerCase()} go?`, sub: `It was ${fmt.ago(past.at)}. Log the outcome and a few notes while you remember.` };
  if (a.stage === "saved") return { kind: "saved", icon: "bolt", short: "Apply", title: "Apply, then mark it applied", sub: `You saved this ${fmt.ago(a.createdAt)}. Early applicants tend to hear back more often.` };
  if (silent >= st.ghostDays) return { kind: "ghost", icon: "ghost", tone: "wait", short: "Mark as ghosted?", title: `No reply in ${silent} days. Mark as ghosted?`, sub: "Most companies reply within 3 weeks if they're interested. Marking it keeps your board honest. You can move it back any time." };
  if (a.stage === "applied" && silent >= st.followUpDays && !a.followedUpAt) return { kind: "follow", icon: "reply", tone: "wait", short: "Follow up", title: "Send a follow-up", sub: `You applied ${silent} days ago and haven't heard back. A short, specific note is fine.` };
  if (a.stage === "applied") {
    const due = (a.followedUpAt || a.appliedAt || t) + st.followUpDays * DAY;
    return { kind: "wait", icon: "clock", short: a.followedUpAt ? "Waiting after follow-up" : "Wait for a reply", title: "Waiting for a reply", sub: a.followedUpAt ? `You followed up ${fmt.ago(a.followedUpAt)}.` : `Heardback will suggest a follow-up on ${fmt.date(due)} if you haven't heard back.` };
  }
  return { kind: "schedule", icon: "cal", short: "Add next round", title: "Add the next round when it's scheduled", sub: "Log the date, type and interviewers so Heardback can remind you to prep and send a thank-you." };
}

/* Email parsing on top of the shared rule-based parser (fixes listed in the pipeline report) */
function plBody(raw) { return (raw || "").replace(/\r/g, "").split("\n").filter((l) => !/^\s*(from|to|cc|bcc|subject|date|sent|reply-to):/i.test(l)).join("\n"); }
function plFindTime(raw) {
  const body = plBody(raw);
  const re = /\b(?:(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*\.?,?\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b(?:,?\s+(\d{4}))?/gi;
  let m;
  while ((m = re.exec(body))) {
    const mon = PL_MONTHS.indexOf(m[1].toLowerCase()); const day = +m[2];
    if (mon < 0 || day < 1 || day > 31) continue;
    const after = body.slice(m.index + m[0].length, m.index + m[0].length + 40);
    const tm = after.match(/^[^\n]*?\b(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)/i);
    let h = 10, min = 0;
    if (tm) { h = +tm[1] % 12; min = +(tm[2] || 0); if (/p/i.test(tm[3])) h += 12; }
    const yr = m[3] ? +m[3] : new Date().getFullYear();
    let at = new Date(yr, mon, day, h, min).getTime();
    if (!m[3] && at < now() - 30 * DAY) at = new Date(yr + 1, mon, day, h, min).getTime();
    return at;
  }
  return null;
}
function plParse(raw) {
  const p = parseEmail(raw);
  const low = (raw || "").toLowerCase();
  if (p.kind === "screen" && /technical interview|coding interview|onsite|on-site|final round|superday|system design|panel interview/.test(low)) {
    p.kind = "interview";
    p.roundType = /technical|coding|system design/.test(low) ? "technical" : /onsite|on-site|final|superday/.test(low) ? "onsite" : "other";
  }
  if (!p.company) {
    const m = (raw || "").match(/thank you for (?:applying|your (?:application|interest)) (?:to|at|with) ([A-Z][\w&.'\- ]{1,40}?)(?:[.!,\n]| for | and )/i);
    if (m && /^[A-Z]/.test(m[1])) p.company = m[1].trim();
  }
  p.interviewAt = p.kind === "interview" || p.kind === "screen" ? plFindTime(raw) : null;
  const iv = (raw || "").match(/\bwith ([A-Z][a-z]+(?: [A-Z][a-z.]+)?(?:,? (?:and|&) [A-Z][a-z]+(?: [A-Z][a-z.]+)?)?)(?=[\s:.,])/);
  p.interviewers = p.interviewAt && iv ? iv[1] : "";
  return p;
}
function plShouldMove(cur, to) {
  if (!to || to === cur) return false;
  if (to === "rejected" || to === "offer") return true;
  if (cur === "rejected" || cur === "ghosted") return to !== "applied";
  return STAGE[to].i > STAGE[cur].i;
}

/* Debounced text input that saves as you type and flushes on blur / unmount */
function PlText({ id, value, onSave, multiline, onStatus, delay = 450, cls, ...rest }) {
  const [v, setV] = useState(value || "");
  const timer = useRef(null), pending = useRef(null);
  const saveRef = useRef(onSave); saveRef.current = onSave;
  const statusRef = useRef(onStatus); statusRef.current = onStatus;
  const flush = (quiet) => {
    clearTimeout(timer.current);
    if (pending.current == null) return;
    const x = pending.current; pending.current = null; saveRef.current(x);
    if (!quiet) statusRef.current?.("saved");
  };
  useEffect(() => () => flush(true), []);
  useEffect(() => { if (pending.current == null && document.activeElement?.id !== id) setV(value || ""); }, [value]);
  const onInput = (e) => { const x = e.currentTarget.value; setV(x); pending.current = x; statusRef.current?.("saving"); clearTimeout(timer.current); timer.current = setTimeout(() => flush(), delay); };
  return multiline
    ? html`<textarea id=${id} class=${cx("textarea", cls)} value=${v} onInput=${onInput} onBlur=${() => flush()} ...${rest}></textarea>`
    : html`<input id=${id} class=${cx("input", cls)} value=${v} onInput=${onInput} onBlur=${() => flush()} ...${rest} />`;
}

/* ---------- Board ---------- */
function PlBoard({ apps, settings, collapsed, filtering }) {
  const [drag, setDrag] = useState(null);
  const [over, setOver] = useState(null);
  const [menu, setMenu] = useState(null);
  const by = useMemo(() => { const m = {}; STAGES.forEach((x) => (m[x.id] = [])); apps.forEach((a) => (m[a.stage] || m.applied).push(a)); for (const k in m) m[k] = plSortInCol(m[k]); return m; }, [apps]);

  const dropOn = (stage) => (e) => {
    e.preventDefault();
    const id = e.dataTransfer?.getData("text/plain") || drag;
    setOver(null); setDrag(null);
    if (id && Apps.get(id) && Apps.get(id).stage !== stage) { if (collapsed[stage]) plSetCollapsed(stage, false); Apps.move(id, stage); }
  };
  const dragOver = (stage) => (e) => { e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = "move"; if (over !== stage) setOver(stage); };
  const dragLeave = (stage) => (e) => { if (!e.currentTarget.contains(e.relatedTarget) && over === stage) setOver(null); };

  const move = (a, to) => { if (!to || to === a.stage) return; if (collapsed[to]) plSetCollapsed(to, false); Apps.move(a.id, to); plFocusCard(a.id); };
  const onKey = (a) => (e) => {
    if (e.target !== e.currentTarget) return;
    const k = e.key;
    if (k === "Enter" || k === " ") { e.preventDefault(); openApp(a.id); }
    else if (k === "ArrowRight" || k === "]" || k === "ArrowLeft" || k === "[") {
      e.preventDefault();
      const i = STAGE[a.stage].i + (k === "ArrowRight" || k === "]" ? 1 : -1);
      if (i >= 0 && i < STAGES.length) move(a, STAGES[i].id);
    } else if (k === "ArrowDown" || k === "ArrowUp") {
      e.preventDefault();
      const cards = [...e.currentTarget.closest(".col-body").querySelectorAll(".app-card")];
      cards[cards.indexOf(e.currentTarget) + (k === "ArrowDown" ? 1 : -1)]?.focus();
    }
  };

  return html`<${Fragment}>
    <div class="board pl-board" role="list" aria-label="Pipeline board">
      ${STAGES.map((st) => {
        const list = by[st.id];
        const closed = PL_CLOSED.includes(st.id);
        if (closed && collapsed[st.id]) return html`<button type="button" role="listitem" key=${st.id} class=${cx("pl-rail", over === st.id && "drop")} onClick=${() => plSetCollapsed(st.id, false)} onDragOver=${dragOver(st.id)} onDragLeave=${dragLeave(st.id)} onDrop=${dropOn(st.id)} aria-label=${`Show ${st.label} column, ${pluralize(list.length, "application")}`} title=${`Show ${st.label}`} data-col=${st.id}>
          <span class=${cx("dot", st.id)}></span><span class="pl-rail-count num">${list.length}</span><span class="pl-rail-label">${st.label}</span>
        </button>`;
        return html`<section role="listitem" key=${st.id} class=${cx("col pl-col", closed && "pl-col-closed", over === st.id && "drop")} data-col=${st.id} aria-label=${`${st.label}, ${pluralize(list.length, "application")}`} onDragOver=${dragOver(st.id)} onDragLeave=${dragLeave(st.id)} onDrop=${dropOn(st.id)}>
          <header class="col-head">
            <span class=${cx("dot", st.id)}></span><span>${st.label}</span><span class="count">${list.length}</span>
            <span class="spacer"></span>
            ${closed && html`<${Btn} kind="ghost" size="sm" icon="chevL" cls="pl-col-hide" aria-label=${`Collapse ${st.label} column`} title="Collapse" onClick=${() => plSetCollapsed(st.id, true)} />`}
          </header>
          <div class="col-body">
            ${list.map((a) => html`<${PlCard} key=${a.id} a=${a} settings=${settings} dragging=${drag === a.id}
              onDragStart=${(e) => { e.dataTransfer.setData("text/plain", a.id); e.dataTransfer.effectAllowed = "move"; setDrag(a.id); }}
              onDragEnd=${() => { setDrag(null); setOver(null); }}
              onKeyDown=${onKey(a)}
              onMenu=${(el) => setMenu({ id: a.id, el })} />`)}
            ${!list.length && html`<div class="pl-col-empty">${drag ? "Drop here" : filtering ? "No matches" : st.id === "saved" ? "Jobs you save show up here" : closed ? "None" : "Nothing here yet"}</div>`}
          </div>
        </section>`;
      })}
    </div>
    <p class="pl-tip hide-sm" id="pl-kbd-hint">Drag cards between columns, or focus a card and press <${Kbd}>←</${Kbd}> <${Kbd}>→</${Kbd}> to move it a stage, <${Kbd}>↑</${Kbd}> <${Kbd}>↓</${Kbd}> to switch cards, <${Kbd}>↵</${Kbd}> to open.</p>
    ${menu && Apps.get(menu.id) && html`<${PlMoveMenu} a=${Apps.get(menu.id)} anchor=${menu.el} onPick=${(to) => move(Apps.get(menu.id), to)} onClose=${() => setMenu(null)} />`}
  </${Fragment}>`;
}

function PlCard({ a, settings, dragging, onMenu, ...rest }) {
  const stt = plStatus(a, settings);
  return html`<article class=${cx("app-card pl-card", dragging && "dragging")} tabindex="0" draggable="true" data-card=${a.id}
    aria-label=${`${a.title} at ${a.company}. ${STAGE[a.stage].label}. ${stt.text}.`} aria-describedby="pl-kbd-hint"
    onClick=${(e) => { if (!e.target.closest("button")) openApp(a.id); }} ...${rest}>
    <div class="pl-card-top">
      <${Logo} name=${a.company} size="sm" />
      <span class="pl-card-co truncate">${a.company}</span>
      <button type="button" class="pl-more" aria-label=${`Move ${a.company} to another stage`} aria-haspopup="menu" title="Move to…" onClick=${(e) => { e.stopPropagation(); onMenu(e.currentTarget); }}><${Icon} name="more" /></button>
    </div>
    <div class="app-card-title pl-card-title">${a.title || "Untitled role"}</div>
    ${(a.location || a.example) && html`<div class="pl-card-loc"><span class="truncate">${a.location}</span>${a.example && html`<${ExampleTag} />`}</div>`}
    <div class="app-card-foot pl-card-foot">
      <span class=${cx("pl-status", stt.tone)} title=${stt.title}><${Icon} name=${stt.icon} size=${13} /><span>${stt.text}</span></span>
    </div>
  </article>`;
}

function PlMoveMenu({ a, anchor, onPick, onClose }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    const r = anchor.getBoundingClientRect();
    const w = 216, h = ref.current ? ref.current.offsetHeight : 320;
    const left = clamp(r.right - w, 8, window.innerWidth - w - 8);
    const top = r.bottom + 4 + h > window.innerHeight - 8 ? Math.max(8, r.top - h - 4) : r.bottom + 4;
    setPos({ left, top });
  }, []);
  useEffect(() => {
    setTimeout(() => ref.current?.querySelector("button[aria-checked='false']")?.focus(), 10);
    const down = (e) => { if (ref.current && !ref.current.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) onClose(); };
    const key = (e) => { if (e.key === "Escape") { e.stopImmediatePropagation(); onClose(); anchor.focus?.(); } };
    const scr = () => onClose();
    document.addEventListener("pointerdown", down, true);
    window.addEventListener("keydown", key, true);
    window.addEventListener("resize", scr);
    return () => { document.removeEventListener("pointerdown", down, true); window.removeEventListener("keydown", key, true); window.removeEventListener("resize", scr); };
  }, []);
  const nav = (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const items = [...ref.current.querySelectorAll("button")];
    const i = items.indexOf(document.activeElement);
    items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length]?.focus();
  };
  return html`<div class="menu pl-menu" role="menu" aria-label=${`Move ${a.company}`} ref=${ref} onKeyDown=${nav} style=${pos ? `left:${pos.left}px;top:${pos.top}px` : "visibility:hidden;left:0;top:0"}>
    <div class="pl-menu-label">Move to</div>
    ${STAGES.map((st) => html`<button type="button" role="menuitemradio" key=${st.id} aria-checked=${a.stage === st.id ? "true" : "false"} onClick=${() => { onClose(); onPick(st.id); }}>
      <span class=${cx("dot", st.id)}></span><span style="flex:1">${st.label}</span>${a.stage === st.id && html`<${Icon} name="check" size=${14} />`}
    </button>`)}
    <div class="pl-menu-sep"></div>
    <button type="button" role="menuitem" onClick=${() => { onClose(); openApp(a.id); }}><${Icon} name="arrowR" size=${14} />Open details</button>
  </div>`;
}

/* ---------- Table ---------- */
const PL_COLS = [
  { k: "company", label: "Company / role", v: (a) => `${a.company} ${a.title}`.toLowerCase() },
  { k: "stage", label: "Stage", v: (a) => STAGE[a.stage].i },
  { k: "applied", label: "Applied", v: (a) => a.appliedAt || 0 },
  { k: "activity", label: "Last activity", v: (a) => a.lastActivityAt || 0 },
  { k: "next", label: "Next step", v: (a) => { const u = plUpcoming(a); return u ? -1e15 + u.at : PL_CLOSED.includes(a.stage) ? 1e15 : 0; } },
  { k: "silent", label: "Days silent", v: (a) => (ACTIVE_STAGES.includes(a.stage) ? Apps.daysSilent(a) : -1), num: true },
];
function PlTable({ apps, settings, sort }) {
  const col = PL_COLS.find((c) => c.k === sort.k) || PL_COLS[3];
  const rows = useMemo(() => [...apps].sort((x, y) => { const a = col.v(x), b = col.v(y); return (a < b ? -1 : a > b ? 1 : 0) * sort.dir; }), [apps, sort.k, sort.dir]);
  const setSort = (k) => plUi({ pipelineSort: { k, dir: sort.k === k ? -sort.dir : k === "company" || k === "stage" || k === "next" ? 1 : -1 } });
  return html`<div class="card pl-table-card">
    <div class="table-wrap">
      <table class="table pl-table">
        <thead><tr>${PL_COLS.map((c) => html`<th key=${c.k} class=${cx(c.num && "pl-num")} aria-sort=${sort.k === c.k ? (sort.dir > 0 ? "ascending" : "descending") : "none"}>
          <button type="button" onClick=${() => setSort(c.k)}>${c.label}${sort.k === c.k ? html`<${Icon} name=${sort.dir > 0 ? "chevD" : "chevD"} size=${12} cls=${cx("pl-sort", sort.dir < 0 && "desc")} />` : html`<${Icon} name="sort" size=${12} cls="pl-sort-idle" />`}</button>
        </th>`)}</tr></thead>
        <tbody>
          ${rows.map((a) => {
            const ns = plNextStep(a, settings);
            const silent = ACTIVE_STAGES.includes(a.stage) ? Apps.daysSilent(a) : null;
            return html`<tr key=${a.id} tabindex="0" onClick=${(e) => { if (!e.target.closest("select")) openApp(a.id); }} onKeyDown=${(e) => { if (e.key === "Enter" && e.target === e.currentTarget) openApp(a.id); }}>
              <td><div class="pl-tcell"><${Logo} name=${a.company} size="sm" /><div class="pl-tname"><span class="pl-ttitle truncate">${a.title || "Untitled role"}</span><span class="pl-tco truncate">${a.company}${a.location ? " · " + a.location : ""}</span><span class=${cx("pl-next pl-tnext-m", ns.tone)}>${ns.short}${silent != null && silent >= settings.followUpDays ? ` · ${silent}d silent` : ""}</span></div>${a.example && html`<${ExampleTag} />`}</div></td>
              <td><span class="pl-stage-sel"><span class=${cx("dot", a.stage)}></span><select id=${"pl-st-" + a.id} class="select" value=${a.stage} aria-label=${`Stage for ${a.company}`} onChange=${(e) => Apps.move(a.id, e.currentTarget.value)}>${STAGES.map((st) => html`<option key=${st.id} value=${st.id}>${st.label}</option>`)}</select></span></td>
              <td class="num muted">${a.appliedAt ? fmt.date(a.appliedAt) : html`<span class="faint">—</span>`}</td>
              <td class="num muted">${fmt.ago(a.lastActivityAt)}</td>
              <td><span class=${cx("pl-next", ns.tone)}>${ns.short}</span></td>
              <td class="num pl-num">${silent == null ? html`<span class="faint">—</span>` : html`<span class=${cx(silent >= settings.followUpDays && "pl-warn")}>${silent}</span>`}</td>
            </tr>`;
          })}
          ${!rows.length && html`<tr><td colspan="6" class="faint" style="text-align:center">No applications match the filter.</td></tr>`}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ---------- Application drawer ---------- */
DRAWERS.app = function PlAppDrawer({ id, tab }) {

  const jobs = useJobs();

  if (!a) return html`<${Drawer} onClose=${closeDrawer} label="Application" head=${html`<div class="pl-dhead"><h2 class="pl-dtitle">Application not found</h2></div>`}>
    <${Empty} icon="info" title="This application isn't here anymore">It may have been deleted, or cleared along with the example data.</${Empty}>
  </${Drawer}>`;
  const hasCo = jobs.status === "ready" && (jobs.byCompany.has(a.company) || jobs.cstats[a.company]);
  const del = () => askConfirm({ title: `Delete ${a.company}?`, body: `This removes ${a.title || "this application"} with its rounds, notes and timeline from this device. You can undo right after.`, confirmLabel: "Delete application", danger: true, onConfirm: () => { closeDrawer(); Apps.remove(a.id); } });

    ${t === "timeline" && html`<${PlTimeline} a=${a} />`}
    ${t === "notes" && html`<${PlNotes} a=${a} />`}
  </${Drawer}>`;
};

function PlStepper({ a }) {
  const cur = STAGE[a.stage].i;
  const far = plFurthest(a);
  const closed = PL_CLOSED.includes(a.stage);
  const since = plStageAt(a, a.stage) || (a.stage === "saved" ? a.createdAt : a.appliedAt);
  return html`<div class="pl-stepper" role="group" aria-label="Stage">
    <div class="pl-steps">
      ${PL_MAIN.map((id, i) => {
        const st = STAGE[id];
        const state = !closed && i === cur ? "cur" : (!closed && i < cur) || (closed && i <= far) ? "done" : "";
        return html`<button type="button" key=${id} class=${cx("pl-step", state, closed && "muted-done")} aria-pressed=${!closed && i === cur ? "true" : "false"} onClick=${() => Apps.move(a.id, id)} title=${`Move to ${st.label} (press ${i + 1})`}>
          <i></i><span class="pl-step-l">${st.label}</span><span class="pl-step-s">${st.short}</span>
        </button>`;
      })}
    </div>
    <div class="pl-stage-line">
      <span class="pl-small muted"><span class=${cx("dot", a.stage)}></span>${STAGE[a.stage].label}${since ? ` since ${fmt.date(since)}` : ""}</span>
      <span class="spacer" style="flex:1"></span>
      ${PL_CLOSED.map((id) => html`<button type="button" key=${id} class=${cx("pl-close-btn", id, a.stage === id && "on")} aria-pressed=${a.stage === id ? "true" : "false"} onClick=${() => Apps.move(a.id, id)} title=${`Move to ${STAGE[id].label} (press ${STAGE[id].i + 1})`}>
        <${Icon} name=${id === "ghosted" ? "ghost" : "x"} size=${14} />${a.stage === id ? STAGE[id].label : id === "rejected" ? "Mark rejected" : "Mark ghosted"}
      </button>`)}
    </div>
  </div>`;
}

    schedule: html`<${Btn} size="sm" icon="plus" onClick=${() => { Apps.addRound(a.id, { type: a.stage === "screen" ? "recruiter" : "technical" }); setTab("rounds"); }}>Add round</${Btn}>`,

        <span class="pl-kv-k">Since last reply</span>
