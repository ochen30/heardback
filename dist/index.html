  .pl-more { width: 36px; height: 36px; margin: -8px -6px -8px 0; }
  .pl-step { min-height: 36px; justify-content: flex-end; }
  .pl-dtabs { gap: 16px; }
  .pl-dtabs button { height: 44px; }
  .pl-round-foot .btn { flex: 1; }
  .pl-quicknote { flex-direction: column; }
  .pl-next-card { padding: 12px; }
}
.pl-status .ico { margin-top: 1px; }
/* Selects read as text until hovered or focused */
.pl-stage-sel .select, .pl-round-type { background-size: 0 0; }
tr:hover .pl-stage-sel .select, .pl-stage-sel .select:focus, .pl-round-type:hover, .pl-round-type:focus { background-size: 5px 5px; }
@media (hover: none) { .pl-stage-sel .select, .pl-round-type { background-size: 5px 5px; } }
/* Drawer header never overflows with long unbroken names */
.pl-dhead-text, .pl-dsub { min-width: 0; }
.pl-dsub > span, .pl-dsub > .pl-linkbtn { overflow-wrap: anywhere; min-width: 0; text-align: left; }
/* Mobile table sort (column headers are hidden at phone width) */
.pl-msort { display: none; align-items: center; gap: 8px; margin-bottom: -4px; }
.pl-msort .select { flex: 1; height: 40px; }
@media (max-width: 520px) { .pl-msort { display: flex; } }

/* ===== Selection + bulk actions ===== */
/* Board: the checkbox sits over the logo, so showing it never shifts layout */
.pl-card-lead { position: relative; flex: none; width: 24px; height: 24px; display: grid; }
.pl-chk {
  position: absolute; inset: -6px; display: grid; place-items: center; border-radius: var(--r-sm);
  opacity: 0; cursor: pointer; transition: opacity var(--t-fast);
}
.pl-chk input { pointer-events: none; width: 16px; height: 16px; }
.pl-chk::before { content: ""; position: absolute; inset: 6px; border-radius: var(--r-sm); background: var(--surface); }
.pl-chk input { position: relative; }
@media (hover: hover) { .pl-card:hover .pl-chk { opacity: 1; } }
.pl-board.selecting .pl-chk, .pl-card.sel .pl-chk { opacity: 1; }
.pl-card.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pl-card.sel:focus-visible { box-shadow: inset 0 0 0 1px var(--accent), var(--focus); }
.pl-card.sel.closed { opacity: 1; }

/* Table */
.pl-table th.pl-chk-cell, .pl-table td.pl-chk-cell { width: 1%; padding: 0 4px 0 16px; cursor: pointer; user-select: none; -webkit-user-select: none; }
.pl-table th.pl-chk-cell + th, .pl-table td.pl-chk-cell + td { padding-left: 8px; }
.pl-table .pl-chk-cell input { vertical-align: middle; }
.pl-table td.pl-chk-cell input { pointer-events: none; }
.pl-table tbody tr.sel td { background: var(--accent-soft); }
.pl-table tbody tr.sel:hover td { background: var(--accent-soft); }
.pl-table input[type="checkbox"]:indeterminate { background: var(--accent); border-color: var(--accent); }
.pl-table input[type="checkbox"]:indeterminate::after { content: ""; width: 8px; height: 0; border-top: 2px solid var(--accent-fg); transform: none; }
.pl-table input[type="checkbox"]:disabled { opacity: .5; cursor: default; }

/* Floating action bar, centred over the workspace, above the mobile tab bar */
.pl-page.pl-selecting { padding-bottom: 96px; }
.pl-bulk {
  position: fixed; z-index: 30; left: calc(var(--rail) + (100vw - var(--rail)) / 2); transform: translateX(-50%);
  bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  display: flex; align-items: center; gap: 2px; padding: 6px; max-width: calc(100vw - var(--rail) - 32px);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-float);
  animation: pl-rise var(--t-med) var(--ease); white-space: nowrap;
}
.pl-bulk-count { padding: 0 10px 0 8px; font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
.pl-bulk-sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; flex: none; }
.pl-bulk .btn { font-weight: 500; height: 32px; font-size: var(--fs-sm); }
.pl-bulk .btn.pl-bulk-x { width: 32px; }
@keyframes pl-rise { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.pl-bulk .btn .ico { color: var(--fg-3); }
.pl-bulk .btn.danger .ico { color: var(--bad); }
.pl-bulk .btn:disabled { opacity: .45; }
.pl-bulk-x { color: var(--fg-3); }
/* Toasts clear the bar */
body:has(.pl-bulk) .toasts { bottom: calc(max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)) + 60px); }
@media (max-width: 860px) {
  .pl-bulk { left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px) + 12px); max-width: calc(100vw - 32px); }
  body:has(.pl-bulk) .toasts { bottom: calc(68px + env(safe-area-inset-bottom, 0px) + 60px); }
}
@media (max-width: 620px) {
  .pl-bulk { gap: 0; padding: 4px; }
  .pl-bulk-lbl { display: none; }
  .pl-bulk .btn.pl-bulk-ic, .pl-bulk .btn.pl-bulk-x { width: 40px; min-height: 40px; height: 40px; padding: 0; justify-content: center; gap: 0; }
  .pl-bulk .btn.pl-bulk-move { min-height: 40px; height: 40px; padding: 0 8px 0 10px; }
  .pl-bulk-count { padding: 0 6px 0 8px; }
  .pl-bulk-sep { margin: 0 2px; }
}
@media (max-width: 520px) {
  .pl-table th.pl-chk-cell, .pl-table td.pl-chk-cell { width: 40px; padding-right: 0; }
}
@media (hover: none) { .pl-board:not(.selecting) .pl-chk { pointer-events: none; } }

/* ===== Onboarding, Settings, Interview prep (prep.css) ===== */

/* ---------- Onboarding ---------- */
.onboard-wrap { padding-block: 40px 0; scroll-padding-bottom: 120px; }
.onboard { gap: 24px; width: min(640px, 100%); }
.onb-brand { display: flex; align-items: center; gap: 12px; }
.onb-brand .spacer { flex: 1; }
.onb-word { font-size: var(--fs-lg); font-weight: 650; letter-spacing: -0.02em; }
.onb-value { margin-top: -12px; color: var(--fg-2); font-size: var(--fs-md); }
.onb-link { border: 0; background: none; padding: 6px 4px; color: var(--fg-2); font-size: var(--fs-sm); font-weight: 500; border-radius: var(--r-sm); min-height: 32px; }
.onb-link:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
.onb-progress { display: flex; flex-direction: column; gap: 8px; padding-top: 24px; border-top: 1px solid var(--line); }
.onb-step-label { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; letter-spacing: .02em; }
.onboard-steps i { transition: background var(--t-med) var(--ease); }
.onboard h1:focus { outline: none; box-shadow: none; }
.onb-card { display: flex; flex-direction: column; }
.onb-card-pad { padding: 20px; }
.onb-group { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.onb-group + .onb-group { border-top: 1px solid var(--line); }
.onb-group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.onb-group-head h3 { font-size: var(--fs-sm); font-weight: 600; }
.onb-switches { display: flex; flex-wrap: wrap; gap: 12px 28px; padding-top: 4px; }
.onb-switches > label { min-height: 32px; }
.onb-name { max-width: 280px; }
.onb-foot {
  position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 8px;
  margin-top: 8px; padding: 16px 0 max(24px, env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
}
.onb-foot::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: calc(100% + 1px); height: 32px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--bg));
}
.onb-foot .spacer { flex: 1; }
.onb-foot .btn { height: 40px; padding: 0 16px; font-size: var(--fs-md); }

/* resume editor (onboarding step 2 + resume modal) */
.onb-resume { gap: 14px; }
.onb-resume-head { display: flex; align-items: center; gap: 8px; }
.onb-resume-head .spacer { flex: 1; }
.onb-file { cursor: pointer; }
.onb-file:focus-within { box-shadow: var(--focus); }
.onb-textarea { min-height: 168px; max-height: 320px; font-size: var(--fs-sm); line-height: 1.55; }
.onb-meta { margin-top: -6px; }
.onb-meta .onb-link { margin-left: auto; font-size: var(--fs-xs); padding: 2px 4px; min-height: 0; }
.onb-skill { padding-right: 9px; }
.onb-skill .ico { opacity: .7; }
.onb-skill:hover .ico { opacity: 1; }
.onb-add { max-width: 380px; }
.onb-add .input { flex: 1; min-width: 0; }
.onb-sugg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.onb-sugg .hint { margin-right: 2px; }
.onb-sugg-btn {
  display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 10px 0 8px; border: 1px solid var(--line); border-radius: 99px;
  background: var(--surface); color: var(--fg-2); font-size: var(--fs-xs); font-weight: 500; transition: border-color var(--t-fast), color var(--t-fast);
}
.onb-sugg-btn:hover { border-color: var(--fg-3); color: var(--fg); }
.onb-sugg-btn .ico { color: var(--fg-3); }
.onb-privacy { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs-xs); color: var(--fg-2); padding-top: 12px; border-top: 1px solid var(--line); }
.onb-privacy .ico { color: var(--ok); margin-top: 1px; }

/* step 3 */
.onb-count { display: flex; flex-direction: column; gap: 6px; padding: 20px; border-bottom: 1px solid var(--line); }
.onb-big { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; }
.onb-big-label { font-size: var(--fs-md); font-weight: 500; color: var(--fg-2); }
.onb-count + .callout { margin: 16px 20px; }
.onb-job { cursor: default; padding: 12px 20px; }
.onb-job:hover { background: var(--surface); }
.onb-source { padding: 12px 20px; border-top: 1px solid var(--line); }
.onb-ex { align-items: flex-start; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.onb-ex input { margin-top: 2px; }

/* ---------- Settings ---------- */
.pf-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.pf-col { gap: 16px; }
.pf-card .card-head h2 { font-size: var(--fs-md); font-weight: 600; }
.pf-page .card-head > .ico:first-child { display: none; }
.pf-sub { padding: 14px 20px 0; font-size: var(--fs-sm); color: var(--fg-2); }
.pf-rows { display: flex; flex-direction: column; padding: 4px 20px 6px; }
.pf-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 8px 24px; align-items: center; padding: 14px 0; }
.pf-row.top { align-items: start; }
.pf-row + .pf-row { border-top: 1px solid var(--line); }
.pf-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pf-control { min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.pf-control > .chips { flex: 1; }
.pf-input { max-width: 320px; }
.pf-num .input { width: 88px; }
.pf-value { font-size: var(--fs-sm); }
.pf-file { cursor: pointer; align-self: flex-start; }
.pf-file:focus-within { box-shadow: var(--focus); }
.pf-statement { font-size: var(--fs-sm); line-height: 1.6; }
.pf-text { font-size: var(--fs-sm); line-height: 1.6; }
.pf-facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); color: var(--fg-2); line-height: 1.5; }
.pf-meta { gap: 4px 16px; }
.pf-version { font-size: var(--fs-xs); color: var(--fg-3); text-align: center; padding: 4px 0; }
.pf-corrupt { margin-bottom: 16px; max-width: 80ch; }


/* ---------- Interview prep ---------- */
.prep-layout { display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: 24px; align-items: start; }
.prep-side { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.prep-picker { display: none; }
.prep-list-card { padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.prep-group { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; letter-spacing: .02em; padding: 10px 10px 4px; }
.prep-none { font-size: var(--fs-sm); color: var(--fg-3); padding: 4px 10px 8px; }
.prep-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.prep-item {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 10px; border: 0; background: none;
  border-radius: var(--r-md); text-align: left; transition: background var(--t-fast) var(--ease);
}
.prep-item:hover { background: var(--surface-2); }
.prep-item[aria-current="true"] { background: var(--surface-2); }
.prep-item[aria-current="true"] .prep-item-title { color: var(--fg); font-weight: 600; }
.prep-item-main { flex: 1; gap: 0; }
.prep-item-title { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
.prep-item-sub { font-size: var(--fs-xs); color: var(--fg-2); }
.prep-item-ico { width: 24px; height: 24px; flex: none; border-radius: var(--r-sm); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.prep-when { font-size: var(--fs-xs); color: var(--fg-3); white-space: nowrap; }
.prep-when.soon, .prep-soon { color: var(--wait); font-weight: 500; }

.prep-work { gap: 16px; min-width: 0; }
.prep-head { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.prep-head-main { display: flex; align-items: center; gap: 14px; min-width: 0; }
.prep-head-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.prep-head-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.prep-role { font-size: var(--fs-sm); color: var(--fg-2); line-height: 1.45; overflow-wrap: anywhere; }
.prep-role-type { white-space: nowrap; }
.prep-head-actions { flex: none; display: flex; align-items: center; gap: 8px; }
.prep-cal:empty { display: none; }
.prep-head-ico { width: 48px; height: 48px; flex: none; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.prep-h2 { font-size: var(--fs-lg); letter-spacing: -0.015em; line-height: 1.25; }
.prep-facts { display: grid; grid-template-columns: repeat(3, minmax(0, auto)); justify-content: start; gap: 8px 40px; margin: 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: var(--fs-sm); }
.prep-facts dt { font-size: var(--fs-xs); color: var(--fg-3); }
.prep-facts dd { margin: 0; min-width: 0; }
.prep-pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-top: 14px; border-top: 1px solid var(--line); }
.prep-cat { width: auto; min-width: 150px; }

.prep-qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.prep-qlist li { display: flex; gap: 12px; font-size: var(--fs-sm); padding: 8px 0; }
.prep-qlist-lg { padding: 0; }
.prep-qlist-lg li { display: block; padding: 0; }
.prep-qlist-lg li + li { border-top: 1px solid var(--line); }
.prep-qbtn { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px 16px; border: 0; background: none; text-align: left; font-size: var(--fs-sm); color: var(--fg); border-radius: 0; transition: background var(--t-fast); min-height: 44px; }
.prep-qbtn:hover { background: var(--surface-2); }
.prep-qn { width: 20px; flex: none; color: var(--fg-3); font-size: var(--fs-xs); font-weight: 500; padding-top: 1px; text-align: right; }
.prep-qtext { flex: 1; min-width: 0; line-height: 1.5; }
.prep-chev { color: var(--fg-3); margin-top: 2px; transition: transform var(--t-fast) var(--ease); }
.prep-qbtn[aria-expanded="true"] .prep-chev { transform: rotate(180deg); }
.prep-qlist-lg li.open { background: var(--surface-2); }
.prep-qlist-lg li.open .prep-qtext { font-weight: 500; }
.prep-tip { font-size: var(--fs-sm); color: var(--fg-2); line-height: 1.65; max-width: 70ch; }
.prep-tip-label { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; }
.prep-tip-in { display: flex; flex-direction: column; gap: 4px; padding: 0 48px 18px 48px; margin-top: -2px; }
.prep-tip-block { display: flex; flex-direction: column; gap: 4px; }
.prep-card-foot { padding: 10px 16px; border-top: 1px solid var(--line); }

.prep-cta { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; font-size: var(--fs-sm); }
.prep-points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.prep-point { display: flex; flex-direction: column; gap: 8px; }
.prep-point + .prep-point { padding-top: 14px; border-top: 1px solid var(--line); }
.prep-point-text { font-size: var(--fs-sm); font-weight: 500; padding-left: 10px; border-left: 2px solid var(--accent); line-height: 1.5; }
.prep-star-guide { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-xs); color: var(--fg-2); padding: 10px 12px; margin-bottom: 16px; border-radius: var(--r-md); background: var(--surface-2); }
.prep-star-guide b { color: var(--fg); font-weight: 600; }
.prep-star-guide .faint { flex-basis: 100%; }
.prep-point-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-xs); color: var(--fg-2); padding-left: 12px; }
.prep-point-meta > span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.prep-r { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.prep-point-meta b.num { color: var(--fg); font-weight: 600; }
.prep-ask { list-style: none; margin: 0; padding: 4px 16px 8px; display: flex; flex-direction: column; }
.prep-ask li { position: relative; padding: 10px 0 10px 16px; font-size: var(--fs-sm); line-height: 1.5; }
.prep-ask li + li { border-top: 1px solid var(--line); }
.prep-ask li::before { content: ""; position: absolute; left: 2px; top: 18px; width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); }
.prep-two { align-items: stretch; }
.prep-notes-card { display: flex; flex-direction: column; }
.prep-notes-body { flex: 1; display: flex; }
.prep-notes-body .textarea { flex: 1; min-height: 160px; }
.prep-count { font-size: var(--fs-sm); color: var(--fg-3); font-weight: 400; white-space: nowrap; }
.prep-saved { display: inline-flex; align-items: center; gap: 4px; }

/* practice */
.prep-practice { border-color: var(--accent); }
.prep-practice-body { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 24px; align-items: start; }
.prep-q-big { font-size: var(--fs-lg); font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
.prep-timer-col { display: flex; flex-direction: column; }
.prep-timer { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 18px 12px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); text-align: center; }
.prep-clock { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; font-family: var(--mono); line-height: 1.1; }
.prep-clock.low { color: var(--wait); }
.prep-clock.done { color: var(--bad); }
.prep-practice-foot { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.prep-practice-foot .spacer { flex: 1; }
.prep-thinking { gap: 8px; }
.prep-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: prepPulse 1.1s var(--ease) infinite alternate; }
@keyframes prepPulse { from { opacity: .3; } to { opacity: 1; } }

@media (max-width: 1100px) {
  .pf-layout { grid-template-columns: minmax(0, 1fr); }
  .pf-aside { position: static; }
  .prep-layout { grid-template-columns: 240px minmax(0, 1fr); }
  .prep-two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .prep-layout { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .prep-side { position: static; }
  .prep-picker { display: flex; flex-direction: column; gap: 6px; }
  .prep-picker .select { min-height: 44px; }
  .prep-list-card { display: none; }
  .prep-practice-body { grid-template-columns: minmax(0, 1fr); }
  .prep-timer-col { order: -1; }
  .prep-timer { flex-direction: row; flex-wrap: wrap; justify-content: space-between; padding: 12px 14px; text-align: left; }
  .prep-timer .hint { flex-basis: 100%; }
  .prep-facts { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .prep-facts > div { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 12px; }
  .pf-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .pf-rows { padding: 2px 16px 4px; }
  .pf-sub { padding: 12px 16px 0; }
  .pf-input { max-width: none; }
  .onboard-wrap { padding-block: 20px 0; }
  .onboard { gap: 20px; }
  .onb-group { padding: 16px; }
  .onb-card-pad { padding: 16px; }
  .onb-count { padding: 16px; }
  .onb-job { padding: 12px 16px; }
  .onb-source { padding: 12px 16px; }
  .onb-name { max-width: none; }
  .onb-add { max-width: none; }
  .onb-sugg-btn { min-height: 36px; }
}
@media (max-width: 520px) {
  .prep-head { padding: 16px; }
  .prep-head-main { align-items: flex-start; gap: 12px; }
  .prep-head .logo.lg { width: 40px; height: 40px; font-size: var(--fs-md); }
  .prep-cal .btn { width: 44px; height: 44px; padding: 0; gap: 0; font-size: 0; justify-content: center; }
  .prep-tip-in { padding: 0 16px 16px 48px; }
  .onb-foot .btn { height: 44px; }
  .prep-item { min-height: 52px; }
  .prep-practice-foot .btn { min-height: 44px; }
  .prep-pick .seg { width: 100%; }
  .prep-pick .seg button { flex: 1; padding: 0 6px; }
  .prep-cat { width: 100%; }
}
.onb-resume-hint { margin-top: -8px; }
.onb-file.is-busy { cursor: progress; color: var(--fg-3); }
.onb-spin { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--fg-2); animation: onb-spin .8s linear infinite; margin-top: 2px; }
@keyframes onb-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .onb-spin { animation: none; } }
/* location checklist (onboarding + settings), mirrors Find's compact list */
.onb-locs { display: flex; flex-direction: column; gap: 4px; max-width: 360px; }
.onb-opts { margin: 0 -8px; }
.onb-more { align-self: flex-start; border: 0; background: none; padding: 4px 0; color: var(--accent-text); font-size: var(--fs-sm); font-weight: 500; cursor: pointer; }
.onb-more:hover { text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 640px) { .onb-opt { min-height: 40px; } .onb-more { min-height: 44px; } .onb-locs { max-width: none; } }

/* ---------- Mock interview with Claude ---------- */
.prep-mock-start { display: flex; flex-direction: column; }
.prep-mock-start-main { display: flex; gap: 14px; padding: 16px; align-items: flex-start; min-width: 0; }
.prep-mock-ico { width: 40px; height: 40px; border-radius: var(--r-md); color: var(--accent-text); background: var(--accent-soft); border-color: transparent; }
.prep-mock-start-text { flex: 1; gap: 4px; }
.prep-mock-title { font-size: var(--fs-md); font-weight: 600; }
.prep-mock-ctx { display: flex; min-width: 0; font-size: var(--fs-sm); color: var(--fg); font-weight: 500; }
.prep-mock-type { flex: none; white-space: nowrap; color: var(--fg-2); font-weight: 400; }
.prep-mock-desc { font-size: var(--fs-sm); color: var(--fg-2); line-height: 1.55; max-width: 68ch; }
.prep-mock-start-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-top: 1px solid var(--line); }
.prep-mock-start-foot .spacer { flex: 1; }
.prep-mock-len { display: flex; align-items: center; gap: 10px; }
.prep-mock-len .label { margin: 0; }
.prep-mock-note { max-width: 34ch; text-align: right; line-height: 1.4; }

.prep-mock.on { border-color: var(--accent); }
.prep-mock-head { align-items: center; }
.prep-mock-head-text { gap: 2px; flex: 0 1 auto; }
.prep-mock-head h3:focus { outline: none; box-shadow: none; }
.prep-mock-sub { font-size: var(--fs-xs); color: var(--fg-3); }
.prep-mock-progress { height: 2px; background: var(--surface-2); }
.prep-mock-progress > i { display: block; height: 100%; background: var(--accent); transition: width var(--t-med) var(--ease); }
.prep-mock-body { display: flex; flex-direction: column; gap: 16px; padding: 24px; }
.prep-mock-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 20px; max-width: 72ch; }
.prep-mock-log:empty { display: none; }
.prep-mock-turn { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.prep-mock-who { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; letter-spacing: .02em; }
.prep-mock-text { font-size: var(--fs-md); line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
.prep-mock-turn.me .prep-mock-text { padding: 10px 14px; border-radius: var(--r-md); background: var(--surface-2); color: var(--fg-2); font-size: var(--fs-sm); line-height: 1.6; }
.prep-mock-caret { display: inline-block; width: 6px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: prepPulse .8s var(--ease) infinite alternate; }
.prep-mock-status { gap: 8px; font-size: var(--fs-sm); min-height: 28px; }
.prep-mock-err { align-items: center; flex-wrap: wrap; }
.prep-mock-err-text { flex: 1; min-width: 12em; }
.prep-mock-compose { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.prep-mock-compose .textarea { background: var(--surface); min-height: 96px; }
.prep-mock-compose-foot { display: flex; align-items: center; gap: 8px; }
.prep-mock-compose-foot .spacer { flex: 1; }
.prep-mock-details { border-top: 1px solid var(--line); padding-top: 12px; }
.prep-mock-details summary { cursor: pointer; font-size: var(--fs-sm); font-weight: 500; color: var(--fg-2); min-height: 32px; display: flex; align-items: center; list-style: none; }
.prep-mock-details summary::-webkit-details-marker { display: none; }
.prep-mock-details summary::before { content: ""; width: 6px; height: 6px; margin: 0 10px 0 2px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); transition: transform var(--t-fast) var(--ease); }
.prep-mock-details[open] summary::before { transform: rotate(45deg); }
.prep-mock-details[open] .prep-mock-log { margin-top: 12px; }

.prep-score { display: flex; flex-direction: column; gap: 20px; }

/* ===== Heardback core: rendering, store, persistence, utilities ===== */

const DAY = 86400000;

const pluralize = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

/* ---------- Dates ---------- */
const fmt = {
  ago(ts) {
    if (!ts) return "";
    const s = Math.max(0, (now() - ts) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    const d = Math.floor(s / 86400);
    if (d < 30) return `${d}d ago`;
    if (d < 365) return `${Math.floor(d / 30)}mo ago`;
    return `${Math.floor(d / 365)}y ago`;
  },
  days(ts) { return Math.floor((now() - ts) / DAY); },
  date(ts, opts) { return ts ? new Date(ts).toLocaleDateString(undefined, opts || { month: "short", day: "numeric" }) : ""; },
  dateY(ts) { return ts ? new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : ""; },

  dateTime(ts) { return ts ? `${fmt.date(ts, { weekday: "short", month: "short", day: "numeric" })} · ${fmt.time(ts)}` : ""; },
  until(ts) {
    const d = ts - now();
    if (d < 0) return fmt.ago(ts);
    const m = d / 60000;
    if (m < 60) return `in ${Math.max(1, Math.round(m))}m`;
    if (m < 1440) return `in ${Math.round(m / 60)}h`;

    return days === 1 ? "tomorrow" : `in ${days} days`;

/* Escape closes only the top-most overlay */
const escStack = [];

}
function useFocusTrap(ref, self) {
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const onTab = (e) => {
      if (e.key !== "Tab") return;
      const f = [...el.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')].filter((x) => x.offsetParent !== null || x === document.activeElement);

      else if (!el.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    };
    el.addEventListener("keydown", onTab);

    setTimeout(() => (first || el).focus?.(), 20);

  }, []);
}

/* ===== Job data (published files next to the page) ===== */
const jobsStore = { status: "idle", jobs: [], companies: [], cstats: {}, meta: null, byId: new Map(), byCompany: new Map(), error: null };
const jobSubs = new Set();
function useJobs() { const [v, setV] = useState({ ...jobsStore }); useEffect(() => { const f = () => setV({ ...jobsStore }); jobSubs.add(f); f(); return () => jobSubs.delete(f); }, []); return v; }
async function loadJobs() {
  if (jobsStore.status === "loading") return;
  jobsStore.status = "loading"; jobsStore.error = null; jobSubs.forEach((f) => f());
  try {
    const [jr, cr] = await Promise.all([fetch("data/jobs.json"), fetch("data/companies.json")]);
    if (!jr.ok) throw new Error(`jobs ${jr.status}`);
    const j = await jr.json();
    const c = cr.ok ? await cr.json() : { companies: {} };
    const companies = j.companies || [];
    const jobs = (j.jobs || []).map((x) => {
      const co = companies[x.c] || "Unknown";
      return { ...x, co, p: x.p * 1000, u: (x.u || x.p) * 1000, _s: norm(`${x.t} ${co} ${(x.l || []).join(" ")}`) };
    });
    jobs.sort((a, b) => b.p - a.p);
    const byId = new Map(jobs.map((x) => [x.id, x]));
    // Collapse identical live listings (same company, title and locations) into the newest one.
    const firstOf = new Map(); const uniq = [];
    for (const x of jobs) {
      const k = `${x.c}|${x.t.toLowerCase()}|${(x.l || []).slice(0, 3).join(";")}`;
      const f = firstOf.get(k);
      if (f) { f.dup = (f.dup || 0) + 1; continue; }
      firstOf.set(k, x); uniq.push(x);
    }
    jobs.length = 0; jobs.push(...uniq);
    const byCompany = new Map();
    for (const x of jobs) { if (!byCompany.has(x.co)) byCompany.set(x.co, []); byCompany.get(x.co).push(x); }
    const cstats = {};
    for (const [k, v] of Object.entries(c.companies || {})) cstats[v.n || companies[+k]] = v;
    Object.assign(jobsStore, { status: "ready", jobs, companies, cstats, meta: { generatedAt: j.generatedAt, source: j.source, stats: j.stats }, byId, byCompany });
  } catch (e) {
    jobsStore.status = "error"; jobsStore.error = String(e?.message || e);
  }
  jobSubs.forEach((f) => f());
}

  let score = 0, max = 0;
  // role (35)
  max += 35;
  if (!profile.roles?.length) { score += 20; parts.push({ k: "Role", ok: null, text: "No target roles set" }); }
  else if (profile.roles.includes(job.cat)) { score += 35; parts.push({ k: "Role", ok: true, text: `${job.cat} matches your targets` }); }
  else parts.push({ k: "Role", ok: false, text: `${job.cat} is outside your targets` });
  // level (15)
  max += 15;
  const lv = profile.levels?.length ? profile.levels : ["intern", "newgrad"];
  if (lv.includes(job.lvl)) { score += 15; parts.push({ k: "Level", ok: true, text: job.lvl === "intern" ? "Internship" : "New grad role" }); }
  else parts.push({ k: "Level", ok: false, text: job.lvl === "intern" ? "Internship, you're looking for full-time" : "Full-time, you're looking for internships" });
  // location (20)
  max += 20;
  const locs = profile.locations || [];
  if (!locs.length) { score += 14; parts.push({ k: "Location", ok: null, text: "Open to any location" }); }
  else {
    const hit = locs.find((l) => jobInLoc(job, l)) || (profile.remote && job.r ? "remote" : null);
    if (hit) { score += 20; parts.push({ k: "Location", ok: true, text: hit === "remote" ? "Remote option" : `In ${LOC_OPTIONS.find((o) => o.id === hit)?.label || hit}` }); }
    else parts.push({ k: "Location", ok: false, text: `${(job.l || [])[0] || "Location"} isn't on your list` });
  }
  // sponsorship (10)
  max += 10;
  if (profile.needsSponsor) {
    if (job.sp === "yes") { score += 10; parts.push({ k: "Visa", ok: true, text: "Offers sponsorship" }); }
    else if (job.sp === "no" || job.sp === "citizen") parts.push({ k: "Visa", ok: false, text: job.sp === "citizen" ? "Requires U.S. citizenship" : "Doesn't sponsor visas" });
    else { score += 4; parts.push({ k: "Visa", ok: null, text: "Sponsorship not stated" }); }
  } else { score += 10; }
  // skills (20)
  max += 20;
  const exp = expectedSkills(job);
  const have = new Set(profile.skills || []);
  const matched = exp.filter((s) => have.has(s));
  const missing = exp.filter((s) => !have.has(s));
  if (!profile.skills?.length) { score += 8; parts.push({ k: "Skills", ok: null, text: "Add your resume to compare skills" }); }
  else if (!exp.length) { score += 12; parts.push({ k: "Skills", ok: null, text: "Title doesn't point to specific skills" }); }
  else {
    const r = matched.length / Math.max(3, exp.length);
    score += Math.round(20 * Math.min(1, r));
    parts.push({ k: "Skills", ok: matched.length ? true : false, text: matched.length ? `You list ${matched.slice(0, 3).join(", ")}` : `Usually asks for ${exp.slice(0, 3).join(", ")}` });
  }
  return { score: Math.round((score / max) * 100), parts, matched, missing, expected: exp };
}

/* ===== Global keyboard shortcuts ===== */
function useShortcuts() {
  useEffect(() => {
    let gPending = 0;
    const typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && store.get().profile.onboarded) { e.preventDefault(); ui.set({ palette: !ui.state.palette }); return; }
      if (typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
      if (!store.get().profile.onboarded) return;
      if (ui.state.palette || ui.state.modal) return;
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (gPending && now() - gPending < 1200) {
        gPending = 0;
        const map = { t: "today", f: "find", p: "pipeline", c: "companies", i: "prep", s: "stats", ",": "prefs" };
        if (map[k.toLowerCase()]) { e.preventDefault(); closeDrawer(); go(map[k.toLowerCase()]); }
        return;
      }
      if (k === "g") { gPending = now(); return; }
      if (k === "?") { e.preventDefault(); openModal("shortcuts"); return; }
      if (ui.state.drawer?.kind === "app" && /^[1-7]$/.test(k)) { e.preventDefault(); Apps.move(ui.state.drawer.id, STAGES[+k - 1].id); return; }
      if (ui.state.drawer) return;
      if (k === "n") { e.preventDefault(); openModal("add"); }
      else if (k === "e") { e.preventDefault(); openModal("paste"); }
      else if (k === "/") { e.preventDefault(); go("find"); setTimeout(() => document.getElementById("find-q")?.focus(), 60); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
}

  return html`<div class=${cx("toasts", drawer && "over-drawer")} role="status" aria-live="polite">${toasts.map((t) => html`<div class="toast" key=${t.id}><${Icon} name="check" /><span>${t.text}</span>${t.action && html`<button type="button" onClick=${() => { t.action.run(); ui.set((s) => ({ toasts: s.toasts.filter((x) => x.id !== t.id) })); }}>${t.action.label}</button>`}${t.undo && html`<button type="button" onClick=${() => { t.undo(); ui.set((s) => ({ toasts: s.toasts.filter((x) => x.id !== t.id) })); }}>Undo</button>`}</div>`)}</div>`;

const find_blank = () => ({ lv: [], roles: [], locs: [], posted: "any", visa: "any", hideGhost: false });
function find_prefFilters(p) {

  if (s.ui.findFilters) return s.ui.findFilters;

}
function find_setFilters(patch) {
  store.set((s) => ({ ...s, ui: { ...s.ui, findFilters: patch === null ? null : { ...find_getFilters(s), ...patch } } }));
}
function find_clearAll() { store.set((s) => ({ ...s, ui: { ...s.ui, findFilters: find_blank() } })); }
const find_sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
function find_isPrefs(f, p) {
  const pf = find_prefFilters(p);
  return find_sameSet(f.lv, pf.lv) && find_sameSet(f.roles, pf.roles) && find_sameSet(f.locs, pf.locs);
}
function find_activeCount(f) {
  return (f.lv.length ? 1 : 0) + (f.roles.length ? 1 : 0) + (f.locs.length ? 1 : 0) + (f.posted !== "any" ? 1 : 0) + (f.visa !== "any" ? 1 : 0) + (f.hideGhost ? 1 : 0);
}
const find_toggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
const find_state = { q: "" }; // mirrors the debounced search so the mobile filter modal can count matches

/* ---------- per-job location bitmask (computed once per dataset) ---------- */
const find_locC = { jobs: null, m: null };
function find_locMasks(jobs) {
  if (find_locC.jobs !== jobs) {
    const m = new Map();
    for (const j of jobs) { let b = 0; LOC_OPTIONS.forEach((o, i) => { if (jobInLoc(j, o.id)) b |= 1 << i; }); m.set(j.id, b); }
    find_locC.jobs = jobs; find_locC.m = m;
  }
  return find_locC.m;
}
const find_locBit = (id) => 1 << LOC_OPTIONS.findIndex((o) => o.id === id);

/* ---------- filtering: one pass that also yields facet counts ---------- */
const find_cmpC = { jobs: null, f: null, q: null, out: null };
function find_compute(jobs, f, q) {
  if (find_cmpC.jobs === jobs && find_cmpC.f === f && find_cmpC.q === q) return find_cmpC.out;
  const out = find_run(jobs, f, q, true);
  Object.assign(find_cmpC, { jobs, f, q, out });
  return out;
}
function find_run(jobs, f, q, facets) {
  const masks = find_locMasks(jobs);
  const words = norm(q).split(" ").filter(Boolean);
  const locMask = f.locs.reduce((b, id) => b | find_locBit(id), 0);
  const minP = f.posted === "any" ? 0 : f.posted === "since" ? (visit.since || 0) : now() - +f.posted * DAY;
  const res = [];
  const cLv = {}, cRole = {}, cLoc = new Array(LOC_OPTIONS.length).fill(0);
  for (const j of jobs) {
    if (j.p < minP) continue;
    if (f.visa === "yes" && j.sp !== "yes") continue;
    if (f.visa === "nocit" && j.sp === "citizen") continue;
    if (f.hideGhost && j.g >= 50) continue;
    if (words.length) { let ok = true; for (const w of words) if (!j._s.includes(w)) { ok = false; break; } if (!ok) continue; }
    const m = masks.get(j.id) || 0;
    const okLv = !f.lv.length || f.lv.includes(j.lvl);
    const okRole = !f.roles.length || f.roles.includes(j.cat);
    const okLoc = !locMask || (m & locMask) !== 0;
    if (okLv && okRole && okLoc) res.push(j);
    if (!facets) continue;
    if (okRole && okLoc) cLv[j.lvl] = (cLv[j.lvl] || 0) + 1;
    if (okLv && okLoc) cRole[j.cat] = (cRole[j.cat] || 0) + 1;
    if (okLv && okRole && m) for (let i = 0; i < cLoc.length; i++) if (m & (1 << i)) cLoc[i]++;
  }
  return { res, cLv, cRole, cLoc };
}

/* fit cache (one map per profile object) */
const find_fitC = { p: null, m: new Map() };
function find_fit(job, profile) {
  if (find_fitC.p !== profile) { find_fitC.p = profile; find_fitC.m = new Map(); }
  if (!find_fitC.m.has(job.id)) find_fitC.m.set(job.id, fitScore(job, profile));
  return find_fitC.m.get(job.id);
}
function find_sort(res, sort, profile) {
  if (sort === "fit") {
    const sc = (j) => find_fit(j, profile)?.score ?? -1;
    return [...res].sort((a, b) => sc(b) - sc(a) || b.p - a.p);
  }
  if (sort === "ghost") return [...res].sort((a, b) => a.g - b.g || b.p - a.p);
  return res; // jobs already arrive newest first
}

/* ---------- tracking helpers ---------- */
function find_untrack(id) { store.set((s) => { const apps = { ...s.apps }; delete apps[id]; return { ...s, apps }; }); }
function find_restore(a) { store.set((s) => ({ ...s, apps: { ...s.apps, [a.id]: a } })); }
function find_appFields(job) { return { company: job.co, title: job.t, location: (job.l || [])[0] || "", url: job.url, jobId: job.id, source: "find" }; }
function find_toggleSave(job, app) {
  if (app && app.stage === "saved") { find_untrack(app.id); toast(`Removed ${job.co} from saved`, { undo: () => find_restore(app) }); return; }
  if (app) return;
  const a = Apps.create({ ...find_appFields(job), stage: "saved" });
  toast(`Saved ${job.co} to your pipeline`, { undo: () => find_untrack(a.id) });
}
function find_markApplied(job, app) {
  if (app) { Apps.move(app.id, "applied"); return; }
  const a = Apps.create({ ...find_appFields(job), stage: "applied", appliedAt: now() });
  toast(`Marked ${job.co} as applied`, { undo: () => find_untrack(a.id) });
}
function find_useAppsByJob() {
  const apps = useStore((s) => s.apps);
  return useMemo(() => { const m = new Map(); for (const a of Object.values(apps)) if (a.jobId) m.set(a.jobId, a); return m; }, [apps]);
}

/* ---------- formatting ---------- */
function find_locText(job) {
  const first = (job.l || [])[0] || "Location not listed";
  const more = (job.nl || (job.l || []).length) - 1;
  return more > 0 ? `${first} +${more} more` : first;
}
function find_metaText(job) {
  return [job.co, find_locText(job), FIND_LV[job.lvl] || "", job.term].filter(Boolean).join(" · ");
}
function find_atsName(job) {
  if (FIND_ATS[job.ats]) return FIND_ATS[job.ats];
  try { return new URL(job.url).hostname.replace(/^www\./, ""); } catch { return "Employer site"; }
}
function find_visaText(sp) {
  return { yes: "Offers sponsorship", no: "Does not offer sponsorship", citizen: "U.S. citizenship required" }[sp] || "Not stated in the listing";
}
function find_season(cs) {
  const se = cs?.season;
  if (!se || !se.posted) return null;
  const share = se.open / se.posted;
  const since = se.lastNew ? (now() - se.lastNew * 1000) / DAY : null;
  let read = "", tone = "";
  if (since != null && since <= 7) { read = "Still adding roles"; tone = "ok"; }
  else if (share < 0.15 && since != null && since > 21) { read = "Most of this season's roles have closed"; tone = "wait"; }
  const line = `${pluralize(se.posted, "internship posting")} this season · ${fmt.num(se.open)} still open${se.lastNew ? ` · last new posting ${fmt.ago(se.lastNew * 1000)}` : ""}`;
  return { ...se, share, since, read, tone, line };
}
const find_daysText = (d) => (d == null ? null : `~${Math.max(1, Math.round(d))} ${Math.round(d) === 1 ? "day" : "days"}`);
const find_typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);

/* ---------- shared bits ---------- */
const find_fitHi = (score) => score >= 85;
function find_FitPill({ fit, sponsor }) {
  if (!fit) return null;

/* Row-level stale-listing hint: nothing when the risk is low. */
function find_GhostHint({ g }) {

/* ---------- filter controls (sidebar and mobile modal) ---------- */
const FIND_LOC_TOP = 6;
/* Stable location order: by listing count across the whole dataset, so rows don't jump as other filters change. */
const find_locOrdC = { jobs: null, ord: null };
function find_locOrder(jobs) {
  if (!jobs) return LOC_OPTIONS.map((o, i) => i);
  if (find_locOrdC.jobs !== jobs) {
    const c = new Array(LOC_OPTIONS.length).fill(0);
    for (const m of find_locMasks(jobs).values()) for (let i = 0; i < c.length; i++) if (m & (1 << i)) c[i]++;
    find_locOrdC.jobs = jobs; find_locOrdC.ord = c.map((n, i) => [n, i]).sort((a, b) => b[0] - a[0]).map((x) => x[1]);
  }
  return find_locOrdC.ord;
}
function find_CheckRow({ id, type = "checkbox", name, checked, onChange, label, n }) {

    <input id=${id} type=${type} name=${name} checked=${checked} onChange=${onChange} />

  </label>`;
}
/* Facet chip: a zero-count option that isn't selected can't add anything, so it's disabled. */

}

  const locs = find_locOrder(jobs).map((i) => ({ ...LOC_OPTIONS[i], n: counts.cLoc[i] || 0 })).sort((a, b) => b.n - a.n);
  const top = locs.slice(0, FIND_LOC_TOP);
  const rest = locs.slice(FIND_LOC_TOP);
  const shownLocs = moreLocs ? locs : top.concat(rest.filter((o) => f.locs.includes(o.id)));
  const hidden = locs.length - shownLocs.length;
  return html`<div class="find-fgroups">
    <div class="filter-group" role="group" aria-labelledby=${px + "-lv"}>
      <h4 id=${px + "-lv"}>Level</h4>
      <div class="chips">${LEVELS.map((l) => html`<${find_FacetChip} key=${l.id} on=${f.lv.includes(l.id)} n=${counts.cLv[l.id]} onClick=${() => find_setFilters({ lv: find_toggle(f.lv, l.id) })}>${l.label}</${find_FacetChip}>`)}</div>
    </div>
    <div class="filter-group" role="group" aria-labelledby=${px + "-role"}>
      <h4 id=${px + "-role"}>Role</h4>
      <div class="chips">${roles.map((r) => html`<${find_FacetChip} key=${r} on=${f.roles.includes(r)} n=${counts.cRole[r]} onClick=${() => find_setFilters({ roles: find_toggle(f.roles, r) })}>${r}</${find_FacetChip}>`)}</div>
    </div>
    <div class="filter-group" role="group" aria-labelledby=${px + "-loc"}>
      <h4 id=${px + "-loc"}>Location${f.locs.length > 0 && html` <button type="button" class="find-link find-h-clear" onClick=${() => find_setFilters({ locs: [] })}>Clear</button>`}</h4>
      <div class="find-opts">${shownLocs.map((o) => html`<${find_CheckRow} key=${o.id} id=${`${px}-loc-${o.id.replace(/\W+/g, "-")}`} checked=${f.locs.includes(o.id)} onChange=${() => find_setFilters({ locs: find_toggle(f.locs, o.id) })} label=${o.label} n=${o.n} />`)}</div>
      ${(hidden > 0 || moreLocs) && html`<button type="button" class="find-link find-more-link" aria-expanded=${moreLocs ? "true" : "false"} onClick=${() => setMoreLocs(!moreLocs)}>${moreLocs ? "Show fewer" : `Show ${hidden} more`}</button>`}
    </div>
    <div class="filter-group">
      <h4>Posted</h4>
      <${Seg} label="Posted within" value=${f.posted === "since" ? "" : f.posted} options=${FIND_POSTED} onChange=${(v) => find_setFilters({ posted: v })} />
      ${visit.since && html`<div class="chips"><${Chip} on=${f.posted === "since"} icon="bolt" onClick=${() => find_setFilters({ posted: f.posted === "since" ? "any" : "since" })}>New since your last visit</${Chip}></div>`}
    </div>

    </div>

  </div>`;
}

/* ---------- VIEWS.find ---------- */
VIEWS.find = function FindView() {
  const jobs = useJobs();
  const s = useStore();

  const sort = s.ui.findSort || "new";
  const byJob = find_useAppsByJob();
  const [qIn, setQIn] = useState(find_state.q);
  const [q, setQ] = useState(find_state.q);
  const [shown, setShown] = useState(FIND_PAGE);
  const [sel, setSel] = useState(-1);
  const sentinel = useRef(null);

  useEffect(() => { const t = setTimeout(() => { setQ(qIn); find_state.q = qIn; }, 120); return () => clearTimeout(t); }, [qIn]);

  const ready = jobs.status === "ready";
  const counts = useMemo(() => (ready ? find_compute(jobs.jobs, f, q) : null), [ready, jobs.jobs, f, q]);
  const list = useMemo(() => (counts ? find_sort(counts.res, sort, profile) : []), [counts, sort, profile]);
  useEffect(() => { setShown(FIND_PAGE); setSel(-1); }, [list]);

  // auto-load more as the sentinel scrolls into view
  useEffect(() => {
    const el = sentinel.current;
    if (!el || shown >= list.length || typeof IntersectionObserver === "undefined") return;
    const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) setShown((n) => Math.min(list.length, n + FIND_PAGE)); }, { rootMargin: "400px" });
    io.observe(el);
    return () => io.disconnect();
  }, [shown, list]);

  // J / K / Enter / S
  const kref = useRef({}); kref.current = { list, sel, shown, byJob };
  useEffect(() => {
    let lastG = 0;
    const onKey = (e) => {
      if (find_typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
      if (ui.state.modal || ui.state.palette || ui.state.drawer) return;
      const k = e.key.toLowerCase();
      if (k === "g") { lastG = now(); return; }
      if (now() - lastG < 1200) { lastG = 0; return; } // let the shell handle "G then …"
      const { list, sel, shown, byJob } = kref.current;
      if (!list.length) return;
      if (k === "j" || k === "k") {
        e.preventDefault();
        const next = clamp(sel + (k === "j" ? 1 : -1), 0, list.length - 1);

    };

    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const meta = jobs.meta || {};
  const st = meta.stats || {};
  const genAt = meta.generatedAt ? Date.parse(meta.generatedAt) : null;

    <div>

        ? html`<span class="num">${fmt.num(st.active || jobs.jobs.length)}</span> open internship and new-grad roles from <span class="num">${fmt.num(st.companies || jobs.byCompany.size)}</span> companies${genAt ? ` · updated ${fmt.ago(genAt)}` : ""} · <button type="button" class="find-link" onClick=${() => openModal("method")}>How we score listings</button>`
        : "Open internship and new-grad roles, checked for ghost-job signals."}</p>
    </div>

  if (!ready) {
    return html`<div class="page find-page">${head}
      <div class="find-layout">
        <aside class="filters find-aside" aria-label="Filters">${[0, 1, 2].map((i) => html`<div class="filter-group" key=${i}><div class="skel" style="height:10px;width:60px"></div><div class="skel" style="height:30px;width:100%"></div></div>`)}</aside>
        <div class="stack">
          ${jobs.status === "error"
            ? html`<div class="card"><${Empty} icon="alert" title="Couldn't load job listings" action=${html`<${Btn} kind="primary" icon="refresh" onClick=${() => loadJobs()}>Try again</${Btn}>`}>The listings file didn't load (${jobs.error || "unknown error"}). Check your connection and try again.</${Empty}></div>`
            : html`<div class="card find-results"><${Skeleton} rows=${9} /></div>`}
        </div>
      </div>
    </div>`;
  }

  // empty-state suggestion: which single change brings back the most jobs
  let suggestion = null;
  if (!list.length) {
    const cands = [];
    if (q) cands.push({ label: "Clear the search", desc: "Clearing the search", run: () => { setQIn(""); setQ(""); find_state.q = ""; }, n: find_run(jobs.jobs, f, "", false).res.length });
    const tries = [["locs", [], "Any location", "Removing the location filter"], ["roles", [], "Any role", "Removing the role filter"], ["lv", [], "Any level", "Removing the level filter"], ["posted", "any", "Any posting date", "Removing the date filter"], ["visa", "any", "Any visa status", "Removing the visa filter"], ["hideGhost", false, "Show listings with strong ghost signals", "Showing listings with strong ghost signals"]];
    for (const [k, v, label, desc] of tries) {
      const cur = f[k]; if (Array.isArray(cur) ? !cur.length : cur === v) continue;
      cands.push({ label, desc, run: () => find_setFilters({ [k]: v }), n: find_run(jobs.jobs, { ...f, [k]: v }, q, false).res.length });
    }
    suggestion = cands.filter((c) => c.n > 0).sort((a, b) => b.n - a.n)[0] || null;
  }

  const rows = list.slice(0, shown);
  return html`<div class="page find-page">
    ${head}
    <div class="find-layout">
      <aside class="filters find-aside" aria-label="Filters">
        <${find_FilterControls} px="find-f" f=${f} counts=${counts} jobs=${jobs.jobs} />
      </aside>
      <div class="stack find-main">
        <div class="find-toolbar">
          <div class="input-icon find-search">
            <${Icon} name="search" />
            <input id="find-q" class="input" type="search" placeholder="Search title, company or location" value=${qIn} onInput=${(e) => setQIn(e.currentTarget.value)} onKeyDown=${(e) => { if (e.key === "Escape" && qIn) { e.stopPropagation(); setQIn(""); } else if (e.key === "Enter") { setQ(qIn); find_state.q = qIn; } }} aria-label="Search jobs" autocomplete="off" />

/* ---------- Claude helper hook ---------- */
function find_useAI() {
  const [st, setSt] = useState({ busy: false, err: "", out: null, partial: "" });
  const ctl = useRef(null);
  useEffect(() => () => ctl.current?.abort(), []);
  const run = async (fn) => {
    ctl.current?.abort();
    const c = new AbortController(); ctl.current = c;
    setSt({ busy: true, err: "", out: null, partial: "" });
    try {
      const out = await fn(c.signal, (partial) => { if (!c.signal.aborted) setSt((x) => ({ ...x, partial })); });
      if (!c.signal.aborted) setSt({ busy: false, err: "", out, partial: "" });
    } catch (e) {
      if (c.signal.aborted || e?.name === "AbortError" || e?.code === "aborted") setSt((x) => ({ ...x, busy: false }));
      else setSt({ busy: false, err: aiErr(e), out: null, partial: "" });
    }
  };
  const stop = () => { ctl.current?.abort(); setSt((x) => ({ ...x, busy: false })); };
  return [st, run, stop];
}
function find_Thinking({ onStop, text }) {
  return html`<div class="find-think"><span class="find-pulse" aria-hidden="true"></span><span class="muted">${text || "Thinking…"}</span><span class="spacer" style="flex:1"></span><${Btn} size="sm" onClick=${onStop}>Stop</${Btn}></div>`;
}

const CO_SORTS = [{ id: "open", label: "Most open roles" }, { id: "hiring", label: "Still hiring" }, { id: "fast", label: "Fastest to close" }, { id: "ghost", label: "Most likely real" }, { id: "az", label: "A–Z" }];
const find_openN = (jobsState, name, c) => (jobsState.byCompany.get(name) || []).length || c.open || 0;
const find_stillShare = (c) => (c.season && c.season.posted ? c.season.open / c.season.posted : null);
/* One definition of "Reposted", used by the Companies table and both drawers:
   share of a company's open roles (as listed in Find) whose title it posted and closed before. */
const FIND_REPOST_HELP = "Share of this company's open roles whose title it posted and closed at least once before. Grey under 20%, amber from 20%, red from 50%. Not proof either way.";
/* Per-company figures from the listings Find shows (deduped), so every count on screen agrees. */
const find_aggC = { jobs: null, m: null };
function find_coAgg(jobsState) {
  if (find_aggC.jobs !== jobsState.jobs) {
    const m = new Map();
    for (const [co, list] of jobsState.byCompany) {
      let r = 0, ni = 0; for (const j of list) { if (j.rp >= 1) r++; if (j.lvl === "intern") ni++; }
      m.set(co, { n: list.length, rep: list.length ? r / list.length : 0, ni, ng: list.length - ni });
    }
    find_aggC.jobs = jobsState.jobs; find_aggC.m = m;
  }
  return find_aggC.m;
}
const find_repostShare = (jobsState, name) => find_coAgg(jobsState).get(name)?.rep ?? jobsState.cstats[name]?.repostShare ?? 0;
const find_repTone = (r) => (r >= 0.5 ? "high" : r >= 0.2 ? "mid" : "");
function find_useAppsByCompany() {
  const s = useStore();
  return useMemo(() => { const m = new Map(); for (const a of Apps.list(s)) { const k = norm(a.company); m.set(k, (m.get(k) || 0) + 1); } return m; }, [s.apps, s.settings.showExamples]);
}

  const agg = ready ? find_coAgg(jobs) : null;
  const rs = { get: (name) => agg?.get(name)?.rep };
  const list = useMemo(() => {
    if (!ready) return [];
    const words = norm(q).split(" ").filter(Boolean);
    let arr = Object.entries(jobs.cstats).map(([name, c]) => ({ name, c, k: norm(name), open: find_openN(jobs, name, c) }));
    if (words.length) arr = arr.filter((x) => words.every((w) => x.k.includes(w)));
    const by = {
      open: (a, b) => b.open - a.open || a.name.localeCompare(b.name),
      hiring: (a, b) => (find_stillShare(b.c) ?? -1) - (find_stillShare(a.c) ?? -1) || (b.c.season?.open || 0) - (a.c.season?.open || 0),
      fast: (a, b) => (a.c.medOpenDays ?? 1e9) - (b.c.medOpenDays ?? 1e9) || b.open - a.open,
      ghost: (a, b) => (rs.get(a.name) ?? 0) - (rs.get(b.name) ?? 0) || a.c.avgGhost - b.c.avgGhost || b.open - a.open,
      az: (a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }),
    }[sort];
    return arr.sort(by);
  }, [ready, jobs.cstats, q, sort]);
  useEffect(() => setShown(50), [q, sort]);

  const head = html`<div class="page-head"><div><h1>Companies</h1><p>${ready ? html`<span class="num">${fmt.num(Object.keys(jobs.cstats).length)}</span> companies with open internship or new-grad roles, and how their listings usually behave.` : "Companies hiring interns and new grads, with how long their listings usually stay open."}</p></div></div>`;

  const rows = list.slice(0, shown);
  const anyApps = list.some((x) => appsBy.get(x.k));
  const lifetime = (c) => find_daysText(c.medOpenDays) || html`<span class="faint">Not enough data</span>`;
  return html`<div class="page">
    ${head}
    <div class="find-toolbar find-co-toolbar">
      <div class="input-icon find-search"><${Icon} name="search" /><input id="co-q" class="input" type="search" placeholder="Search companies" value=${qIn} onInput=${(e) => setQIn(e.currentTarget.value)} onKeyDown=${(e) => { if (e.key === "Escape" && qIn) { e.stopPropagation(); setQIn(""); } }} aria-label="Search companies" autocomplete="off" />${qIn && html`<${Btn} kind="ghost" size="sm" icon="x" cls="find-qclear" aria-label="Clear search" onClick=${() => { setQIn(""); setQ(""); document.getElementById("co-q")?.focus(); }} />`}</div>
      <div class="hide-sm"><${Seg} label="Sort companies" value=${sort} options=${CO_SORTS} onChange=${setSort} /></div>
      <select id="co-sort-sm" class="select show-sm find-sort-sm" aria-label="Sort companies" value=${sort} onChange=${(e) => setSort(e.currentTarget.value)}>${CO_SORTS.map((o) => html`<option key=${o.id} value=${o.id}>${o.label}</option>`)}</select>
    </div>
    ${!list.length ? html`<div class="card"><${Empty} icon="companies" title=${`No companies match “${q}”`} action=${html`<${Btn} onClick=${() => { setQIn(""); setQ(""); }}>Clear search</${Btn}>`}>Only companies with at least one open internship or new-grad listing are here.</${Empty}></div>` : html`
    <div class="card hide-sm">
      <table class="table find-cotable">
        <thead><tr>
          <th>Company</th><th class="r">Open roles</th><th>Intern / new grad</th><th class="r" title="Median days a closed listing stayed open"><span class="find-th-help">Typical time open<${Icon} name="info" size=${12} /></span></th><th class="r" title="Share of this season's internship postings still open"><span class="find-th-help">Still hiring<${Icon} name="info" size=${12} /></span></th><th class="r" title=${FIND_REPOST_HELP}><span class="find-th-help">Reposted<${Icon} name="info" size=${12} /></span></th>${anyApps && html`<th class="r">Your apps</th>`}
        </tr></thead>
        <tbody>${rows.map((x) => {
          const n = appsBy.get(x.k) || 0;
          const g = rs.get(x.name) ?? 0;
          return html`<tr key=${x.name} tabindex="0" onClick=${() => openCompany(x.name)} onKeyDown=${(e) => { if (e.key === "Enter") openCompany(x.name); }}>
            <td><div class="row"><${Logo} name=${x.name} size="sm" /><span class="truncate find-coname">${x.name}</span></div></td>
            <td class="r num">${fmt.num(x.open)}</td>
            ${(() => { const a = agg.get(x.name) || { n: x.c.open, ni: x.c.intern, ng: x.c.newgrad }; return html`<td><div class="find-split" title=${`${pluralize(a.ni, "internship")} · ${a.ng} new grad`}><span class="find-split-bar"><i style=${`width:${a.n ? (a.ni / a.n) * 100 : 0}%`}></i></span><span class="num muted">${fmt.num(a.ni)} / ${fmt.num(a.ng)}</span></div></td>`; })()}

function find_Stat({ label, value, sub, title }) {
  return html`<div class="find-stat" title=${title || null}>
    <span class="stat-label">${label}</span>
    <span class="find-stat-v num">${value}</span>
    ${sub && html`<span class="stat-sub">${sub}</span>`}

}
function find_TimeOpenStat({ cs }) {
  const nClosed = cs?.closedTimed || 0;
  const fromClosed = nClosed ? `From ${pluralize(nClosed, "closed listing")}` : "";
  return html`<${find_Stat} label="Typical time open" value=${find_daysText(cs.medOpenDays) || html`<span class="faint find-nd">Not enough data</span>`} title=${cs.medOpenDays != null ? `Median days a closed listing stayed open. ${fromClosed}.` : "Needs at least 5 closed listings with dates."} />`;
}
function find_BriefText({ text }) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const bullets = lines.filter((l) => /^[-•*]\s+/.test(l));
  if (bullets.length >= 2 && bullets.length >= lines.length - 1) {
    const intro = lines.filter((l) => !/^[-•*]\s+/.test(l));
    return html`<div class="find-brief">${intro.map((l, i) => html`<p key=${"p" + i}>${l}</p>`)}<ul class="reason-list find-reasons">${bullets.map((l, i) => html`<li key=${i}>${l.replace(/^[-•*]\s+/, "")}</li>`)}</ul></div>`;
  }
  return html`<div class="find-brief find-brief-pre">${text}</div>`;
}
function find_Brief({ name, cs }) {
  const key = `heardback:find:brief:${name}`;
  const cached = storage.get(key, null);
  const fresh = cached && now() - cached.at < DAY ? cached : null;
  const [st, run, stop] = find_useAI();
  const text = st.out || st.partial || (fresh && fresh.text) || "";
  const go = () => run(async (signal, onPartial) => {
    const cats = Object.entries(cs?.cats || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} (${v})`).join(", ");
    const prompt = `Write a short, neutral overview of the company "${name}" for a student weighing an internship or new-grad role there.
Use 4 to 6 bullets starting with "- ": what the company does, rough size or stage, main products, and anything useful to know as an early-career applicant.
Only state things you are confident about from general knowledge. If you don't know this company well, or the name is ambiguous, say so in one sentence and stop. Do not guess about hiring practices, culture or response rates. Plain text, no headings, no bold.
For context, public listing data currently shows ${cs?.open || 0} open roles${cats ? ` in ${cats}` : ""}${(cs?.locs || []).length ? `, mostly in ${cs.locs.slice(0, 3).join("; ")}` : ""}.`;
    const r = await askClaude(prompt, { signal, modelTier: "quick", onText: ({ text }) => onPartial(text) });
    const out = (r?.text || "").trim();
    if (out) storage.set(key, { at: now(), text: out });
    return out;
  });
  return html`<section class="dsec" aria-labelledby="find-brief-h">
    <h3 id="find-brief-h">Company overview<span class="spacer"></span>${!st.busy && text && html`<${Btn} kind="ghost" size="sm" icon="refresh" onClick=${go}>Refresh</${Btn}>`}</h3>
    ${st.busy && html`<${find_Thinking} onStop=${stop} text=${st.partial ? "Writing…" : "Thinking…"} />`}
    ${text ? html`<${find_BriefText} text=${text} />` : !st.busy && html`<div class="row wrap find-brief-cta"><${Btn} icon="spark" onClick=${go}>Brief me on this company</${Btn}><span class="hint">From Claude's general knowledge.</span></div>`}
    ${st.err && html`<div class="callout wait"><${Icon} name="alert" /><span>${st.err}</span></div>`}
    ${text && html`<span class="ai-label"><${Icon} name="spark" />Drafted by Claude from general knowledge · may be out of date · verify before relying on it.${fresh && !st.out && !st.busy ? ` Saved ${fmt.ago(fresh.at)}.` : ""}</span>`}
  </section>`;
}

/* --- js/views/onboarding.js --- */
/* ===== Onboarding (first run) + shared resume editor =====
   Three steps: targets -> resume (optional) -> live matching roles. Finishable in under a minute.
   Shared with prefs.js: OnbResumeEditor, onbEditorInit, onbEditorSkills, onbToggle, onbLocChoices. */

const onbToggle = (arr, v) => (arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]);
const onbLocChoices = () => LOC_OPTIONS.filter((o) => o.id !== "remote");
const ONB_SKILL_NAMES = SKILLS.map((s) => s[0]);

/* ---------- Resume editor state: text + manual adds/removals on top of detected skills ---------- */
function onbEditorInit(profile) {
  const text = profile.resume || "";
  const det = extractSkills(text);
  const skills = profile.skills || [];
  return { text, added: skills.filter((s) => !det.includes(s)), removed: det.filter((s) => !skills.includes(s)) };
}
function onbEditorSkills(v) {
  const det = extractSkills(v.text).filter((s) => !v.removed.includes(s));
  return [...det, ...v.added.filter((s) => !det.includes(s))];
}
function onbCleanSkill(raw) {
  const t = (raw || "").trim().replace(/\s+/g, " ").slice(0, 40);
  if (!t) return "";
  const known = ONB_SKILL_NAMES.find((n) => n.toLowerCase() === t.toLowerCase());
  return known || t;
}

function onbSuggest(raw, skills) {
  const q = (raw || "").trim().toLowerCase();
  if (!q) return [];
  const have = new Set(skills.map((x) => x.toLowerCase()));
  return ONB_SKILL_NAMES
    .filter((n) => !have.has(n.toLowerCase()) && n.toLowerCase().includes(q) && n.toLowerCase() !== q)
    .sort((a, b) => (a.toLowerCase().startsWith(q) ? 0 : 1) - (b.toLowerCase().startsWith(q) ? 0 : 1) || a.length - b.length)
    .slice(0, 6);
}

function OnbResumeEditor({ value, onChange, idp = "res" }) {
  const [add, setAdd] = useState("");
  const [fileNote, setFileNote] = useState(null);
  const skills = onbEditorSkills(value);
  const detected = extractSkills(value.text);
  const setText = (text) => onChange({ ...value, text });
  const remove = (s) => onChange(detected.includes(s) ? { ...value, removed: [...value.removed, s] } : { ...value, added: value.added.filter((x) => x !== s) });
  const addSkill = (name) => {
    const s = onbCleanSkill(typeof name === "string" ? name : add);
    if (!s) return;
    setAdd("");
    if (skills.some((x) => x.toLowerCase() === s.toLowerCase())) return;
    if (detected.includes(s)) onChange({ ...value, removed: value.removed.filter((x) => x !== s) });
    else onChange({ ...value, added: [...value.added, s] });
  };
  const [reading, setReading] = useState(false);
  const onFile = async (e) => {
    const f = e.currentTarget.files && e.currentTarget.files[0];
    e.currentTarget.value = "";
    if (!f) return;
    setReading(true); setFileNote(null);
    try {
      const { text } = await readResumeFile(f);
      setText(String(text || "").slice(0, 40000));
      setFileNote({ ok: true, text: `Read ${f.name}. Check the text below and fix anything that came through oddly.` });
    } catch (err) {
      setFileNote({ ok: false, text: (err && err.message) || `Couldn't read ${f.name}. Paste the text instead.` });
    } finally { setReading(false); }
  };
  const words = (value.text.trim().match(/\S+/g) || []).length;
  const sugg = onbSuggest(add, skills);
  const suggRef = useRef(null);
  const hasSugg = sugg.length > 0;
  useEffect(() => { if (hasSugg) suggRef.current?.scrollIntoView?.({ block: "nearest" }); }, [hasSugg]);
  return html`<div class="stack onb-resume">
    <div class="onb-resume-head">
      <label class="label" for=${idp + "-text"}>Resume text</label>
      <span class="spacer"></span>
      <label class=${cx("btn sm onb-file", reading && "is-busy")} aria-disabled=${reading ? "true" : null}><${Icon} name="upload" />${reading ? "Reading…" : "Upload PDF"}<input id=${idp + "-file"} class="sr" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown" disabled=${reading} onChange=${onFile} /></label>
    </div>
    <span class="hint onb-resume-hint">Upload a PDF or paste the text. It stays in this browser.</span>
    ${reading && html`<div class="callout info" role="status"><span class="onb-spin" aria-hidden="true"></span><span>Reading your resume…</span></div>`}
    ${fileNote && html`<div class=${cx("callout", fileNote.ok ? "info" : "wait")} role="status"><${Icon} name=${fileNote.ok ? "check" : "info"} /><span>${fileNote.text}</span></div>`}
    <textarea id=${idp + "-text"} class="textarea onb-textarea" placeholder="Paste the text of your resume here. Experience, projects, skills: plain text is fine." value=${value.text} onInput=${(e) => setText(e.currentTarget.value)}></textarea>
    <div class="row onb-meta"><span class="hint num">${words ? pluralize(words, "word") : "Nothing pasted yet"}</span>${value.text && html`<button type="button" class="onb-link" onClick=${() => setText("")}>Clear text</button>`}</div>
    <div class="stack-sm">
      <div class="row"><span class="label">Skills</span><span class="faint num" style="font-size:var(--fs-xs)">${skills.length || ""}</span></div>
      <span class="hint">${value.text ? "Found in your resume. Remove any that don't fit and add ones we missed." : "We'll pick these up from your resume. You can also add them by hand."}</span>
      ${skills.length ? html`<div class="chips">${skills.map((s) => html`<button type="button" key=${s} class="chip onb-skill" aria-pressed="true" aria-label=${"Remove " + s} title=${"Remove " + s} onClick=${() => remove(s)}>${s}<${Icon} name="x" size=${12} /></button>`)}</div>` : null}
      <form class="row onb-add" onSubmit=${(e) => { e.preventDefault(); addSkill(); }}>
        <input id=${idp + "-add"} class="input" placeholder="Add a skill, e.g. SQL" value=${add} onInput=${(e) => setAdd(e.currentTarget.value)} aria-label="Add a skill" autocomplete="off" />
        <${Btn} type="submit" disabled=${!add.trim()}>Add</${Btn}>
      </form>
      ${sugg.length > 0 && html`<div class="onb-sugg" ref=${suggRef} role="group" aria-label="Suggested skills">
        <span class="hint">Suggestions</span>
        ${sugg.map((n) => html`<button type="button" key=${n} class="onb-sugg-btn" onClick=${() => addSkill(n)} aria-label=${"Add " + n}><${Icon} name="plus" size=${12} />${n}</button>`)}
      </div>`}
    </div>
    <p class="onb-privacy"><${Icon} name="shield" /><span>Your resume is only sent to Claude when you click an AI action.</span></p>
  </div>`;
}

MODALS.resume = () => {
  const [v, setV] = useState(() => onbEditorInit(store.get().profile));
  const save = () => {
    store.set((s) => ({ ...s, profile: { ...s.profile, resume: v.text.trim(), skills: onbEditorSkills(v) } }));
    closeModal(); toast("Resume saved");
  };
  return html`<${Modal} title="Your resume" size="lg" onClose=${closeModal} foot=${html`<${Btn} onClick=${closeModal}>Cancel</${Btn}><${Btn} kind="primary" onClick=${save}>Save resume</${Btn}>`}>
    <p class="muted" style="font-size:var(--fs-sm)">Used for fit scores, interview talking points, and tailoring. Plain text works best.</p>
    <${OnbResumeEditor} value=${v} onChange=${setV} idp="resm" />

/* ---------- Matching (step 3) ---------- */
function onbGenTs(meta) {
  const g = meta && meta.generatedAt; if (!g) return null;
  const t = typeof g === "number" ? (g < 1e12 ? g * 1000 : g) : Date.parse(g);
  return isNaN(t) ? null : t;
}
function onbMatches(jobs, p) {
  const lv = p.levels.length ? p.levels : ["intern", "newgrad"];
  const locs = p.locations.filter((l) => l !== "remote");
  const out = [];
  for (const j of jobs) {
    if (!lv.includes(j.lvl)) continue;
    if (p.roles.length && !p.roles.includes(j.cat)) continue;
    if (locs.length && !(locs.some((l) => jobInLoc(j, l)) || (p.remote && j.r))) continue;
    if (!locs.length && !p.remote && j.r && j.nl <= 1 && (j.l || []).every((x) => /remote/i.test(x))) continue;
    if (p.needsSponsor && (j.sp === "no" || j.sp === "citizen")) continue;
    out.push(j);
  }
  return out;
}
function onbTop(list, p, n = 5) {
  return list
    .map((j) => ({ j, f: fitScore(j, p) }))
    .sort((a, b) => (b.f?.score || 0) - (a.f?.score || 0) || (a.j.g || 0) - (b.j.g || 0) || b.j.p - a.j.p)
    .slice(0, n);
}
function onbSummary(p) {
  const lv = p.levels.length === 1 ? (p.levels[0] === "intern" ? "Internships" : "New grad roles") : "Internships and new grad roles";
  const roles = p.roles.length ? p.roles.join(", ") : "all roles";
  const locs = p.locations.filter((l) => l !== "remote").map((l) => LOC_OPTIONS.find((o) => o.id === l)?.label || l);
  const where = locs.length ? `${locs.slice(0, 3).join(", ")}${locs.length > 3 ? ` +${locs.length - 3}` : ""}${p.remote ? ", or remote" : ""}` : p.remote ? "any location, including remote" : "any location";
  return `${lv} · ${roles} · ${where}${p.needsSponsor ? " · sponsorship not ruled out" : ""}`;
}

/* ---------- Location checklist (shared with Settings): same pattern as Find. Top 6 by open roles, rest behind "Show N more". ---------- */
const ONB_LOC_TOP = 6;
const onbLocCountC = { jobs: null, counts: null };
function onbLocCounts(jobs) {
  if (!jobs || !jobs.length) return null;
  if (onbLocCountC.jobs !== jobs) {
    const opts = onbLocChoices();
    const c = {}; for (const o of opts) c[o.id] = 0;
    for (const j of jobs) for (const o of opts) if (jobInLoc(j, o.id)) c[o.id]++;
    onbLocCountC.jobs = jobs; onbLocCountC.counts = c;

}

  const jobs = useJobs();

  const opts = onbLocChoices().map((o, i) => ({ ...o, n: counts ? counts[o.id] : null, i }));
  if (counts) opts.sort((a, b) => b.n - a.n || a.i - b.i);
  const top = opts.slice(0, ONB_LOC_TOP);
  const shown = more ? opts : top.concat(opts.slice(ONB_LOC_TOP).filter((o) => value.includes(o.id)));
  const hidden = opts.length - shown.length;
  return html`<div class="onb-locs" role="group" aria-label=${label || "Locations"}>
    <div class="find-opts onb-opts">${shown.map((o) => {

  </div>`;
}
