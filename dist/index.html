<title>Heardback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Heardback: find real internship and new-grad jobs, spot ghost listings, and track every application and interview round.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (232px) + top bar + scrolling workspace; bottom tab bar under 760px.
   Identity: cool ink neutrals with a faint blue bias, one cobalt accent, semantic status hues kept apart from the accent. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --surface-3: #e8ebf0;
  --line: #e2e6ec;
  --line-strong: #cfd5de;
  --fg: #12161d;
  --fg-2: #4a5361;
  --fg-3: #6b7482;
  --accent: #3150d6;
  --accent-hover: #2843bb;
  --accent-soft: #eaeefc;
  --accent-fg: #ffffff;
  --accent-text: #2a46c4;
  --ok: #1d7a4f;
  --ok-soft: #e5f4ec;
  --wait: #9a6100;
  --wait-soft: #fbf1dd;
  --bad: #c0352b;
  --bad-soft: #fbe9e7;
  --ghost: #6d6787;
  --ghost-soft: #eeedf4;
  --info: #2a6f9e;
  --info-soft: #e5f0f8;
  --shadow-float: 0 1px 2px rgba(18, 22, 29, .06), 0 8px 24px rgba(18, 22, 29, .10);
  --shadow-pop: 0 2px 4px rgba(18, 22, 29, .06), 0 16px 48px rgba(18, 22, 29, .16);
  --scrim: rgba(18, 22, 29, .32);
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);

  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 14px;
  --fs-lg: 17px;
  --fs-xl: 24px;

  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --rail: 232px;
  --top: 56px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-fast: 120ms;
  --t-med: 180ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --surface-3: #232830;
    --line: #262b33; --line-strong: #353c46;
    --fg: #e9ecf1; --fg-2: #aab2bf; --fg-3: #8a93a1;
    --accent: #6f8bff; --accent-hover: #8aa0ff; --accent-soft: #1c2440; --accent-fg: #0b1020; --accent-text: #93a8ff;
    --ok: #4cc38a; --ok-soft: #12291e; --wait: #e2a740; --wait-soft: #2b2112; --bad: #f0776c; --bad-soft: #2e1715;
    --ghost: #a59fc2; --ghost-soft: #221f2e; --info: #6cb4e6; --info-soft: #132433;
    --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
    --shadow-pop: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 48px rgba(0, 0, 0, .6);
    --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --surface-3: #232830;
  --line: #262b33; --line-strong: #353c46;
  --fg: #e9ecf1; --fg-2: #aab2bf; --fg-3: #8a93a1;
  --accent: #6f8bff; --accent-hover: #8aa0ff; --accent-soft: #1c2440; --accent-fg: #0b1020; --accent-text: #93a8ff;
  --ok: #4cc38a; --ok-soft: #12291e; --wait: #e2a740; --wait-soft: #2b2112; --bad: #f0776c; --bad-soft: #2e1715;
  --ghost: #a59fc2; --ghost-soft: #221f2e; --info: #6cb4e6; --info-soft: #132433;
  --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
  --shadow-pop: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 48px rgba(0, 0, 0, .6);
  --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--fs-md); line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01" on, "cv11" on;
  overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: var(--fs-xs); }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
::selection { background: var(--accent-soft); }

/* ---------- App frame ---------- */
#app { height: 100%; }
.frame { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }
.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px; min-height: 0;
  padding: 12px 10px 12px max(10px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.brand-name { font-weight: 650; font-size: var(--fs-lg); letter-spacing: -0.02em; }
.brand-mark { width: 26px; height: 26px; flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.nav-label { font-size: var(--fs-xs); color: var(--fg-3); padding: 6px 10px 4px; letter-spacing: .02em; }
.nav-item {
  display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px;
  border-radius: var(--r-md); color: var(--fg-2); font-weight: 500; border: 0; background: none; width: 100%; text-align: left;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item[aria-current="page"] .ico { color: var(--accent-text); }
.nav-item .ico { color: var(--fg-3); }
.nav-count { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.nav-item[aria-current="page"] .nav-count { color: var(--accent-text); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 4px 0; }
.goal-card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-sm); }
.meter { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width var(--t-med) var(--ease); }
.meter.ok > i { background: var(--ok); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.topbar {
  height: var(--top); flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 20px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.top-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search-trigger {
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; min-width: 260px;
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); color: var(--fg-3);
  transition: border-color var(--t-fast);
}
.search-trigger:hover { border-color: var(--line-strong); }
.search-trigger .kbd { margin-left: auto; }
.workspace { flex: 1; min-height: 0; overflow: auto; scroll-behavior: smooth; }
.page { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.page.wide { max-width: none; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: var(--fs-xl); letter-spacing: -0.025em; }
.page-head p { color: var(--fg-2); margin-top: 4px; }
.page-head .spacer { flex: 1; }
.bottom-nav { display: none; }
.example-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: var(--r-lg); border: 1px dashed var(--line-strong); background: var(--surface);
  font-size: var(--fs-sm); color: var(--fg-2);
}
.example-banner b { color: var(--fg); font-weight: 600; }
.example-banner .spacer { flex: 1; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--fg); font-weight: 500; font-size: var(--fs-sm); white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast);
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:active { transform: translateY(0.5px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 28px; padding: 0 9px; font-size: var(--fs-xs); border-radius: var(--r-sm); }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }
.btn.block { width: 100%; }
.btn .kbd { margin-left: 4px; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface);
  font-family: var(--mono); font-size: 11px; color: var(--fg-3); line-height: 1;
}
.btn.primary .kbd { background: transparent; border-color: rgba(255,255,255,.35); color: inherit; opacity: .85; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
.hint { font-size: var(--fs-xs); color: var(--fg-3); }
.input, .select, .textarea {
  width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--fg); font-size: var(--fs-sm);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--fg-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: vertical; line-height: 1.5; min-height: 96px; }
.select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.input-icon { position: relative; display: flex; align-items: center; }
.input-icon .ico { position: absolute; left: 10px; color: var(--fg-3); pointer-events: none; }
.input-icon .input { padding-left: 32px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); cursor: pointer; min-height: 28px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-strong); transition: background var(--t-fast); pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform var(--t-med) var(--ease); }
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i { box-shadow: var(--focus); }

.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); gap: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; background: transparent; border-radius: 6px; font-size: var(--fs-sm); color: var(--fg-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(18,22,29,.08), 0 0 0 1px var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px;
  border: 1px solid var(--line-strong); background: var(--surface); font-size: var(--fs-sm); color: var(--fg-2); font-weight: 500;
  transition: all var(--t-fast) var(--ease);
}
.chip:hover { border-color: var(--fg-3); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* ---------- Badges & status ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px;
  font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); border: 1px solid transparent;
  font-variant-numeric: tabular-nums;
}
.badge.outline { background: transparent; border-color: var(--line-strong); }
.badge.accent { background: var(--accent-soft); color: var(--accent-text); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.wait { background: var(--wait-soft); color: var(--wait); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.ghost { background: var(--ghost-soft); color: var(--ghost); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.example { background: transparent; border: 1px dashed var(--line-strong); color: var(--fg-3); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3); }
.dot.saved { background: var(--fg-3); }
.dot.applied { background: var(--accent); }
.dot.screen { background: var(--info); }
.dot.interview { background: var(--wait); }
.dot.offer { background: var(--ok); }
.dot.rejected { background: var(--bad); }
.dot.ghosted { background: var(--ghost); }
.logo {
  width: 32px; height: 32px; flex: none; border-radius: var(--r-md); display: grid; place-items: center;
  font-weight: 600; font-size: var(--fs-sm); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line);
  letter-spacing: -0.02em;
}
.logo.lg { width: 48px; height: 48px; font-size: var(--fs-lg); border-radius: var(--r-lg); }
.logo.sm { width: 24px; height: 24px; font-size: 11px; border-radius: var(--r-sm); }

/* ghost meter */
.gscore { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.gbars { display: inline-flex; gap: 2px; align-items: flex-end; }
.gbars i { width: 3px; border-radius: 1px; background: var(--surface-3); }
.gbars i:nth-child(1) { height: 6px; } .gbars i:nth-child(2) { height: 9px; } .gbars i:nth-child(3) { height: 12px; }
.gscore.low { color: var(--ok); } .gscore.low .gbars i:nth-child(1) { background: var(--ok); }
.gscore.mid { color: var(--wait); } .gscore.mid .gbars i:nth-child(-n+2) { background: var(--wait); }
.gscore.high { color: var(--bad); } .gscore.high .gbars i { background: var(--bad); }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.card-pad { padding: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { font-size: var(--fs-md); font-weight: 600; }
.card-head .spacer { flex: 1; }
.card-body { padding: 16px; }
.section-title { font-size: var(--fs-md); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.section-title .count { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row .spacer { flex: 1; }
.divider { height: 1px; background: var(--line); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.stat { display: flex; flex-direction: column; gap: 4px; padding: 16px; min-width: 0; }
.stat-label { font-size: var(--fs-sm); color: var(--fg-2); }
.stat-value { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-sub { font-size: var(--fs-xs); color: var(--fg-3); }
.stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stats-row > .stat + .stat { border-left: 1px solid var(--line); }

/* table */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-sm); }
.table th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: var(--fs-xs); padding: 0 12px; height: 36px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.table th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 4px; align-items: center; }
.table td { padding: 0 12px; height: 48px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr { transition: background var(--t-fast); cursor: pointer; }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tr[aria-selected="true"] { background: var(--accent-soft); }

/* empty, skeleton */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px; }
.empty .empty-ico { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.empty h3 { font-size: var(--fs-md); }
.empty p { color: var(--fg-2); max-width: 42ch; font-size: var(--fs-sm); }
.skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-sm); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade var(--t-med) var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal {
  position: fixed; z-index: 41; left: 50%; top: 12vh; transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px)); max-height: 76vh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);

const Apps = {
  list(s = store.get()) { return Object.values(s.apps).filter((a) => s.settings.showExamples || !a.example); },
  get(id) { return store.get().apps[id]; },
  create(fields) {
    const t = now();
    const a = {
      id: uid("a_"), company: "", title: "", location: "", url: "", jobId: null, stage: "saved",
      createdAt: t, appliedAt: null, lastActivityAt: t, lastReplyAt: null, notes: "", contacts: [], rounds: [],
      events: [], salary: "", source: "manual", example: false, ...fields,
    };
    if (!a.events.length) a.events = [{ id: uid("e_"), at: t, kind: "created", text: a.stage === "saved" ? "Saved" : `Added as ${STAGE[a.stage]?.label || a.stage}` }];
    if (a.stage !== "saved" && !a.appliedAt) a.appliedAt = fields.appliedAt || t;
    store.set((s) => ({ ...s, apps: { ...s.apps, [a.id]: a } }));
    return a;
  },
  update(id, patch) {
    store.set((s) => {
      const a = s.apps[id]; if (!a) return s;
      const p = typeof patch === "function" ? patch(a) : patch;
      return { ...s, apps: { ...s.apps, [id]: { ...a, ...p } } };
    });
  },
  move(id, stage, opts = {}) {
    const a = Apps.get(id); if (!a || a.stage === stage) return;
    const t = opts.at || now();
    const ev = { id: uid("e_"), at: t, kind: "stage", from: a.stage, to: stage, text: `Moved to ${STAGE[stage].label}` };
    const patch = { stage, lastActivityAt: t, events: [...a.events, ev] };
    if (stage !== "saved" && !a.appliedAt) patch.appliedAt = t;
    if (["screen", "interview", "offer", "rejected"].includes(stage) && STAGE[a.stage].i < STAGE[stage].i) patch.lastReplyAt = t;
    Apps.update(id, patch);
    if (stage === "offer" && !opts.silent) celebrate(a);
    if (!opts.silent) toast(`${a.company} moved to ${STAGE[stage].label}`, { undo: () => Apps.update(id, a) });
  },
  remove(id) {
    const a = Apps.get(id);
    store.set((s) => { const apps = { ...s.apps }; delete apps[id]; return { ...s, apps }; });
    toast(`Removed ${a?.company || "application"}`, { undo: () => store.set((s) => ({ ...s, apps: { ...s.apps, [id]: a } })) });
  },
  addEvent(id, ev) { Apps.update(id, (a) => ({ events: [...a.events, { id: uid("e_"), at: now(), ...ev }], lastActivityAt: ev.at || now() })); },
  addRound(id, round) {
    const r = { id: uid("r_"), type: "recruiter", at: null, interviewers: "", prep: "", reflection: "", outcome: "pending", thanked: false, ...round };
    Apps.update(id, (a) => ({ rounds: [...a.rounds, r], lastActivityAt: now(), events: [...a.events, { id: uid("e_"), at: now(), kind: "round", text: `Added ${ROUND[r.type]?.label || "round"}${r.at ? " · " + fmt.dateTime(r.at) : ""}` }] }));
    return r;
  },
  updateRound(id, rid, patch) { Apps.update(id, (a) => ({ rounds: a.rounds.map((r) => (r.id === rid ? { ...r, ...patch } : r)) })); },
  removeRound(id, rid) { Apps.update(id, (a) => ({ rounds: a.rounds.filter((r) => r.id !== rid) })); },
  byJob(jobId) { return Object.values(store.get().apps).find((a) => a.jobId === jobId); },
  daysSilent(a) { const ref = Math.max(a.lastReplyAt || 0, a.appliedAt || 0, a.lastActivityAt || 0); return ref ? Math.floor((now() - ref) / DAY) : 0; },
};

async function copyText(text, label = "Copied") {

async function saveFile(filename, data, mime = "text/plain") {

    catch (e) { if (e?.code === "cancelled" || e?.code === "declined") return false; }

/* ---------- Text helpers ---------- */
function initials(name = "") {
  const w = name.replace(/[^A-Za-z0-9 &]/g, " ").split(/\s+/).filter(Boolean);
  if (!w.length) return "·";
  return (w.length === 1 ? w[0].slice(0, 2) : w[0][0] + w[1][0]).toUpperCase();
}
function hashHue(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h) % 360; }
function norm(s) { return (s || "").toLowerCase().replace(/[^a-z0-9+#.\s]/g, " ").replace(/\s+/g, " ").trim(); }
function csvEscape(v) { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim()));
}

function useEscape(fn) {
  useEffect(() => { const k = (e) => { if (e.key === "Escape") { e.stopPropagation(); fn(); } }; window.addEventListener("keydown", k, true); return () => window.removeEventListener("keydown", k, true); }, [fn]);
}
function useFocusTrap(ref) {
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const prev = document.activeElement;
    const first = el.querySelector("[autofocus], input, textarea, select, button");
    setTimeout(() => (first || el).focus?.(), 20);
    return () => { try { prev?.focus?.(); } catch {} };
  }, []);
}
function Modal({ title, onClose, children, foot, size, label }) {
  const ref = useRef(null);
  useEscape(onClose); useFocusTrap(ref);
  return html`<${Fragment}>
    <div class="scrim" onClick=${onClose}></div>
    <div class=${cx("modal", size)} role="dialog" aria-modal="true" aria-label=${label || title} ref=${ref} tabindex="-1">
      ${title && html`<div class="modal-head"><h2>${title}</h2><span class="spacer"></span><${Btn} kind="ghost" icon="x" aria-label="Close" onClick=${onClose} /></div>`}
      <div class="modal-body">${children}</div>
      ${foot && html`<div class="modal-foot">${foot}</div>`}
    </div>
  </${Fragment}>`;
}
function Drawer({ onClose, head, children, foot, label }) {
  const ref = useRef(null);
  useEscape(onClose); useFocusTrap(ref);
  return html`<${Fragment}>
    <div class="scrim" onClick=${onClose}></div>
    <aside class="drawer" role="dialog" aria-modal="true" aria-label=${label} ref=${ref} tabindex="-1">
      <div class="drawer-head">${head}<${Btn} kind="ghost" icon="x" aria-label="Close" onClick=${onClose} /></div>
      <div class="drawer-body">${children}</div>
      ${foot && html`<div class="drawer-foot">${foot}</div>`}
    </aside>
  </${Fragment}>`;
}
/* In-page confirm (the frame blocks window.confirm) */
function Confirm({ title, body, confirmLabel = "Confirm", danger, onConfirm, onClose }) {
  return html`<${Modal} title=${title} onClose=${onClose} foot=${html`<${Btn} onClick=${onClose}>Cancel</${Btn}><${Btn} kind=${danger ? "primary" : "primary"} onClick=${() => { onConfirm(); onClose(); }}>${confirmLabel}</${Btn}>`}>
    <p class="muted">${body}</p>
  </${Modal}>`;
}

/* Ghost score display */
function ghostLevel(g) { return g >= 50 ? "high" : g >= 25 ? "mid" : "low"; }
function ghostLabel(g) { return g >= 50 ? "Likely ghost" : g >= 25 ? "Some signs" : "Looks active"; }
function GhostScore({ g, compact }) {
  const lv = ghostLevel(g || 0);
  return html`<span class=${cx("gscore", lv)} title=${`Ghost-job signals: ${g || 0}/100`}><span class="gbars"><i></i><i></i><i></i></span>${!compact && ghostLabel(g || 0)}</span>`;
}
function Fresh({ ts }) {
  const d = (now() - ts) / DAY;
  return html`<span class=${cx("fresh", d < 2 && "new")} title=${`Posted ${fmt.dateY(ts)}`}>${d < 2 ? "New · " : ""}${fmt.ago(ts)}</span>`;
}

/* ===== Job data (published files next to the page) ===== */
const jobsStore = { status: "idle", jobs: [], companies: [], cstats: {}, meta: null, byId: new Map(), byCompany: new Map(), error: null };
const jobSubs = new Set();
function useJobs() { const [v, setV] = useState({ ...jobsStore }); useEffect(() => { const f = () => setV({ ...jobsStore }); jobSubs.add(f); f(); return () => jobSubs.delete(f); }, []); return v; }
async function loadJobs() {
  if (jobsStore.status === "loading") return;
  jobsStore.status = "loading"; jobsStore.error = null; jobSubs.forEach((f) => f());
  try {
    const [jr, cr] = await Promise.all([fetch("data/jobs.json"), fetch("data/companies.json")]);
    if (!jr.ok) throw new Error(`jobs ${jr.status}`);
    const j = await jr.json();
    const c = cr.ok ? await cr.json() : { companies: {} };
    const companies = j.companies || [];
    const jobs = (j.jobs || []).map((x) => {
      const co = companies[x.c] || "Unknown";
      return { ...x, co, p: x.p * 1000, u: (x.u || x.p) * 1000, _s: norm(`${x.t} ${co} ${(x.l || []).join(" ")}`) };
    });
    jobs.sort((a, b) => b.p - a.p);
    const byId = new Map(jobs.map((x) => [x.id, x]));
    const byCompany = new Map();
    for (const x of jobs) { if (!byCompany.has(x.co)) byCompany.set(x.co, []); byCompany.get(x.co).push(x); }
    const cstats = {};
    for (const [k, v] of Object.entries(c.companies || {})) cstats[v.n || companies[+k]] = v;
    Object.assign(jobsStore, { status: "ready", jobs, companies, cstats, meta: { generatedAt: j.generatedAt, source: j.source, stats: j.stats }, byId, byCompany });
  } catch (e) {
    jobsStore.status = "error"; jobsStore.error = String(e?.message || e);
  }
  jobSubs.forEach((f) => f());
}

/* ===== Fit score: transparent, based only on what the listing states ===== */
function fitScore(job, profile) {
  if (!profile || (!profile.roles?.length && !profile.locations?.length && !profile.skills?.length)) return null;
  const parts = [];
  let score = 0, max = 0;
  // role (35)
  max += 35;
  if (!profile.roles?.length) { score += 20; parts.push({ k: "Role", ok: null, text: "No target roles set" }); }
  else if (profile.roles.includes(job.cat)) { score += 35; parts.push({ k: "Role", ok: true, text: `${job.cat} matches your targets` }); }
  else parts.push({ k: "Role", ok: false, text: `${job.cat} is outside your targets` });
  // level (15)
  max += 15;
  const lv = profile.levels?.length ? profile.levels : ["intern", "newgrad"];
  if (lv.includes(job.lvl)) { score += 15; parts.push({ k: "Level", ok: true, text: job.lvl === "intern" ? "Internship" : "New grad role" }); }
  else parts.push({ k: "Level", ok: false, text: job.lvl === "intern" ? "Internship, you're looking for full-time" : "Full-time, you're looking for internships" });
  // location (20)
  max += 20;
  const locs = profile.locations || [];
  if (!locs.length) { score += 14; parts.push({ k: "Location", ok: null, text: "Open to any location" }); }
  else {
    const hit = locs.find((l) => jobInLoc(job, l)) || (profile.remote && job.r ? "remote" : null);
    if (hit) { score += 20; parts.push({ k: "Location", ok: true, text: hit === "remote" ? "Remote option" : `In ${LOC_OPTIONS.find((o) => o.id === hit)?.label || hit}` }); }
    else parts.push({ k: "Location", ok: false, text: `${(job.l || [])[0] || "Location"} isn't on your list` });
  }
  // sponsorship (10)
  max += 10;
  if (profile.needsSponsor) {
    if (job.sp === "yes") { score += 10; parts.push({ k: "Visa", ok: true, text: "Offers sponsorship" }); }
    else if (job.sp === "no" || job.sp === "citizen") parts.push({ k: "Visa", ok: false, text: job.sp === "citizen" ? "Requires U.S. citizenship" : "Doesn't sponsor visas" });
    else { score += 4; parts.push({ k: "Visa", ok: null, text: "Sponsorship not stated" }); }
  } else { score += 10; }
  // skills (20)
  max += 20;
  const exp = expectedSkills(job);
  const have = new Set(profile.skills || []);
  const matched = exp.filter((s) => have.has(s));
  const missing = exp.filter((s) => !have.has(s));
  if (!profile.skills?.length) { score += 8; parts.push({ k: "Skills", ok: null, text: "Add your resume to compare skills" }); }
  else if (!exp.length) { score += 12; parts.push({ k: "Skills", ok: null, text: "Title doesn't point to specific skills" }); }
  else {
    const r = matched.length / Math.min(exp.length, 4);
    score += Math.round(20 * Math.min(1, r));
    parts.push({ k: "Skills", ok: matched.length ? true : false, text: matched.length ? `You list ${matched.slice(0, 3).join(", ")}` : `Usually asks for ${exp.slice(0, 3).join(", ")}` });
  }
  return { score: Math.round((score / max) * 100), parts, matched, missing, expected: exp };
}

/* ===== Email parsing (rule-based; Claude upgrade lives in the paste modal) ===== */
const EMAIL_KINDS = {
  confirmation: { label: "Application received", stage: "applied" },
  interview: { label: "Interview invite", stage: "interview" },
  screen: { label: "Recruiter screen", stage: "screen" },
  rejection: { label: "Rejection", stage: "rejected" },
  offer: { label: "Offer", stage: "offer" },
  other: { label: "Update", stage: null },
};
function parseEmail(raw) {
  const text = (raw || "").replace(/\r/g, "");
  const low = text.toLowerCase();
  const hdr = (name) => { const m = text.match(new RegExp(`^${name}:\\s*(.+)$`, "im")); return m ? m[1].trim() : ""; };
  const from = hdr("From"), subject = hdr("Subject"), dateH = hdr("Date");
  let kind = "other";
  const has = (...ps) => ps.some((p) => low.includes(p));
  if (has("pleased to offer", "extend an offer", "offer letter", "excited to offer", "formal offer", "offer of employment")) kind = "offer";
  else if (has("unfortunately", "not to move forward", "not be moving forward", "decided to pursue other", "move forward with other", "regret to inform", "position has been filled", "not selected", "will not be proceeding", "other candidates whose", "decided not to proceed")) kind = "rejection";
  else if (has("phone screen", "recruiter call", "initial call", "quick chat", "intro call", "screening call")) kind = "screen";
  else if (has("interview", "schedule a time", "your availability", "calendly", "next round", "onsite", "superday", "technical assessment", "coding challenge", "hackerrank", "codesignal")) kind = "interview";
  else if (has("thank you for applying", "received your application", "application has been received", "we have received your", "thanks for applying", "application was submitted", "successfully submitted", "thank you for your application", "thank you for your interest")) kind = "confirmation";

  // company
  let company = "";
  const pats = [
    /thank you for (?:applying|your (?:application|interest)) (?:to|at|in|with) ([A-Z][\w&.'\- ]{1,40}?)(?:[.!,\n]| for | and )/,
    /(?:position|role|opportunity|job) (?:at|with) ([A-Z][\w&.'\- ]{1,40}?)(?:[.!,\n]| and )/,
    /(?:join|joining) (?:the )?([A-Z][\w&.'\- ]{1,40}?) (?:team|family)/,
    /interest in (?:joining )?([A-Z][\w&.'\- ]{1,40}?)(?:[.!,\n]| and )/,
    /^(?:the )?([A-Z][\w&.'\- ]{1,30}?) (?:Recruiting|Talent|Careers|Hiring) Team/m,
  ];
  for (const re of pats) { const m = text.match(re); if (m) { company = m[1].trim().replace(/^the /i, ""); break; } }
  if (!company && from) {
    const nm = from.match(/^"?([^"<@]+?)"?\s*</);
    const dom = from.match(/@([a-z0-9-]+)\./i);
    if (nm && !/no-?reply|notifications|recruit|talent|careers|hiring|workday|greenhouse|lever|ashby/i.test(nm[1])) company = nm[1].replace(/\s+(Recruiting|Careers|Talent).*$/i, "").trim();
    else if (dom && !/gmail|outlook|yahoo|greenhouse|lever|myworkday|workday|ashbyhq|icims|smartrecruiters|hire|jobvite|taleo/i.test(dom[1])) company = dom[1][0].toUpperCase() + dom[1].slice(1);
  }
  if (!company && subject) { const m = subject.match(/(?:at|from|with)\s+([A-Z][\w&.'\- ]{1,30})/); if (m) company = m[1].trim(); }
  if (/^(our|the|we|us|this)$/i.test(company)) company = "";

  // role
  let title = "";
  const tp = [
    /for (?:the )?(?:position of |role of )?["“]?([A-Z][\w&/,()+.'\- ]{2,70}?)["”]? (?:position|role|opening|internship)/,
    /(?:application|applying|interview|candidacy) for (?:the )?["“]?([A-Z][\w&/()+.'\- ]{2,70}?)["”]?(?: position| role| opening)?(?: at | with |[.!,\n(])/,
    /(?:position|role):\s*([^\n]{3,70})/i,
  ];
  for (const re of tp) { const m = text.match(re); if (m) { title = m[1].trim(); break; } }
  if (!title && subject) { const m = subject.match(/[-–:|]\s*([A-Z][^-–:|]{3,60}(?:Intern|Engineer|Analyst|Scientist|Developer|Manager|Designer|Associate)[^-–:|]*)/); if (m) title = m[1].trim(); }

  // date
  let at = dateH ? Date.parse(dateH) : NaN;
  if (isNaN(at)) at = now();

  // interview time
  let interviewAt = null;
  const dm = text.match(/(?:on\s+)?((?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+)?((?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+\d{1,2})(?:st|nd|rd|th)?(?:,?\s*(\d{4}))?(?:\s*(?:at|@|,)?\s*(\d{1,2}(?::\d{2})?\s*(?:am|pm)))?/i);
  if (dm && (kind === "interview" || kind === "screen")) {
    const yr = dm[3] || new Date().getFullYear();
    const t = Date.parse(`${dm[2]} ${yr} ${dm[4] ? dm[4].replace(/(am|pm)/i, " $1") : "10:00 am"}`);
    if (!isNaN(t)) interviewAt = t < now() - 30 * DAY ? Date.parse(`${dm[2]} ${+yr + 1} ${dm[4] || "10:00 am"}`) : t;
  }
  let roundType = null;
  if (kind === "screen") roundType = "recruiter";
  else if (kind === "interview") roundType = /technical|coding|hackerrank|codesignal|leetcode|system design/i.test(text) ? "technical" : /behavioral/i.test(text) ? "behavioral" : /case/i.test(text) ? "case" : /onsite|final|superday/i.test(text) ? "onsite" : "other";

  const next = { confirmation: "Wait for a reply. Follow up in a week if you hear nothing.", screen: "Reply with your availability and prep a 60-second intro.", interview: "Confirm the time and start prep for this round.", rejection: "Log it and move on. Ask for feedback if you had interviews.", offer: "Ask for the offer in writing and the decision deadline.", other: "Review and decide whether anything changed." }[kind];
  return { kind, company, title, at, interviewAt, roundType, next, confidence: (company ? 1 : 0) + (title ? 1 : 0) + (kind !== "other" ? 1 : 0) };
}

/* Fuzzy-match an email to an existing application */
function matchApp(company, title) {
  if (!company) return null;
  const c = norm(company);
  const cands = Object.values(store.get().apps).filter((a) => { const ac = norm(a.company); return ac && (ac === c || ac.includes(c) || c.includes(ac)); });
  if (!cands.length) return null;
  if (title) { const t = norm(title); const exact = cands.find((a) => norm(a.title) === t || norm(a.title).includes(t) || t.includes(norm(a.title))); if (exact) return exact; }
  return cands.sort((a, b) => b.lastActivityAt - a.lastActivityAt)[0];
}

/* ===== Nudges: what to do today ===== */
function computeTasks(s = store.get()) {
  const t = now();
  const out = [];
  const dis = s.dismissed || {};
  const skip = (key) => dis[key] && dis[key] > t;
  const apps = Apps.list(s);
  for (const a of apps) {
    for (const r of a.rounds || []) {
      if (!r.at) continue;
      const until = r.at - t;
      if (until > 0 && until < 3 * DAY) {
        const key = `prep:${a.id}:${r.id}`;
        if (!skip(key)) out.push({ key, kind: "prep", pri: until < DAY ? 0 : 1, app: a, round: r, icon: "cal", tone: "accent", title: `${ROUND[r.type]?.label || "Interview"} with ${a.company} ${fmt.until(r.at)}`, sub: `${fmt.dateTime(r.at)}${r.interviewers ? " · " + r.interviewers : ""}`, action: "Prep" });
      }
      if (until <= 0 && -until < 2 * DAY && !r.thanked && r.outcome === "pending") {
        const key = `thanks:${a.id}:${r.id}`;
        if (!skip(key)) out.push({ key, kind: "thanks", pri: 0, app: a, round: r, icon: "send", tone: "ok", title: `Send a thank-you note to ${a.company}`, sub: `Within 24 hours of your ${(ROUND[r.type]?.label || "interview").toLowerCase()}${r.interviewers ? " with " + r.interviewers : ""}`, action: "Draft note" });
      }
      if (until <= -DAY && r.outcome === "pending") {
        const key = `outcome:${a.id}:${r.id}`;
        if (!skip(key)) out.push({ key, kind: "outcome", pri: 2, app: a, round: r, icon: "flag", tone: "", title: `How did the ${a.company} ${(ROUND[r.type]?.label || "interview").toLowerCase()} go?`, sub: `It was ${fmt.ago(r.at)}. Log the outcome and a few notes while you remember.`, action: "Log outcome" });
      }
    }
    if (["applied", "screen", "interview"].includes(a.stage)) {
      const silent = Apps.daysSilent(a);
      const upcoming = (a.rounds || []).some((r) => r.at && r.at > t);
      if (!upcoming && silent >= s.settings.ghostDays) {
        const key = `ghost:${a.id}`;
        if (!skip(key)) out.push({ key, kind: "ghost", pri: 3, app: a, icon: "ghost", tone: "ghost", title: `No reply from ${a.company} in ${silent} days`, sub: "Most companies reply within 3 weeks if they're interested. Mark it as ghosted to keep your board honest.", action: "Mark ghosted" });
      } else if (!upcoming && a.stage === "applied" && silent >= s.settings.followUpDays && !a.followedUpAt) {
        const key = `follow:${a.id}`;
        if (!skip(key)) out.push({ key, kind: "follow", pri: 2, app: a, icon: "reply", tone: "wait", title: `Follow up with ${a.company}`, sub: `You applied ${silent} days ago and haven't heard back.`, action: "Draft follow-up" });
      }
    }
    if (a.stage === "saved") {
      const age = Math.floor((t - a.createdAt) / DAY);
      const job = a.jobId ? jobsStore.byId.get(a.jobId) : null;
      if (age >= 3) {
        const key = `apply:${a.id}`;
        if (!skip(key)) out.push({ key, kind: "apply", pri: 4, app: a, icon: "bolt", tone: "", title: `Apply to ${a.company}`, sub: `Saved ${age} days ago${job && job.g >= 50 ? " · this listing shows ghost-job signs" : ". Early applicants get more replies."}`, action: "Open" });
      }
    }
  }
  out.sort((x, y) => x.pri - y.pri);
  return out;
}
function dismissTask(key, days = 365) { store.set((s) => ({ ...s, dismissed: { ...s.dismissed, [key]: now() + days * DAY } })); }

/* ===== Personal stats ===== */
function computeStats(s = store.get(), apps = Apps.list(s)) {
  const applied = apps.filter((a) => a.stage !== "saved" && a.appliedAt);
  const replied = applied.filter((a) => a.lastReplyAt || ["screen", "interview", "offer", "rejected"].includes(a.stage));
  const interviewed = applied.filter((a) => ["interview", "offer"].includes(a.stage) || (a.rounds || []).length || a.events.some((e) => e.to === "interview"));
  const offers = applied.filter((a) => a.stage === "offer" || a.events.some((e) => e.to === "offer"));
  const replyDays = replied.map((a) => a.lastReplyAt && a.appliedAt ? (firstReplyAt(a) - a.appliedAt) / DAY : null).filter((x) => x != null && x >= 0);
  const median = (arr) => { if (!arr.length) return null; const v = [...arr].sort((a, b) => a - b); const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
  const weekStart = startOfWeek(now());
  const thisWeek = applied.filter((a) => a.appliedAt >= weekStart).length;
  const weeks = [];
  for (let i = 7; i >= 0; i--) { const ws = weekStart - i * 7 * DAY; weeks.push({ start: ws, applied: applied.filter((a) => a.appliedAt >= ws && a.appliedAt < ws + 7 * DAY).length, replies: replied.filter((a) => { const r = firstReplyAt(a); return r && r >= ws && r < ws + 7 * DAY; }).length }); }
  return {
    total: apps.length, applied: applied.length, replied: replied.length, interviewed: interviewed.length, offers: offers.length,
    ghosted: applied.filter((a) => a.stage === "ghosted").length, rejected: applied.filter((a) => a.stage === "rejected").length,
    responseRate: applied.length ? replied.length / applied.length : null,
    interviewRate: applied.length ? interviewed.length / applied.length : null,
    medianReplyDays: median(replyDays), thisWeek, weeks,
    active: apps.filter((a) => ACTIVE_STAGES.includes(a.stage)).length,
  };
}
function firstReplyAt(a) {
  const e = (a.events || []).find((e) => e.kind === "stage" && ["screen", "interview", "offer", "rejected"].includes(e.to));
  return e ? e.at : a.lastReplyAt;
}
function startOfWeek(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); const day = (d.getDay() + 6) % 7; return d.getTime() - day * DAY; }

/* ===== Global keyboard shortcuts ===== */
function useShortcuts() {
  useEffect(() => {
    let gPending = 0;
    const typing = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); ui.set({ palette: !ui.state.palette }); return; }
      if (typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
      if (ui.state.palette || ui.state.modal) return;
      const k = e.key;
      if (gPending && now() - gPending < 1200) {
        gPending = 0;
        const map = { t: "today", f: "find", p: "pipeline", c: "companies", i: "prep", s: "stats", ",": "prefs" };
        if (map[k.toLowerCase()]) { e.preventDefault(); closeDrawer(); go(map[k.toLowerCase()]); }
        return;
      }
      if (k === "g") { gPending = now(); return; }
      if (k === "?") { e.preventDefault(); openModal("shortcuts"); return; }
      if (ui.state.drawer?.kind === "app" && /^[1-7]$/.test(k)) { e.preventDefault(); Apps.move(ui.state.drawer.id, STAGES[+k - 1].id); return; }
      if (ui.state.drawer) return;
      if (k === "n") { e.preventDefault(); openModal("add"); }
      else if (k === "e") { e.preventDefault(); openModal("paste"); }
      else if (k === "/") { e.preventDefault(); go("find"); setTimeout(() => document.getElementById("find-q")?.focus(), 60); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
}

      <${BottomNav} route=${route} />
    </div>
    ${DrawerC && html`<${DrawerC} key=${u.drawer.kind + u.drawer.id} id=${u.drawer.id} tab=${u.drawer.tab} />`}
    ${ModalC && html`<${ModalC} ...${u.modal} />`}
    ${u.palette && html`<${Palette} />`}
    ${showOnboard && html`<${VIEWS.__onboarding} />`}
    <${Toasts} />
    <${Celebrate} />
  </div>`;
}

/* --- js/99-boot.js --- */
/* ===== Boot ===== */
(function boot() {
  applyTheme(store.get().settings.theme);
  render(html`<${App} />`, document.getElementById("app"));
  initCaps();
  loadJobs();
})();

</script>
