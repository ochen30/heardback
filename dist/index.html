/* --- js/views/stats.js --- */
/* ===== Insights: personal analytics, honest about sample sizes ===== */

const STATS_REPLY_STAGES = ["screen", "interview", "offer", "rejected"];
function stats_isReplied(a) { return !!a.lastReplyAt || STATS_REPLY_STAGES.includes(a.stage); }
function stats_reachedInterview(a) { return ["interview", "offer"].includes(a.stage) || (a.rounds || []).length > 0 || (a.events || []).some((e) => e.to === "interview"); }
function stats_days(d) { return d == null ? "—" : d < 10 && d % 1 ? d.toFixed(1) : String(Math.round(d)); }
function stats_niceScale(max) {
  if (max <= 4) return { step: 1, top: 4 };
  for (const step of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500]) if (max / step <= 5) return { step, top: Math.ceil(max / step) * step };
  return { step: max, top: max };
}

/* Deterministic, plain-language observations. Each one only appears when there is enough data behind it. */
function stats_observations(s, apps, st, jobsById) {
  const t = now();
  const applied = apps.filter((a) => a.stage !== "saved" && a.appliedAt);
  const ghostDays = s.settings.ghostDays || 21;
  const out = [];

  // 1. Silence after the ghost window
  const old = applied.filter((a) => t - a.appliedAt >= ghostDays * DAY);
  const silent = old.filter((a) => !stats_isReplied(a));
  if (old.length >= 3 && silent.length) {
    const most = silent.length / old.length > 0.5;
    out.push({ key: "silent", icon: "ghost", tone: "ghost",
      text: most ? `Most applications go silent: ${silent.length} of ${old.length} sent ${ghostDays}+ days ago never got a reply.` : `${silent.length} of ${old.length} applications sent ${ghostDays}+ days ago never got a reply.` });
  }

  // 2. Biggest drop-off between funnel steps (each step needs at least 3 at the start)
  const repliedApps = applied.filter(stats_isReplied);
  const positive = applied.filter((a) => ["screen", "interview", "offer"].includes(a.stage) || (a.events || []).some((e) => ["screen", "interview", "offer"].includes(e.to)));
  const interviewed = applied.filter(stats_reachedInterview);
  const decidedInterviews = interviewed.filter((a) => ["offer", "rejected", "ghosted"].includes(a.stage));
  const steps = [
    { label: "getting a first reply", n: applied.length, k: repliedApps.length },
    { label: "turning a reply into an interview", n: positive.length, k: positive.filter(stats_reachedInterview).length },
    { label: "turning interviews into an offer", n: decidedInterviews.length, k: decidedInterviews.filter((a) => a.stage === "offer").length },
  ].filter((x) => x.n >= 3);
  if (steps.length) {
    const worst = steps.reduce((a, b) => (b.k / b.n < a.k / a.n ? b : a));
    out.push({ key: "drop", icon: "filter", tone: "wait", text: `Biggest drop-off: ${worst.label} (${worst.k} of ${worst.n}).` });
  }

  // 3. Where rejections happen
  const rej = applied.filter((a) => a.stage === "rejected");
  if (rej.length >= 2) {
    const pre = rej.filter((a) => !stats_reachedInterview(a)).length;
    out.push({ key: "rej", icon: "x", tone: "bad",
      text: pre / rej.length >= 0.5
        ? `${pre} of ${rej.length} rejections came before any interview. Tailoring your resume to each listing matters most here.`
        : `${rej.length - pre} of ${rej.length} rejections came after an interview. Your round notes are the place to look for patterns.` });
  }

  // 4. Round outcomes by type
  const byType = {};
  for (const a of apps) for (const r of a.rounds || []) {
    if (r.outcome !== "passed" && r.outcome !== "failed") continue;
    const b = (byType[r.type] = byType[r.type] || { p: 0, f: 0 });
    b[r.outcome === "passed" ? "p" : "f"]++;
  }
  const typed = Object.entries(byType).map(([type, b]) => ({ type, ...b, d: b.p + b.f }));
  const decided = typed.reduce((x, y) => x + y.d, 0);
  const weak = typed.filter((x) => x.d >= 2 && x.f > 0).sort((x, y) => x.p / x.d - y.p / y.d)[0];
  if (weak) out.push({ key: "rounds", icon: "prep", tone: "accent", text: `${ROUND[weak.type]?.label || "These"} rounds are your toughest so far: you passed ${weak.p} of ${weak.d}.` });
  else if (decided >= 3) {
    const passed = typed.reduce((x, y) => x + y.p, 0);
    out.push({ key: "rounds", icon: "trophy", tone: "ok", text: `You've passed ${passed} of ${decided} interview rounds with a logged outcome.` });
  }

  // 5. Reply timing vs. who is still waiting
  if (st.medianReplyDays != null && st.replied >= 3) {
    const waiting = applied.filter((a) => a.stage === "applied" && !stats_isReplied(a) && (t - a.appliedAt) / DAY > st.medianReplyDays);
    out.push({ key: "timing", icon: "clock", tone: "",
      text: `Replies took a median of ${stats_days(st.medianReplyDays)} days.${waiting.length ? ` ${waiting.length === 1 ? "1 application is" : `${waiting.length} applications are`} past that with no reply, so a short follow-up is reasonable.` : ""}` });
  }

  // 6. Category response rates (needs applications linked to listings)
  const cats = {};
  for (const a of applied) {
    const j = a.jobId && jobsById.get(a.jobId);
    if (!j) continue;
    const c = (cats[j.cat] = cats[j.cat] || { n: 0, r: 0 });
    c.n++; if (stats_isReplied(a)) c.r++;
  }
  const cl = Object.entries(cats).filter(([, c]) => c.n >= 3).sort((x, y) => y[1].r / y[1].n - x[1].r / x[1].n);
  if (cl.length >= 2) {
    const [hi, lo] = [cl[0], cl[cl.length - 1]];
    if (hi[1].r / hi[1].n > lo[1].r / lo[1].n) out.push({ key: "cat", icon: "layers", tone: "info", text: `${hi[0]} roles reply more often: ${hi[1].r} of ${hi[1].n}, vs ${lo[1].r} of ${lo[1].n} for ${lo[0]}.` });
  }

  // 7. Applying early (needs linked listings with a posted date)
  const timed = applied.map((a) => ({ a, j: a.jobId && jobsById.get(a.jobId) })).filter((x) => x.j && x.j.p);
  const early = timed.filter((x) => x.a.appliedAt - x.j.p <= 3 * DAY), late = timed.filter((x) => x.a.appliedAt - x.j.p > 3 * DAY);
  if (early.length >= 3 && late.length >= 3) {
    const re = early.filter((x) => stats_isReplied(x.a)).length / early.length, rl = late.filter((x) => stats_isReplied(x.a)).length / late.length;
    if (Math.abs(re - rl) >= 0.1) out.push({ key: "early", icon: "bolt", tone: "accent", text: `Applying within 3 days of posting got replies ${fmt.pct(re)} of the time, vs ${fmt.pct(rl)} when you applied later.` });
  }
  return out;
}

function stats_WeeklyChart({ weeks }) {
  const ref = useRef(null);
  const [w, setW] = useState(640);
  const [hi, setHi] = useState(null);
  useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    setW(Math.max(260, Math.round(el.clientWidth)));
    if (typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver((es) => setW(Math.max(260, Math.round(es[0].contentRect.width))));
    ro.observe(el); return () => ro.disconnect();
  }, []);
  const H = w < 420 ? 224 : 284;
  const m = { l: w < 420 ? 52 : 60, r: 8, t: 22, b: 58 };
  const n = weeks.length;
  const max = Math.max(1, ...weeks.map((x) => x.applied));
  const { step, top } = stats_niceScale(max);
  const iw = w - m.l - m.r, ih = H - m.t - m.b;
  const band = iw / n, bw = Math.min(24, band * 0.5);
  const xc = (i) => m.l + band * (i + 0.5);
  const y = (v) => m.t + ih - (v / top) * ih;
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  const bar = (i, v) => {
    if (!v) return null;
    const x0 = xc(i) - bw / 2, x1 = x0 + bw, yb = y(0), yt = y(v), r = Math.min(4, yb - yt, bw / 2);
    return `M${x0},${yb}V${yt + r}Q${x0},${yt} ${x0 + r},${yt}H${x1 - r}Q${x1},${yt} ${x1},${yt + r}V${yb}Z`;
  };
  const every = band < 46 ? 2 : 1;
  const last = n - 1;
  const lbl = (x, i) => i === last ? (band < 60 ? "Now" : "This week") : fmt.date(x.start);
  const tip = hi != null ? weeks[hi] : null;
  const yx = y(0) + 18, yr = H - 10;
  return html`<div class="st-chart-inner" ref=${ref} style="position:relative">
    <svg class="chart st-chart" width=${w} height=${H} viewBox=${`0 0 ${w} ${H}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label="Applications and replies per week, last 8 weeks">
      ${ticks.map((v) => html`<g key=${"t" + v}>
        <line class=${v === 0 ? "base-line" : "grid-line"} x1=${m.l} x2=${w - m.r} y1=${y(v)} y2=${y(v)} />
        <text x=${m.l - 8} y=${y(v) + 4} text-anchor="end">${v}</text>
      </g>`)}
      ${hi != null && html`<rect class="st-band" x=${xc(hi) - band / 2 + 2} y=${m.t - 6} width=${band - 4} height=${H - m.t + 4} rx="4" />`}
      ${weeks.map((x, i) => html`<path key=${"b" + i} class="st-bar" d=${bar(i, x.applied)} />`)}
      ${weeks.map((x, i) => (i % every === (last % every) ? html`<text key=${"x" + i} class=${cx("st-xl", i === last && "now")} x=${xc(i)} y=${yx} text-anchor="middle">${lbl(x, i)}</text>` : null))}
      ${weeks[last].applied > 0 && html`<text class="st-val" x=${xc(last)} y=${y(weeks[last].applied) - 8} text-anchor="middle">${weeks[last].applied}</text>`}
      <line class="grid-line" x1=${0} x2=${w - m.r} y1=${yr - 18} y2=${yr - 18} />
      <text class="st-row-label" x=${0} y=${yr}>Replies</text>
      ${weeks.map((x, i) => html`<text key=${"r" + i} class=${cx("st-reply", x.replies > 0 && "on")} x=${xc(i)} y=${yr} text-anchor="middle">${x.replies}</text>`)}
      ${weeks.map((x, i) => html`<rect key=${"h" + i} class="st-hit" x=${xc(i) - band / 2} y=${m.t - 6} width=${band} height=${H - m.t + 4} tabindex="0"
        aria-label=${`Week of ${fmt.date(x.start)}: ${pluralize(x.applied, "application")}, ${pluralize(x.replies, "reply", "replies")}`}
        onMouseEnter=${() => setHi(i)} onMouseLeave=${() => setHi(null)} onFocus=${() => setHi(i)} onBlur=${() => setHi(null)}>
        <title>${`Week of ${fmt.date(x.start)}: ${x.applied} applied, ${x.replies} ${x.replies === 1 ? "reply" : "replies"}`}</title>
      </rect>`)}
    </svg>
    ${tip && html`<div class="st-tip" style=${`left:${clamp(xc(hi), 70, w - 70)}px;top:${y(tip.applied) - 12}px`}>
      <span>${hi === last ? "This week" : "Week of " + fmt.date(tip.start)}</span>
      <span class="st-tip-row"><b>${tip.applied}</b> applied · <b>${tip.replies}</b> ${tip.replies === 1 ? "reply" : "replies"}</span>
    </div>`}
    <table class="sr"><caption>Applications and replies per week</caption><thead><tr><th>Week of</th><th>Applied</th><th>Replies</th></tr></thead>
      <tbody>${weeks.map((x) => html`<tr key=${x.start}><td>${fmt.date(x.start)}</td><td>${x.applied}</td><td>${x.replies}</td></tr>`)}</tbody></table>
  </div>`;
}

  return html`<section class="card stats-row st-kpis" aria-label="Key numbers">
    <div class="stat"><span class="stat-label">Applications</span><span class="stat-value">${st.total}</span><span class="stat-sub num">${st.applied} sent · ${saved} saved · ${st.thisWeek} this week</span></div>

    <div class="stat"><span class="stat-label">Interview rate</span><span class="stat-value">${fmt.pct(st.interviewRate)}</span><span class="stat-sub num">${st.interviewed} of ${st.applied} reached interviews</span></div>

  </section>`;
}

function stats_Radar({ apps, jobs }) {
  const linked = apps.filter((a) => a.jobId);
  const ready = jobs.status === "ready";
  const flagged = ready ? linked.map((a) => ({ a, j: jobs.byId.get(a.jobId) })).filter((x) => x.j && x.j.g >= 50).sort((x, y) => y.j.g - x.j.g) : [];
  let body;
  if (!linked.length) body = html`<div class="td-mini-empty"><${Icon} name="ghost" cls="faint" /><span class="muted td-small td-grow">No applications are linked to a listing yet. Roles you track from Find are checked for ghost-job signals.</span><${Btn} size="sm" onClick=${() => go("find")}>Find jobs</${Btn}></div>`;
  else if (jobs.status === "error") body = html`<div class="td-mini-empty"><span class="muted td-small td-grow">Listings didn't load, so ghost signals can't be checked right now.</span><${Btn} size="sm" icon="refresh" onClick=${() => loadJobs()}>Try again</${Btn}></div>`;
  else if (!ready) body = html`<${Skeleton} rows=${2} />`;
  else if (!flagged.length) body = html`<div class="td-mini-empty"><span class="task-ico ok"><${Icon} name="shield" /></span><span class="muted td-small td-grow">All ${pluralize(linked.length, "linked listing")} look active.</span></div>`;
  else body = html`<div class="st-radar-big"><span class="td-big">${flagged.length}</span><span class="muted td-small">of ${pluralize(linked.length, "linked application")} show strong ghost-job signals</span></div>
    <div class="list">${flagged.map(({ a, j }) => html`<button type="button" class="st-radar-row" key=${a.id} onClick=${() => openApp(a.id)}>
      <${Logo} name=${a.company} />
      <span class="stack-sm" style="gap:1px;min-width:0"><span class="st-radar-title truncate">${a.company} · ${a.title}</span><span class="st-radar-sub truncate">${(j.gr || [])[0] || ghostLabel(j.g)}</span></span>
      <${GhostScore} g=${j.g} compact=${true} />
    </button>`)}</div>`;
  return html`<section class="card" aria-labelledby="st-radar-h">
    <div class="card-head"><h2 id="st-radar-h">Ghost-job radar</h2>${flagged.length ? html`<span class="td-count num">${flagged.length}</span>` : null}</div>
    ${body}
  </section>`;
}

function stats_Method({ ghostDays, ex }) {

/* --- js/views/today.js --- */
/* ===== Today: the home screen ===== */

function today_greeting(h = new Date().getHours()) {
  if (h < 5) return "Good evening";
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}
function today_firstName(name) { return (name || "").trim().split(/\s+/)[0] || ""; }
function today_dayLabel(ts) {
  const diff = Math.round((fmt.startOfDay(ts) - fmt.startOfDay(now())) / DAY);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return fmt.date(ts, { weekday: "short", month: "short", day: "numeric" });
}
function today_setPrepFocus(focus) { store.set((s) => ({ ...s, ui: { ...s.ui, prepFocus: focus } })); }
function today_undismiss(key, prev) {
  store.set((s) => { const d = { ...s.dismissed }; if (prev) d[key] = prev; else delete d[key]; return { ...s, dismissed: d }; });
}

/* Rounds in the next 7 days (anything starting less than an hour ago still counts as upcoming). */
function today_upcoming(apps) {
  const t = now(), end = fmt.startOfDay(t) + 7 * DAY;
  const items = [];
  for (const a of apps) for (const r of a.rounds || []) {
    if (r.at && r.at >= t - 3600000 && r.at < end && r.outcome !== "cancelled") items.push({ a, r });
  }
  items.sort((x, y) => x.r.at - y.r.at);
  const groups = [];
  for (const it of items) {
    const k = fmt.startOfDay(it.r.at);
    let g = groups[groups.length - 1];
    if (!g || g.day !== k) { g = { day: k, label: today_dayLabel(it.r.at), items: [] }; groups.push(g); }
    g.items.push(it);
  }
  return { items, groups };
}

/* Run a task's primary action. */
function today_runTask(tk) {
  const a = tk.app;
  if (tk.kind === "prep") { today_setPrepFocus({ appId: a.id, roundId: tk.round.id }); go("prep"); }
  else if (tk.kind === "thanks" || tk.kind === "follow") {
    const props = tk.kind === "thanks" ? { appId: a.id, roundId: tk.round.id, kind: "thanks" } : { appId: a.id, kind: "follow" };
    if (MODALS.draft) openModal("draft", props);
    else {
      const prof = store.get().profile;
      copyText(tk.kind === "thanks" ? thankYouTemplate(a, tk.round, prof) : followUpTemplate(a, prof), "Draft copied to your clipboard");
    }
  }
  else if (tk.kind === "ghost") Apps.move(a.id, "ghosted");
  else if (tk.kind === "outcome") openApp(a.id, "rounds");

/* Small anchored menu (snooze). Fixed-position so it escapes card overflow; closes on outside click, Esc, scroll. */
function today_Menu({ anchor, items, onClose, label }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    const r = anchor.getBoundingClientRect();
    const mw = ref.current ? ref.current.offsetWidth : 200, mh = ref.current ? ref.current.offsetHeight : 140;
    let left = r.right - mw; left = clamp(left, 8, window.innerWidth - mw - 8);
    let top = r.bottom + 4; if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    setPos({ left, top });
    setTimeout(() => ref.current?.querySelector("button")?.focus(), 10);
  }, [anchor]);
  useEffect(() => {
    const down = (e) => { if (!ref.current?.contains(e.target) && !anchor.contains(e.target)) onClose(); };
    const key = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); onClose(); anchor.focus(); }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const bs = [...ref.current.querySelectorAll("button")]; const i = bs.indexOf(document.activeElement);
        bs[(i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length]?.focus();
      }
    };
    const scroll = () => onClose();
    document.addEventListener("mousedown", down, true);
    window.addEventListener("keydown", key, true);
    document.getElementById("workspace")?.addEventListener("scroll", scroll, { passive: true });
    window.addEventListener("resize", scroll);
    return () => {
      document.removeEventListener("mousedown", down, true); window.removeEventListener("keydown", key, true);
      document.getElementById("workspace")?.removeEventListener("scroll", scroll); window.removeEventListener("resize", scroll);
    };
  }, [anchor, onClose]);
  return html`<div class="menu td-menu" role="menu" aria-label=${label} ref=${ref} style=${pos ? `left:${pos.left}px;top:${pos.top}px` : "visibility:hidden;left:0;top:0"}>
    ${items.map((it) => it.sep ? html`<div class="td-menu-sep" key=${it.key} role="separator"></div>` : html`<button type="button" role="menuitem" class=${it.cls} key=${it.key} onClick=${() => { onClose(); it.run(); }}>
      ${it.icon && html`<${Icon} name=${it.icon} />`}<span style="flex:1">${it.label}</span>${it.hint && html`<span class="faint td-menu-hint">${it.hint}</span>`}
    </button>`)}
  </div>`;
}

function today_matches(jobs, profile, apps) {
  if (jobs.status !== "ready") return null;
  const tracked = new Set(Object.values(apps).map((a) => a.jobId).filter(Boolean));
  const cut = now() - 3 * DAY;
  const recent = [], older = [], seen = new Set();
  for (const j of jobs.jobs) {
    if (j.g >= 50 || tracked.has(j.id)) continue;
    const dk = j.co + "|" + norm(j.t);
    if (seen.has(dk)) continue;
    const f = fitScore(j, profile);
    if (!f) return { list: [], recentCount: 0, noProfile: true };
    if (f.score < 60) continue;
    seen.add(dk);
    if (j.p >= cut) recent.push({ j, f });
    else { if (recent.length >= 6) break; older.push({ j, f }); if (older.length >= 6) break; }
  }
  // Strongest fits first among the fresh ones, newest first within each band.
  const band = (f) => (f.score >= 80 ? 0 : f.score >= 70 ? 1 : 2);
  const fresh = recent.slice().sort((x, y) => band(x.f) - band(y.f) || y.j.p - x.j.p);
  return { list: fresh.concat(older).slice(0, 6), recentCount: recent.length, noProfile: false };
}

/* --- js/views/zz-calendar.js --- */
/* ===== Add an interview round to the calendar =====
   1) Viewer has the Google Calendar connector on claude.ai -> create the event directly (they approve the first call).
   2) Otherwise -> an .ics file they can open in any calendar app. */
const CAL_SERVER = "Google Calendar";
const CAL_MIN = 45;
function cal_localISO(ts) { const d = new Date(ts); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`; }
function cal_utcStamp(ts) { return new Date(ts).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
function cal_text(app, round) {
  const type = ROUND[round.type]?.label || "Interview";
  const summary = `${type}: ${app.company}${app.title ? " · " + app.title : ""}`;
  const lines = [`${type} for ${app.title || "the role"} at ${app.company}.`];
  if (round.interviewers) lines.push(`With: ${round.interviewers}`);
  if (round.prep) lines.push(`Prep notes: ${round.prep}`);
  if (app.url) lines.push(`Posting: ${app.url}`);
  lines.push("Added from Heardback.");
  return { summary, description: lines.join("\n") };
}
function cal_ics(app, round) {
  const { summary, description } = cal_text(app, round);
  const esc = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Heardback//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${round.id}@heardback`, `DTSTAMP:${cal_utcStamp(now())}`, `DTSTART:${cal_utcStamp(round.at)}`, `DTEND:${cal_utcStamp(round.at + CAL_MIN * 60000)}`,
    `SUMMARY:${esc(summary)}`, `DESCRIPTION:${esc(description)}`,
    "BEGIN:VALARM", "TRIGGER:-PT30M", "ACTION:DISPLAY", "DESCRIPTION:Interview in 30 minutes", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}
async function addToCalendar(appId, roundId) {
  const app = Apps.get(appId); const round = app?.rounds.find((r) => r.id === roundId);
  if (!app || !round) return;
  if (!round.at) { toast("Set a date and time for this round first."); return; }
  if (caps.mcp) {
    const { summary, description } = cal_text(app, round);
    try {
      await caps.mcp.callTool(CAL_SERVER, "create_event", { summary, description, startTime: cal_localISO(round.at), endTime: cal_localISO(round.at + CAL_MIN * 60000) });
      Apps.updateRound(appId, roundId, { calendar: "google" });
      toast("Added to Google Calendar");
      return;
    } catch (e) {
      const fallthrough = ["server_not_connected", "not_in_manifest", "not_granted", "capability_disabled", "capability_removed", "selection_required", "blocked_by_policy", "consent_required"];
      if (e?.code === "needs_reauth") { toast("Reconnect Google Calendar in claude.ai Settings → Connectors, then try again."); return; }

      if (!fallthrough.includes(e?.code)) { toast("Google Calendar didn't respond. Downloading a calendar file instead."); }
    }
  }
  const ok = await saveFile(`${app.company.replace(/[^\w]+/g, "-").toLowerCase()}-${round.type}.ics`, cal_ics(app, round), "text/calendar");
  if (ok) Apps.updateRound(appId, roundId, { calendar: "ics" });
}

/* ===== "How we score listings": the ghost-signal methodology, with live numbers ===== */
const METHOD_SIGNALS = [
  { k: "Age", pts: "10 at 30 days · 25 at 60 · 40 at 90 · 55 at 150+", why: "Days since the listing was first seen. Most real openings fill or close within a few weeks." },
  { k: "Closed and reposted", pts: "10 for 1 earlier cycle · 20 for 2–3 · 30 for 4+", why: "The company posted the same title before, closed it, and posted it again. Several identical openings live at the same time is usually volume hiring, so that alone adds nothing." },
  { k: "Location blast", pts: "10 for 8+ cities · 20 for 15+", why: "The same role listed in many cities at once. Remote eligibility and state lists don't count." },
  { k: "Talent-pool title", pts: "35", why: "Titles like “talent community”, “general application” or “future opportunities” usually mean there's no specific opening." },
  { k: "Slow for this company", pts: "15", why: "The company usually closes listings within three weeks, and this one is more than three times older than that." },
];
MODALS.method = () => {
  const jobs = useJobs();
  const b = useMemo(() => {
    if (jobs.status !== "ready") return null;
    const c = [0, 0, 0, 0];
    for (const j of jobs.jobs) c[j.g >= 50 ? 3 : j.g >= 25 ? 2 : j.g > 0 ? 1 : 0]++;
    return { c, n: jobs.jobs.length };
  }, [jobs.status]);
  const rows = b ? [["No signals", b.c[0], "var(--ok)"], ["A minor signal", b.c[1], "var(--fg-3)"], ["Some signals", b.c[2], "var(--wait)"], ["Strong signals", b.c[3], "var(--bad)"]] : [];
  return html`<${Modal} title="How we score listings" size="lg" onClose=${closeModal}>
    <p class="muted" style="font-size:var(--fs-sm);max-width:68ch">Every listing gets a ghost-signal score from 0 to 100, built only from things we can see in the listing data. We show the reasons on each listing and never call a listing fake. A high score means "check before you invest hours", not "don't apply".</p>
    ${b && html`<div class="stack-sm">
      <span class="label">Across ${fmt.num(b.n)} live listings right now</span>
      <div class="meth-bar" role="img" aria-label=${rows.map(([l, n]) => `${l}: ${n}`).join(", ")}>${rows.map(([l, n, col]) => html`<i key=${l} style=${`flex:${n};background:${col}`} title=${`${l}: ${fmt.num(n)}`}></i>`)}</div>
      <div class="meth-legend">${rows.map(([l, n, col]) => html`<span key=${l}><i style=${`background:${col}`}></i>${l} <b class="num">${fmt.pct(n / b.n)}</b></span>`)}</div>
    </div>`}
    <div class="table-wrap card"><table class="table meth-table"><thead><tr><th>Signal</th><th>Points</th><th>Why it matters</th></tr></thead><tbody>
      ${METHOD_SIGNALS.map((s) => html`<tr key=${s.k} style="cursor:default"><td style="font-weight:500;white-space:nowrap">${s.k}</td><td class="num" style="min-width:150px">${s.pts}</td><td class="muted">${s.why}</td></tr>`)}
    </tbody></table></div>
    <p class="hint">Scores add up and cap at 100. Labels: under 25 "Looks active", 25–49 "Some ghost signals", 50+ "Strong ghost signals".</p>
    <div class="stack-sm">
      <span class="label">Limits we know about</span>
      <ul style="margin:0;padding-left:18px;color:var(--fg-2);font-size:var(--fs-sm);display:flex;flex-direction:column;gap:4px">
        <li>Dates are when the source list first saw a listing (from Mar 9, 2026), which can be later than the employer's own date.</li>
        <li>Reposts are matched by company and title, not by requisition number, so a big employer reusing one title can look like it reposts.</li>
        <li>Company timing uses closed listings only, so "usually closes in" leans short.</li>
      </ul>
    </div>
    <p class="hint">Data: SimplifyJobs community listings on GitHub${jobs.meta?.generatedAt ? `, refreshed ${fmt.ago(Date.parse(jobs.meta.generatedAt))}` : ""}. Every listing links to the employer's own application page.</p>
  </${Modal}>`;
};

/* --- js/views/zz-pdf.js --- */
/* ===== Read a resume file locally (PDF, TXT, MD). Nothing leaves the browser. =====
   pdf.js loads only when someone picks a PDF. Its worker script is loaded as a plain script
   (allowed by the page's CSP), so pdf.js runs it on the main thread. */
const PDFJS_BASE = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
let pdf_loading = null;
function pdf_loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.appendChild(s); });
}
function pdf_lib() {
  if (window.pdfjsLib && window.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  if (!pdf_loading) pdf_loading = pdf_loadScript(PDFJS_BASE + "pdf.min.js")
    .then(() => pdf_loadScript(PDFJS_BASE + "pdf.worker.min.js"))
    .then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js"; return window.pdfjsLib; })
    .catch((e) => { pdf_loading = null; throw e; });
  return pdf_loading;
}
async function pdf_text(file) {
  const lib = await pdf_lib();
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await lib.getDocument({ data, isEvalSupported: false, disableFontFace: true }).promise;
  const pages = [];
  for (let i = 1; i <= Math.min(doc.numPages, 8); i++) {
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    // Rebuild lines from text items using their vertical position.
    const lines = []; let lastY = null, cur = "";
    for (const it of tc.items) {
      const y = Math.round(it.transform[5]);
      if (lastY !== null && Math.abs(y - lastY) > 2) { if (cur.trim()) lines.push(cur.trim()); cur = ""; }
      cur += (cur && !cur.endsWith(" ") && !it.str.startsWith(" ") ? " " : "") + it.str;
      lastY = y;
    }
    if (cur.trim()) lines.push(cur.trim());
    pages.push(lines.join("\n"));
  }
  try { doc.destroy(); } catch {}
  return pages.join("\n\n").replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
}
/* Returns {text} or throws {message} with plain copy. */
async function readResumeFile(file) {
  if (!file) throw { message: "No file selected." };
  if (file.size > 10 * 1024 * 1024) throw { message: "That file is over 10 MB. Try a smaller PDF or paste the text." };
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".pdf") || file.type === "application/pdf") {
    let text;
    try { text = await pdf_text(file); }
    catch (e) { throw { message: "Couldn't read that PDF here. Paste the text instead." }; }
    if (text.length < 40) throw { message: "That PDF looks like a scanned image with no text. Paste the text instead." };
    return { text };
  }
  if (/\.(txt|md|markdown|text)$/.test(name) || /^text\//.test(file.type)) return { text: (await file.text()).trim() };
  throw { message: "Use a PDF, .txt or .md file, or paste the text. Word files: save as PDF first." };
}

/* --- js/views/zz-pool.js --- */
/* ===== Pooled reply data ("who actually replies") =====
   Storage: shared db, one document per contributor at pool/<viewer id> (rules: everyone reads, each writes only their own).
   Contents are coarse and anonymous: company, role category, level, week applied, furthest stage, outcome, days to first reply.
   No names, emails, titles, notes or resume text ever leave the browser. */
const POOL_MIN_APPS = 5, POOL_MIN_PEOPLE = 3;
const pool = { status: "idle", byCompany: {}, people: 0, apps: 0, canWrite: null, myId: null, lastShared: null, error: null };
const poolSubs = new Set();
function usePool() { const [v, setV] = useState({ ...pool }); useEffect(() => { const f = () => setV({ ...pool }); poolSubs.add(f); f(); return () => poolSubs.delete(f); }, []); return v; }
const poolEmit = () => poolSubs.forEach((f) => f());

function poolWeek(ts) { const d = new Date(ts); const y = d.getUTCFullYear(); const start = Date.UTC(y, 0, 1); return `${y}-W${String(Math.ceil(((ts - start) / DAY + 1) / 7)).padStart(2, "0")}`; }
function poolEntries(s = store.get()) {
  return Object.values(s.apps)
    .filter((a) => !a.example && a.appliedAt && a.stage !== "saved" && a.company)
    .map((a) => {
      const job = a.jobId ? jobsStore.byId.get(a.jobId) : null;
      const fr = firstReplyAt(a);
      const furthest = (a.events || []).reduce((m, e) => (e.to && STAGE[e.to] && STAGE[e.to].i > m && !["rejected", "ghosted"].includes(e.to) ? STAGE[e.to].i : m), STAGE.applied.i);
      return {
        co: a.company.trim().slice(0, 80), cat: job?.cat || "", lvl: job?.lvl || "", wk: poolWeek(a.appliedAt),
        reached: STAGES[Math.max(furthest, ["screen", "interview", "offer"].includes(a.stage) ? STAGE[a.stage].i : 0)].id,
        out: ["offer", "rejected", "ghosted"].includes(a.stage) ? a.stage : "open",
        rd: fr && fr > a.appliedAt ? Math.round((fr - a.appliedAt) / DAY) : null,
      };
    }).slice(0, 400);
}

async function poolLoad() {
  if (!caps.db) { pool.status = "unavailable"; poolEmit(); return; }
  pool.status = "loading"; poolEmit();
  try {
    if (caps.user) {
      try { pool.myId = await caps.user.id(); } catch {}
      try { const w = await caps.user.can("data.write"); pool.canWrite = w; } catch { pool.canWrite = null; }
    }
    const snap = await caps.db.collection("pool").limit(1000).get();
    const by = {}; let people = 0, apps = 0;
    for (const d of snap.docs) {
      const body = d.data(); if (!body || !Array.isArray(body.entries)) continue;
      people++;
      const seenCo = new Set();
      for (const e of body.entries) {
        if (!e || typeof e.co !== "string") continue;
        apps++;
        const k = norm(e.co);
        const c = by[k] || (by[k] = { name: e.co, n: 0, people: 0, replied: 0, ghosted: 0, rejected: 0, offers: 0, interviews: 0, rds: [] });
        c.n++;
        if (!seenCo.has(k)) { c.people++; seenCo.add(k); }
        if (e.rd != null || ["screen", "interview", "offer"].includes(e.reached) || e.out === "rejected") c.replied++;
        if (e.out === "ghosted") c.ghosted++;
        if (e.out === "rejected") c.rejected++;
        if (e.out === "offer") c.offers++;
        if (["interview", "offer"].includes(e.reached)) c.interviews++;
        if (typeof e.rd === "number" && e.rd >= 0 && e.rd < 365) c.rds.push(e.rd);
      }
      if (d.id === pool.myId) pool.lastShared = body.updatedAt || null;
    }
    Object.assign(pool, { status: "ready", byCompany: by, people, apps, error: null });
  } catch (e) {
    pool.status = "error"; pool.error = e?.code || "unavailable";
  }
  poolEmit();
}
function poolFor(company) {
  const c = pool.byCompany[norm(company || "")];
  if (!c) return null;
  const v = [...c.rds].sort((a, b) => a - b);
  const med = v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null;
  return { ...c, enough: c.n >= POOL_MIN_APPS && c.people >= POOL_MIN_PEOPLE, replyRate: c.n ? c.replied / c.n : null, ghostRate: c.n ? c.ghosted / c.n : null, interviewRate: c.n ? c.interviews / c.n : null, medReply: med };
}
async function poolShare() {
  if (!caps.db || !pool.myId) { toast("Sharing needs a signed-in claude.ai account with access to this page."); return false; }
  const entries = poolEntries();
  try {
    await caps.db.doc(`pool/${pool.myId}`).set({ v: 1, updatedAt: now(), entries });
    store.set((s) => ({ ...s, settings: { ...s.settings, shareAnon: true, lastShared: now() } }));
    toast(`Shared ${pluralize(entries.length, "application")} anonymously. Thank you.`);
    poolLoad();
    return true;
  } catch (e) {
    if (e?.code === "invalid_argument") { pool.canWrite = false; poolEmit(); toast("This page is view-only for your account, so it can't save shared data."); }
    else if (e?.code === "quota_exceeded") toast("The shared data store is full right now. Your data is still safe in this browser.");
    else toast("Couldn't share right now. Try again in a minute.");
    return false;
  }
}
async function poolUnshare() {
  if (!caps.db || !pool.myId) return;
  try { await caps.db.doc(`pool/${pool.myId}`).delete(); store.set((s) => ({ ...s, settings: { ...s.settings, shareAnon: false, lastShared: null } })); toast("Removed your shared data"); poolLoad(); }
  catch { toast("Couldn't remove it right now. Try again in a minute."); }
}
/* Keep a contributor's pooled copy fresh: re-share at most every 6 hours while sharing is on. */
let poolAutoTimer = null;
store.sub((s) => {
  if (!s.settings.shareAnon || !caps.db || !pool.myId || pool.canWrite === false) return;
  if (s.settings.lastShared && now() - s.settings.lastShared < 6 * 3600000) return;
  clearTimeout(poolAutoTimer); poolAutoTimer = setTimeout(() => poolShare(), 4000);
});
capSubs.add(() => { if (caps.ready && pool.status === "idle") poolLoad(); });

MODALS.pool = () => {

  return html`<${Modal} title="Share your outcomes anonymously" onClose=${closeModal} foot=${html`

    <p class="muted" style="font-size:var(--fs-sm)">Help other job seekers see which companies actually reply. Heardback pools outcomes and only shows a company's numbers once ${POOL_MIN_PEOPLE} or more people have shared.</p>

      ${entries.slice(0, 50).map((e, i) => html`<tr key=${i} style="cursor:default"><td>${e.co}</td><td class="num">${e.wk}</td><td>${STAGE[e.reached]?.label}</td><td>${e.out === "open" ? "In progress" : STAGE[e.out]?.label}</td><td class="num">${e.rd == null ? "—" : e.rd + "d"}</td></tr>`)}
    </tbody></table></div></div>` : html`<p class="hint">You have no real applications to share yet. Example applications are never shared.</p>`}
