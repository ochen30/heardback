        ${a.followedUpAt && html`<span class="pl-kv-k">Followed up</span><span class="pl-kv-v num">${fmt.dateY(a.followedUpAt)}</span>`}
      </div>
    </section>

    ${job && html`<section class="stack">
      <h3 class="section-title">Posting</h3>
      <div class="pl-job card">
        <div class="stack-sm" style="flex:1;min-width:0">
          <span class="truncate" style="font-weight:500">${job.t}</span>
          <span class="row wrap pl-small muted"><${GhostScore} g=${job.g} /><span class="pl-sep">·</span><span>Posted ${fmt.ago(job.p)}</span></span>
        </div>
        <${Btn} size="sm" iconRight="chevR" onClick=${() => openJob(job.id)}>View listing</${Btn}>
      </div>
    </section>`}

    <${PlContacts} a=${a} />
  </div>`;
}

function plPrep(a, r) {
  store.set((s) => ({ ...s, ui: { ...s.ui, prepFocus: { appId: a.id, roundId: r?.id || null } } }));
  closeDrawer(); go("prep");
}

function PlContacts({ a }) {
  const [f, setF] = useState({ name: "", role: "", email: "" });
  const [err, setErr] = useState("");
  const add = (e) => {
    e?.preventDefault();
    if (!f.name.trim()) { setErr("Add a name first."); document.getElementById("pl-c-name")?.focus(); return; }
    Apps.update(a.id, (x) => ({ contacts: [...(x.contacts || []), { name: f.name.trim(), role: f.role.trim(), email: f.email.trim() }] }));
    setF({ name: "", role: "", email: "" }); setErr("");
    document.getElementById("pl-c-name")?.focus();
  };
  const rm = (i) => { const c = a.contacts[i]; Apps.update(a.id, (x) => ({ contacts: x.contacts.filter((_, j) => j !== i) })); toast(`Removed ${c.name}`, { undo: () => Apps.update(a.id, (x) => { const n = [...x.contacts]; n.splice(i, 0, c); return { contacts: n }; }) }); };
  const contacts = a.contacts || [];
  return html`<section class="stack">
    <h3 class="section-title">Contacts <span class="count">${contacts.length || ""}</span></h3>
    ${contacts.length ? html`<div class="list pl-contacts">${contacts.map((c, i) => html`<div class="pl-contact" key=${c.name + i}>
      <span class="pl-avatar" aria-hidden="true">${initials(c.name)}</span>
      <div class="stack-sm" style="gap:0;flex:1;min-width:0"><span class="truncate" style="font-weight:500">${c.name}</span><span class="truncate muted pl-small">${[c.role, c.email].filter(Boolean).join(" · ") || "No role or email"}</span></div>
      ${c.email && html`<${Btn} kind="ghost" size="sm" icon="copy" aria-label=${`Copy ${c.name}'s email`} title="Copy email" onClick=${() => copyText(c.email, "Email copied")} />`}
      <${Btn} kind="ghost" size="sm" icon="x" aria-label=${`Remove ${c.name}`} title="Remove" onClick=${() => rm(i)} />
    </div>`)}</div>` : html`<p class="muted pl-small">Recruiters and interviewers you talk to. Heardback uses the first name here in follow-up drafts.</p>`}
    <form class="pl-contact-form" onSubmit=${add}>
      <input id="pl-c-name" class="input" placeholder="Name" aria-label="Contact name" value=${f.name} onInput=${(e) => { setF({ ...f, name: e.currentTarget.value }); setErr(""); }} aria-invalid=${err ? "true" : undefined} />
      <input id="pl-c-role" class="input" placeholder="Role (e.g. Recruiter)" aria-label="Contact role" value=${f.role} onInput=${(e) => setF({ ...f, role: e.currentTarget.value })} />
      <input id="pl-c-email" class="input" type="email" placeholder="Email" aria-label="Contact email" value=${f.email} onInput=${(e) => setF({ ...f, email: e.currentTarget.value })} />
      <button type="submit" class="btn"><${Icon} name="plus" />Add</button>
    </form>
    ${err && html`<span class="pl-err" role="alert">${err}</span>`}
  </section>`;
}

/* Rounds */

    <${Field} label="Interviewers" id=${pid + "-who"}><${PlText} id=${pid + "-who"} value=${r.interviewers} placeholder="Names and roles, e.g. Priya S. (Eng manager)" onSave=${(v) => upd({ interviewers: v })} /></${Field}>
    <div class="pl-round-grid">

      <${Field} label="How it went" id=${pid + "-refl"}><${PlText} multiline id=${pid + "-refl"} rows="3" value=${r.reflection} placeholder="What they asked, what went well, what to improve" onSave=${(v) => upd({ reflection: v })} /></${Field}>
    </div>

      <${Btn} size="sm" icon="send" onClick=${() => openModal("draft", { appId: a.id, roundId: r.id, mode: "thanks" })}>Draft thank-you</${Btn}>

/* ---------- Draft modal (follow-up / thank-you) ----------
   openModal(kind, props) spreads props over {kind}, so a `kind` prop replaces the modal kind.
   Supported: openModal("draft", {appId, roundId, mode: "follow"|"thanks"}) and, for callers that pass
   {kind: "thanks"|"follow"}, the aliases MODALS.thanks / MODALS.follow below. */
MODALS.draft = (p) => html`<${PlDraft} ...${p} kind=${(p.mode || p.kind) === "thanks" ? "thanks" : "follow"} />`;
MODALS.thanks = (p) => html`<${PlDraft} ...${p} kind="thanks" />`;
MODALS.follow = (p) => html`<${PlDraft} ...${p} kind="follow" />`;
function PlDraft({ appId, roundId, kind = "follow" }) {
  const a = Apps.get(appId);
  const profile = useStore((s) => s.profile);
  const c = useCaps();
  const r = a && roundId ? (a.rounds || []).find((x) => x.id === roundId) : null;
  const thanks = kind === "thanks";
  const tpl = a ? (thanks ? thankYouTemplate(a, r ? { ...r, interviewers: plFirstName(r.interviewers), reflection: "" } : r, profile) : followUpTemplate(a, profile)) : "";
  const [text, setText] = useState(tpl);
  const [busy, setBusy] = useState(false);
  const [ai, setAi] = useState(false);
  const [err, setErr] = useState("");
  const ctrl = useRef(null);
  const before = useRef(tpl);
  useEffect(() => { setTimeout(() => { const t = document.getElementById("pl-draft"); if (t) { t.focus(); t.setSelectionRange(0, 0); t.scrollTop = 0; } }, 60); return () => ctrl.current?.abort(); }, []);
  if (!a) return html`<${Modal} title="Draft" onClose=${closeModal}><p class="muted">This application isn't here anymore.</p></${Modal}>`;

  const improve = async () => {
    setErr(""); setBusy(true); before.current = text;
    const ac = new AbortController(); ctrl.current = ac;
    const name = profile.name && profile.name.trim();
    const draft = name ? text.split(name).join("[Your name]") : text;
    const facts = [
      `Role: ${a.title || "unknown"} at ${a.company}. Current stage: ${STAGE[a.stage].label}.`,
      a.appliedAt && `Applied on ${fmt.dateY(a.appliedAt)}.`,
      a.contacts?.[0]?.name && `Contact: ${a.contacts[0].name}${a.contacts[0].role ? " (" + a.contacts[0].role + ")" : ""}.`,
      r && `Interview round: ${ROUND[r.type]?.label || "interview"}${r.at ? " on " + fmt.dateY(r.at) : ""}${r.interviewers ? " with " + r.interviewers : ""}.`,
      r?.reflection && `The candidate's notes on how it went: ${r.reflection}`,
    ].filter(Boolean).join("\n");
    const prompt = `Rewrite this ${thanks ? "thank-you email to send after a job interview" : "follow-up email about a job application that hasn't had a reply"}.
Make it concise, specific, warm and not generic. Under 120 words including the subject line. Keep "Subject:" as the first line. Use only the facts below and in the draft; do not invent experience, projects, names or details. Keep "[Your name]" as the sign-off placeholder. Return only the email text, no commentary.

Facts:
${facts}

Draft:
"""
${draft}
"""`;
    try {
      const res = await askClaude(prompt, { signal: ac.signal, onText: (x) => { const v = typeof x === "string" ? x : x?.text; if (v) setText(name ? v.split("[Your name]").join(name) : v); } });
      const out = (res?.text || "").trim();
      if (out) setText(name ? out.split("[Your name]").join(name) : out);
      setAi(true);
    } catch (e) {
      if (ac.signal.aborted || e?.name === "AbortError") { setText(before.current); }
      else { setErr(aiErr(e)); setText(before.current); }
    } finally { setBusy(false); ctrl.current = null; }
  };
  const stop = () => ctrl.current?.abort();
  const sent = () => {
    if (thanks && r) { Apps.updateRound(a.id, r.id, { thanked: true }); Apps.update(a.id, (x) => ({ events: [...x.events, { id: uid("e_"), at: now(), kind: "thanks", text: `Sent thank-you for ${ROUND[r.type]?.label || "interview"}` }] })); toast("Marked the thank-you as sent"); }
    else if (thanks) { Apps.update(a.id, (x) => ({ events: [...x.events, { id: uid("e_"), at: now(), kind: "thanks", text: "Sent a thank-you note" }] })); toast("Marked the thank-you as sent"); }
    else { Apps.update(a.id, { followedUpAt: now() }); Apps.addEvent(a.id, { kind: "followup", text: "Followed up" }); toast(`Logged your follow-up to ${a.company}`); }
    closeModal();
  };
  const title = thanks ? `Thank-you note · ${a.company}` : `Follow-up · ${a.company}`;
  return html`<${Modal} title=${title} onClose=${closeModal} size="lg" foot=${html`
    <${Btn} icon="copy" onClick=${() => copyText(text, "Draft copied")} disabled=${busy}>Copy</${Btn}>
    <${Btn} kind="primary" icon="check" onClick=${sent} disabled=${busy}>Mark as sent</${Btn}>`}>
    <div class="callout"><${Icon} name="info" /><span>Copy this into your own email and send it from your inbox. Then mark it as sent so Heardback ${thanks ? "stops reminding you" : "restarts the reply clock"}.</span></div>
    <div class="field">
      <div class="row"><label for="pl-draft" style="flex:1" class="label">${thanks ? "Thank-you note" : "Follow-up email"}</label>
        ${ai && !busy && html`<span class="ai-label"><${Icon} name="spark" />Drafted by Claude. Review before sending.</span>`}</div>
      <textarea id="pl-draft" class=${cx("textarea pl-draft", busy && "busy")} value=${text} readOnly=${busy} onInput=${(e) => setText(e.currentTarget.value)} aria-busy=${busy ? "true" : "false"}></textarea>
      <span class="hint">${thanks && r && !r.reflection ? "Tip: add a line about how it went in the round's notes and the draft gets more specific." : "Edit freely. Specific beats polished."}</span>
    </div>
    ${err && html`<div class="callout wait" role="alert"><${Icon} name="alert" /><span>${err} Your draft is unchanged.</span></div>`}
    ${c.sample && html`<div class="row wrap">
      ${busy ? html`<span class="pl-thinking"><span class="pl-spin" aria-hidden="true"></span>Thinking…</span><${Btn} size="sm" icon="x" onClick=${stop}>Stop</${Btn}>`
        : html`<${Btn} size="sm" icon="spark" onClick=${improve}>Improve with Claude</${Btn}>${ai && html`<${Btn} size="sm" kind="ghost" onClick=${() => { setText(before.current); setAi(false); }}>Undo rewrite</${Btn}>`}`}
      <span class="hint">${busy ? "" : "Uses your Claude account. Your name stays out of the request."}</span>
    </div>`}
  </${Modal}>`;
}

/* ---------- Add application modal ---------- */
MODALS.add = function PlAdd({ job }) {
  const [f, setF] = useState(() => ({
    company: job?.co || "", title: job?.t || "", location: job ? (job.l || [])[0] || (job.r ? "Remote" : "") : "", url: job?.url || "",
    stage: "applied", date: fmt.toDateInput(now()),
  }));
  const [errs, setErrs] = useState({});
  useEffect(() => { setTimeout(() => document.getElementById(job ? "pl-add-stage" : "pl-add-co")?.focus(), 60); }, []);
  const set = (k) => (e) => { setF({ ...f, [k]: e.currentTarget.value }); if (errs[k]) setErrs({ ...errs, [k]: "" }); };
  const existing = job ? Apps.byJob(job.id) : null;
  const save = (open) => {
    const e = {};
    if (!f.company.trim()) e.company = "Enter the company name.";
    if (!f.title.trim()) e.title = "Enter the role title.";
    setErrs(e);
    if (e.company || e.title) { document.getElementById(e.company ? "pl-add-co" : "pl-add-title")?.focus(); return; }

    const a = Apps.create({ company: f.company.trim(), title: f.title.trim(), location: f.location.trim(), url: f.url.trim(), stage: f.stage, appliedAt, jobId: job?.id || null, source: job ? "find" : "manual", lastActivityAt: now() });
    closeModal();
    if (open) openApp(a.id);

  return html`<${Modal} title="Add application" onClose=${closeModal} foot=${html`
    <${Btn} kind="ghost" onClick=${closeModal}>Cancel</${Btn}>
    <span class="spacer" style="flex:1"></span>
    <${Btn} onClick=${() => save(true)}>Add and open</${Btn}>
    <${Btn} kind="primary" onClick=${() => save(false)}>Add application<span class="hide-sm"><${Kbd}>↵</${Kbd}></span></${Btn}>`}>
    ${existing && html`<div class="callout info"><${Icon} name="info" /><span>This job is already in your pipeline as ${STAGE[existing.stage].label}. <button type="button" class="pl-linkbtn" onClick=${() => { closeModal(); openApp(existing.id); }}>Open it</button></span></div>`}
    <form id="pl-add-form" class="pl-form" onSubmit=${(e) => { e.preventDefault(); save(false); }} novalidate>
      <div class="field"><label for="pl-add-co">Company</label><input id="pl-add-co" class="input" value=${f.company} onInput=${set("company")} placeholder="e.g. Northwind Labs" autofocus aria-invalid=${errs.company ? "true" : undefined} aria-describedby=${errs.company ? "pl-add-co-err" : undefined} autocomplete="off" />${errs.company && html`<span class="pl-err" id="pl-add-co-err">${errs.company}</span>`}</div>
      <div class="field"><label for="pl-add-title">Role</label><input id="pl-add-title" class="input" value=${f.title} onInput=${set("title")} placeholder="e.g. Software Engineer Intern" aria-invalid=${errs.title ? "true" : undefined} aria-describedby=${errs.title ? "pl-add-title-err" : undefined} autocomplete="off" />${errs.title && html`<span class="pl-err" id="pl-add-title-err">${errs.title}</span>`}</div>
      <div class="field"><label for="pl-add-loc">Location <span class="faint">optional</span></label><input id="pl-add-loc" class="input" value=${f.location} onInput=${set("location")} placeholder="City, or Remote" /></div>
      <div class="field"><label for="pl-add-url">Posting link <span class="faint">optional</span></label><input id="pl-add-url" class="input" type="url" value=${f.url} onInput=${set("url")} placeholder="https://" /></div>
      <div class="field"><label for="pl-add-stage">Stage</label><select id="pl-add-stage" class="select" value=${f.stage} onChange=${set("stage")}>${STAGES.map((st) => html`<option key=${st.id} value=${st.id}>${st.label}</option>`)}</select></div>
      <div class="field"><label for="pl-add-date">${f.stage === "saved" ? "Applied on" : "Applied on"}</label><input id="pl-add-date" class="input" type="date" value=${f.stage === "saved" ? "" : f.date} disabled=${f.stage === "saved"} onInput=${set("date")} />${f.stage === "saved" && html`<span class="hint">Set when you move it to Applied.</span>`}</div>
      <button type="submit" class="sr" tabindex="-1">Add application</button>
    </form>

};

/* ---------- Paste-an-email modal ---------- */
MODALS.paste = function PlPaste() {
  const c = useCaps();
  const [raw, setRaw] = useState("");
  const [f, setF] = useState(null);
  const [src, setSrc] = useState("rules");
  const [target, setTarget] = useState("new");
  const [touched, setTouched] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const ctrl = useRef(null);
  useEffect(() => { setTimeout(() => document.getElementById("pl-p-raw")?.focus(), 60); return () => ctrl.current?.abort(); }, []);
  const apps = useStore((s) => s.apps);
  const appList = useMemo(() => Object.values(apps).sort((x, y) => x.company.localeCompare(y.company)), [apps]);

  const fill = (p, from) => {
    const m = matchApp(p.company, p.title);
    setF({ kind: p.kind, company: p.company || "", title: p.title || "", at: p.at || now(), interviewAt: p.interviewAt || null, roundType: p.roundType || (p.kind === "screen" ? "recruiter" : "other"), interviewers: p.interviewers || "", next: p.next || "" });
    setTarget(m ? m.id : "new"); setTouched(false); setSrc(from); setErr("");
    setTimeout(() => document.getElementById("pl-p-preview")?.scrollIntoView({ block: "nearest", behavior: "smooth" }), 40);
  };
  const readRules = () => { if (!raw.trim()) { setErr("Paste an email first, or try one of the samples."); return; } fill(plParse(raw), "rules"); };
  const readAI = async () => {
    if (!raw.trim()) { setErr("Paste an email first, or try one of the samples."); return; }
    setErr(""); setBusy(true);
    const ac = new AbortController(); ctrl.current = ac;
    const prompt = `Read this job-search email and return JSON only, an object with exactly these keys:
"kind": one of "confirmation", "interview", "screen", "rejection", "offer", "other" ("screen" = a first recruiter or phone call; "interview" = any later interview or assessment),
"company": the hiring company's name, or "",
"title": the job title, or "",
"date": the date the email was sent as ISO 8601, or null,
"interviewAt": the scheduled interview or call time as ISO 8601 local time without a timezone offset (e.g. "2026-11-05T14:00:00"), or null if no specific time is set,
"roundType": one of "recruiter", "technical", "behavioral", "case", "onsite", "other", or null,
"interviewers": names of interviewers mentioned, or "",
"nextStep": one short sentence on what the candidate should do next.
Use only what the email says. Today is ${new Date().toDateString()}.

Email:
"""
${raw.slice(0, 12000)}
"""`;
    try {
      const j = await askClaudeJSON(prompt, { signal: ac.signal });
      const kind = EMAIL_KINDS[j?.kind] ? j.kind : "other";
      const ia = j?.interviewAt ? Date.parse(j.interviewAt) : NaN;
      const d = j?.date ? Date.parse(j.date) : NaN;
      fill({ kind, company: String(j?.company || ""), title: String(j?.title || ""), at: isNaN(d) ? now() : d, interviewAt: isNaN(ia) ? null : ia, roundType: ROUND[j?.roundType] ? j.roundType : null, interviewers: String(j?.interviewers || ""), next: String(j?.nextStep || "") }, "ai");
    } catch (e) {
      if (!ac.signal.aborted) setErr(`${aiErr(e)} You can still use “Read email”, which works without Claude.`);
    } finally { setBusy(false); ctrl.current = null; }
  };
  const sample = (k) => { setRaw(PL_SAMPLES[k].text); setF(null); setErr(""); fill(plParse(PL_SAMPLES[k].text), "rules"); };

    <div class="field">
      <div class="row"><label for="pl-p-raw" class="label" style="flex:1">Email</label>${raw && html`<button type="button" class="pl-linkbtn pl-small" onClick=${() => { setRaw(""); setF(null); setErr(""); document.getElementById("pl-p-raw")?.focus(); }}>Clear</button>`}</div>

    ${f && html`<div class="pl-preview card" id="pl-p-preview">

        <span class="spacer" style="flex:1"></span>

      </div>
      <div class="pl-plan"><${Icon} name="arrowR" /><div><span class="pl-eyebrow">What happens when you confirm</span><p>${plan}</p></div></div>
      <div class="pl-preview-grid">
        <div class="field"><label for="pl-p-kind">Type</label><select id="pl-p-kind" class="select" value=${f.kind} onChange=${upd("kind")}>${Object.entries(EMAIL_KINDS).map(([id, x]) => html`<option key=${id} value=${id}>${x.label}</option>`)}</select></div>
        <div class="field"><label for="pl-p-date">Email date</label><input id="pl-p-date" class="input" type="date" value=${fmt.toDateInput(f.at)} onChange=${(e) => setF({ ...f, at: plFromDate(e.currentTarget.value) || f.at })} /></div>
        <div class="field"><label for="pl-p-co">Company</label><input id="pl-p-co" class="input" value=${f.company} onInput=${upd("company")} placeholder="Not found. Type it in." /></div>

function PfNumber({ id, value, min, max, onChange, suffix }) {
  const [v, setV] = useState(String(value));
  useEffect(() => setV(String(value)), [value]);
  const commit = (raw) => { const n = parseInt(raw, 10); if (!isNaN(n)) onChange(clamp(n, min, max)); else setV(String(value)); };
  return html`<div class="row pf-num"><input id=${id} class="input num" type="number" inputmode="numeric" min=${min} max=${max} value=${v}
    onInput=${(e) => { setV(e.currentTarget.value); const n = parseInt(e.currentTarget.value, 10); if (!isNaN(n) && n >= min && n <= max) onChange(n); }}
    onBlur=${(e) => commit(e.currentTarget.value)} />${suffix && html`<span class="muted" style="font-size:var(--fs-sm)">${suffix}</span>`}</div>`;
}

/* ---------- Export / import ---------- */
function pfExportJSON() {
  const s = store.get();
  const data = { app: "Heardback", kind: "backup", exportedAt: new Date().toISOString(), v: s.v || 1, profile: s.profile, settings: s.settings, apps: s.apps, dismissed: s.dismissed };
  saveFile("heardback-backup.json", JSON.stringify(data, null, 2), "application/json");
}
function pfExportCSV() {
  const apps = Object.values(store.get().apps).sort((a, b) => (b.lastActivityAt || 0) - (a.lastActivityAt || 0));
  const head = ["company", "title", "location", "stage", "applied", "last activity", "url", "rounds"];
  const iso = (t) => (t ? fmt.toDateInput(t) : "");
  const rows = apps.map((a) => [a.company, a.title, a.location, STAGE[a.stage]?.label || a.stage, iso(a.appliedAt), iso(a.lastActivityAt), a.url, (a.rounds || []).length]);
  saveFile("heardback-applications.csv", [head, ...rows].map((r) => r.map(csvEscape).join(",")).join("\n"), "text/csv");
}
const PF_STAGE_WORDS = [
  [/offer|accepted/i, "offer"], [/reject|declin|no longer|not selected|turned down/i, "rejected"], [/ghost|no response|no reply|silent/i, "ghosted"],
  [/interview|onsite|final|technical|superday/i, "interview"], [/screen|recruiter|phone/i, "screen"], [/appl|submitted|sent|waiting/i, "applied"], [/save|wish|bookmark|interested|to apply/i, "saved"],
];
function pfStage(raw, hasDate) {
  const t = (raw || "").trim();
  if (t) { const id = t.toLowerCase(); if (STAGE[id]) return id; const hit = PF_STAGE_WORDS.find(([re]) => re.test(t)); if (hit) return hit[1]; }
  return hasDate ? "applied" : "saved";
}
function pfDate(raw) {
  const t = (raw || "").trim(); if (!t) return null;
  const m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  const ts = m ? new Date(+m[1], +m[2] - 1, +m[3], 12).getTime() : Date.parse(t);
  return isNaN(ts) || ts > now() + 30 * DAY || ts < Date.UTC(2000, 0, 1) ? null : ts;
}
function pfAppKey(a) { return norm(`${a.company}|${a.title}`); }
function pfBuildApp(o) {
  const t = now();
  const stage = o.stage;
  const created = o.appliedAt || t;
  const ev = [{ id: uid("e_"), at: created, kind: "created", text: "Imported from CSV" }];
  if (stage !== "saved" && stage !== "applied") ev.push({ id: uid("e_"), at: created, kind: "stage", from: "applied", to: stage, text: `Moved to ${STAGE[stage].label}` });
  return {
    id: uid("a_"), company: o.company, title: o.title, location: o.location || "", url: o.url || "", jobId: null, stage,
    createdAt: created, appliedAt: stage === "saved" ? null : created, lastActivityAt: created, lastReplyAt: ["screen", "interview", "offer", "rejected"].includes(stage) ? created : null,
    notes: "", contacts: [], rounds: [], events: ev, salary: "", source: "import", example: false,
  };
}
function pfParseCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  if (rows.length < 2) return { error: "That CSV has no data rows. The first row should be headers like company, title, stage." };
  const head = rows[0].map((h) => norm(h));
  const col = (...names) => head.findIndex((h) => names.some((n) => h === n || h.replace(/ /g, "") === n.replace(/ /g, "")));
  const colLike = (re) => head.findIndex((h) => re.test(h));
  const ix = {
    company: col("company", "company name", "employer", "organization"),
    title: col("title", "job title", "role", "position", "job"),
    stage: col("stage", "status"),
    applied: col("applied date", "applied", "date applied", "applied at", "applied on", "date"),
    url: col("url", "link", "job url", "posting url", "job link"),
    location: col("location", "city"),
  };
  if (ix.applied < 0) ix.applied = colLike(/appl.*date|date.*appl/);
  if (ix.company < 0 && ix.title < 0) return { error: "Couldn't find a company or title column. Name the first row's columns company, title, stage, applied date, url, location." };
  const get = (r, k) => (ix[k] >= 0 ? (r[ix[k]] || "").trim() : "");
  const apps = []; let skipped = 0;
  for (const r of rows.slice(1)) {
    const company = get(r, "company").slice(0, 120), title = get(r, "title").slice(0, 200);
    if (!company && !title) { skipped++; continue; }
    const appliedAt = pfDate(get(r, "applied"));
    apps.push(pfBuildApp({ company: company || "Unknown company", title: title || "Untitled role", location: get(r, "location").slice(0, 120), url: /^https?:\/\//i.test(get(r, "url")) ? get(r, "url") : "", appliedAt, stage: pfStage(get(r, "stage"), !!appliedAt) }));
  }
  return { apps, skipped };
}
function pfCleanApp(a) {
  if (!a || typeof a !== "object" || typeof a.id !== "string") return null;
  if (typeof a.company !== "string" && typeof a.title !== "string") return null;
  const t = now();
  return {
    jobId: null, location: "", url: "", notes: "", salary: "", source: "import", example: false, lastReplyAt: null, appliedAt: null, ...a,
    company: String(a.company || ""), title: String(a.title || ""), stage: STAGE[a.stage] ? a.stage : "saved",
    createdAt: +a.createdAt || t, lastActivityAt: +a.lastActivityAt || +a.createdAt || t,
    contacts: Array.isArray(a.contacts) ? a.contacts : [], rounds: Array.isArray(a.rounds) ? a.rounds.filter((r) => r && r.id) : [], events: Array.isArray(a.events) ? a.events : [],
  };
}
function pfImportFile(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { toast("That file is over 8 MB. Import a smaller backup or CSV."); return; }
  const r = new FileReader();
  r.onerror = () => toast(`Couldn't read ${file.name}. Try again.`);
  r.onload = () => {
    const text = String(r.result || "");
    if (/\.json$/i.test(file.name) || /^\s*[{[]/.test(text)) {
      let data; try { data = JSON.parse(text); } catch { toast("That JSON file couldn't be read. Use a backup exported from Heardback."); return; }
      const rawApps = Array.isArray(data) ? data : Array.isArray(data?.apps) ? data.apps : data?.apps && typeof data.apps === "object" ? Object.values(data.apps) : null;
      if (!rawApps) { toast("That file isn't a Heardback backup. It needs an apps list."); return; }
      const apps = rawApps.map(pfCleanApp).filter(Boolean);
      const bad = rawApps.length - apps.length;
      const cur = store.get().apps;
      const replace = apps.filter((a) => cur[a.id]).length;
      askConfirm({
        title: `Import ${pluralize(apps.length, "application")}?`,
        body: `They'll be merged with what's here${replace ? `; ${pluralize(replace, "application")} with the same ID will be replaced by the backup's version` : ""}.${data.profile ? " Your profile and settings will be updated from the backup." : ""}${bad ? ` ${pluralize(bad, "entry", "entries")} couldn't be read and will be skipped.` : ""}`,
        confirmLabel: "Import and merge",
        onConfirm: () => {
          store.set((s) => ({
            ...s,
            apps: { ...s.apps, ...Object.fromEntries(apps.map((a) => [a.id, a])) },
            profile: data.profile && typeof data.profile === "object" ? { ...s.profile, ...data.profile, onboarded: true } : s.profile,
            settings: data.settings && typeof data.settings === "object" ? { ...s.settings, ...data.settings } : s.settings,
            dismissed: { ...s.dismissed, ...(data.dismissed && typeof data.dismissed === "object" ? data.dismissed : {}) },
          }));
          toast(`Imported ${pluralize(apps.length, "application")}`);
        },
      });
      return;
    }
    const res = pfParseCSV(text);
    if (res.error) { toast(res.error, { ms: 6000 }); return; }
    const existing = new Set(Object.values(store.get().apps).map(pfAppKey));
    const fresh = []; let dup = 0;
    for (const a of res.apps) { const k = pfAppKey(a); if (existing.has(k)) { dup++; continue; } existing.add(k); fresh.push(a); }
    if (!fresh.length) { toast(dup ? `Nothing new to import. All ${pluralize(dup, "row")} are already tracked.` : "No rows with a company or title were found."); return; }
    store.set((s) => ({ ...s, apps: { ...s.apps, ...Object.fromEntries(fresh.map((a) => [a.id, a])) } }));
    const extra = [dup && `${dup} already tracked`, res.skipped && `${res.skipped} without a company or title`].filter(Boolean).join(", ");
    toast(`Imported ${pluralize(fresh.length, "application")}${extra ? `. Skipped ${extra}.` : ""}`, { ms: 6000, undo: () => store.set((s) => { const apps = { ...s.apps }; fresh.forEach((a) => delete apps[a.id]); return { ...s, apps }; }) });
  };
  r.readAsText(file);
}
function pfDeleteAll() {
  askConfirm({
    title: "Delete all your data?",
    body: "This removes every application, round, note, your resume and your settings from this browser. It can't be undone. Export a backup first if you might want it later.",
    confirmLabel: "Delete everything",

const PREP_CAT_KEY = { Software: "software", "Data & AI": "data", Product: "product", Quant: "quant", Hardware: "hardware" };
const PREP_PRACTICE_TYPES = [{ id: "recruiter", label: "Recruiter" }, { id: "behavioral", label: "Behavioral" }, { id: "technical", label: "Technical" }, { id: "case", label: "Case" }];

function prepCatOf(app) {
  const job = app && app.jobId ? jobsStore.byId.get(app.jobId) : null;
  if (job && job.cat) return job.cat;
  const t = (app && app.title) || "";
  if (/quant|trad(ing|er)/i.test(t)) return "Quant";
  if (/data|machine learning|\bml\b|\bai\b|analytic|scien/i.test(t)) return "Data & AI";
  if (/product manag|\bapm\b|\bpm\b|product analyst/i.test(t)) return "Product";
  if (/hardware|embedded|firmware|fpga|asic|electrical|silicon|robot|mechanical/i.test(t)) return "Hardware";
  return "Software";
}
function prepQuestions(type, cat) {
  const tech = PREP_BANK[PREP_CAT_KEY[cat] || "software"];
  if (type === "recruiter") return PREP_BANK.recruiter;
  if (type === "behavioral") return PREP_BANK.behavioral;
  if (type === "technical") return tech;
  if (type === "case") return cat === "Quant" ? PREP_BANK.quant : cat === "Data & AI" ? PREP_BANK.data : PREP_BANK.product;
  // onsite / other: a deterministic mix of the role's technical questions and behavioral ones
  const mix = [];
  for (let i = 0; i < 6; i++) { if (tech[i]) mix.push(tech[i]); if (i < 4 && PREP_BANK.behavioral[i]) mix.push(PREP_BANK.behavioral[i]); }
  return mix;
}

/* ---------- Talking points from the resume (deterministic) ---------- */
const PREP_VERBS = /^(built|led|designed|developed|created|launched|shipped|implemented|reduced|increased|improved|optimized|automated|scaled|migrated|analyzed|won|grew|cut|saved|mentored|managed|founded|organized|delivered|architected|engineered|deployed|trained|researched|wrote|published|redesigned|streamlined|owned|drove|co-?founded|prototyped|integrated|refactored|accelerated|coordinated|taught|presented)\b/i;
const PREP_USE = [
  [/^(led|managed|mentored|organized|coordinated|founded|co-?founded|owned|drove|taught)/i, "leadership or ownership questions"],
  [/^(reduced|cut|optimized|improved|streamlined|accelerated|refactored|saved|automated)/i, "\"Tell me about improving something\""],
  [/^(built|shipped|launched|designed|developed|created|implemented|architected|engineered|deployed|prototyped|integrated)/i, "\"A project you're proud of\""],
  [/^(analyzed|researched|trained|published|wrote|presented)/i, "technical deep dives and \"walk me through your work\""],
  [/^(won|grew|increased|scaled|delivered)/i, "\"Your biggest impact\""],
];
function prepTalkingPoints(resume) {
  if (!resume) return [];
  const lines = resume.split(/\n|•|·|▪|◦|(?:^|\s)[-*–]\s/).map((l) => l.replace(/^[\s\-*•·–>]+/, "").replace(/\s+/g, " ").trim()).filter((l) => l.length >= 25 && l.length <= 260);
  const seen = new Set();
  const scored = lines.map((l, i) => {
    const num = /\d/.test(l) || /%|\$/.test(l);
    const verb = PREP_VERBS.test(l);
    return { l, i, s: (num ? 2 : 0) + (verb ? 2 : 0) + (/\b(users|customers|team|latency|revenue|accuracy|time|cost|performance)\b/i.test(l) ? 1 : 0), num, verb };
  }).filter((x) => x.s >= 2 && !seen.has(x.l.toLowerCase()) && seen.add(x.l.toLowerCase()));
  return scored.sort((a, b) => b.s - a.s || a.i - b.i).slice(0, 5).sort((a, b) => a.i - b.i).map((x) => {
    const strong = x.l.match(/\$\d[\d,.]*\s?[kKmMbB]?\b|\d[\d,.]*\s?%|\b\d[\d,.]*x\b/g) || [];
    const plain = x.l.match(/\b\d[\d,.]*\b/);
    const metric = strong.length >= 2 ? `${strong[0]} to ${strong[1]}` : strong[0] || null;
    const use = (PREP_USE.find(([re]) => re.test(x.l)) || [null, "behavioral questions and \"tell me about yourself\""])[1];
    return { text: x.l, metric, plain: !metric && plain ? plain[0] : null, use };
  });
}

/* ---------- Round lists ---------- */
function prepRounds(s) {
  const t = now();
  const up = [], past = [];
  for (const a of Apps.list(s)) for (const r of a.rounds || []) {
    if (r.outcome === "cancelled") continue;
    if (!r.at) { if (r.outcome === "pending") up.push({ a, r }); }
    else if (r.at >= t - 2 * 3600000) up.push({ a, r });
    else if (r.outcome === "pending") past.push({ a, r });
  }
  up.sort((x, y) => (x.r.at || Infinity) - (y.r.at || Infinity));
  past.sort((x, y) => (y.r.at || 0) - (x.r.at || 0));
  return { up, past };
}
function prepSetFocus(f) { store.set((s) => ({ ...s, ui: { ...s.ui, prepFocus: f } })); }

function PrepTimer({ resetKey }) {
  const LIMIT = 120;
  const [left, setLeft] = useState(LIMIT);
  const [run, setRun] = useState(false);
  useEffect(() => { setLeft(LIMIT); setRun(false); }, [resetKey]);
  useEffect(() => {
    if (!run) return;
    const iv = setInterval(() => setLeft((x) => { if (x <= 1) { setRun(false); return 0; } return x - 1; }), 1000);
    return () => clearInterval(iv);
  }, [run]);
  const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, "0");
  return html`<div class="prep-timer">
    <span class=${cx("prep-clock num", left === 0 && "done", left > 0 && left <= 20 && "low")} role="timer" aria-live="off" aria-label=${`${mm} minutes ${ss} seconds left`}>${mm}:${ss}</span>
    <div class="row">
      <${Btn} kind=${run ? "" : "primary"} icon=${run ? "clock" : "play"} onClick=${() => { if (left === 0) setLeft(LIMIT); setRun(!run); }} id="prep-timer-toggle">${run ? "Pause" : left < LIMIT && left > 0 ? "Resume" : "Start"}</${Btn}>
      <${Btn} kind="ghost" icon="refresh" onClick=${() => { setRun(false); setLeft(LIMIT); }} disabled=${left === LIMIT && !run}>Reset</${Btn}>
    </div>
    <span class="hint">${left === 0 ? "Time. Land your answer in one sentence." : "Aim for about two minutes per answer."}</span>

}

function PrepAIStatus({ busy, onStop }) {

  return html`<div class="row prep-thinking" role="status"><span class="prep-dot"></span><span class="muted" style="font-size:var(--fs-sm)">Thinking…</span><${Btn} size="sm" kind="ghost" onClick=${onStop}>Stop</${Btn}></div>`;

function PrepPractice({ questions, ctx, onExit }) {
  const c = useCaps();
  const [i, setI] = useState(0);
  const [notes, setNotes] = useState({});
  const [fb, setFb] = useState({});
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const ctl = useRef(null);
  useEffect(() => () => ctl.current?.abort(), []);
  const q = questions[i];
  const outline = notes[i] || "";
  const feedback = async () => {
    ctl.current?.abort();
    const ac = new AbortController(); ctl.current = ac;
    setBusy(true); setErr("");
    const prompt = `You are a calm, experienced interview coach. A candidate is practicing for a ${ctx.round} interview for a ${ctx.title || ctx.cat + " role"}.\n\nQuestion: ${q.q}\n\nTheir answer outline:\n"""\n${outline.slice(0, 4000)}\n"""\n\nGive concise, specific, kind feedback as exactly three short bullets, each starting with its label:\n- What worked: ...\n- What to tighten: ...\n- A stronger opening line: "..."\nNo preamble, no headings, under 110 words total. Don't invent facts about the candidate.`;
    try {
      const r = await askClaude(prompt, { signal: ac.signal, onText: (x) => setFb((f) => ({ ...f, [i]: x.text })) });
      setFb((f) => ({ ...f, [i]: r.text }));
    } catch (e) { if (e?.name !== "AbortError" && !ac.signal.aborted) setErr(aiErr(e)); }
    if (ctl.current === ac) setBusy(false);
  };
  const stop = () => { ctl.current?.abort(); setBusy(false); };
  const goTo = (n) => { stop(); setErr(""); setI(n); };
  return html`<div class="card prep-practice">
    <div class="card-head">
      <${Icon} name="play" /><h3>Practice</h3><span class="faint num prep-count">${i + 1} of ${questions.length}</span>
      <span class="spacer"></span><${Btn} size="sm" kind="ghost" icon="x" onClick=${onExit} id="prep-exit">Exit<span class="hide-sm">${"\u00a0practice"}</span></${Btn}>
    </div>
    <div class="card-body prep-practice-body">
      <div class="stack prep-q-col">
        <p class="prep-q-big">${q.q}</p>
        ${q.t && html`<p class="prep-tip"><span class="faint">What a good answer shows:</span> ${q.t}</p>`}
        <${Field} label="Your answer outline" id="prep-outline" hint="Bullet the key points. Notes stay in this browser.">
          <textarea id="prep-outline" class="textarea" rows="5" placeholder="Situation, what you did, the result…" value=${outline} onInput=${(e) => { const v = e.currentTarget.value; setNotes((n) => ({ ...n, [i]: v })); }}></textarea>
        </${Field}>
        ${c.sample && html`<div class="stack-sm">
          <div class="row wrap">
            <${Btn} icon="spark" onClick=${feedback} disabled=${busy || outline.trim().length < 15} id="prep-feedback">Get feedback from Claude</${Btn}>
            ${outline.trim().length < 15 && html`<span class="hint">Write a few lines first.</span>`}
            <${PrepAIStatus} busy=${busy} onStop=${stop} />
          </div>
          ${err && html`<div class="callout wait" role="alert"><${Icon} name="alert" /><span>${err}</span></div>`}
          ${fb[i] && html`<div class="stack-sm"><div class="ai-box">${fb[i]}</div><span class="ai-label"><${Icon} name="spark" />Feedback by Claude. Use what helps.</span></div>`}
        </div>`}
      </div>
      <div class="prep-timer-col"><${PrepTimer} resetKey=${i} /></div>
    </div>
    <div class="prep-practice-foot">
      <${Btn} icon="chevL" onClick=${() => goTo(i - 1)} disabled=${i === 0}>Previous</${Btn}>
      <span class="spacer"></span>
      ${i < questions.length - 1 ? html`<${Btn} kind="primary" iconRight="arrowR" onClick=${() => goTo(i + 1)} id="prep-next">Next question</${Btn}>` : html`<${Btn} kind="primary" icon="check" onClick=${onExit}>Finish practice</${Btn}>`}
    </div>
  </div>`;
}

function PrepNotes({ a, r }) {
  const [v, setV] = useState(r.prep || "");

    try {

      setQs(arr.map((x) => String(typeof x === "string" ? x : x?.q || x?.question || "")).filter(Boolean).slice(0, 6));

/* --- js/views/stats.js --- */
/* ===== Insights: personal analytics, honest about sample sizes ===== */

const STATS_REPLY_STAGES = ["screen", "interview", "offer", "rejected"];
function stats_isReplied(a) { return !!a.lastReplyAt || STATS_REPLY_STAGES.includes(a.stage); }
function stats_reachedInterview(a) { return ["interview", "offer"].includes(a.stage) || (a.rounds || []).length > 0 || (a.events || []).some((e) => e.to === "interview"); }
function stats_days(d) { return d == null ? "—" : d < 10 && d % 1 ? d.toFixed(1) : String(Math.round(d)); }
function stats_niceScale(max) {
  if (max <= 4) return { step: 1, top: 4 };
  for (const step of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500]) if (max / step <= 5) return { step, top: Math.ceil(max / step) * step };
  return { step: max, top: max };
}

/* Deterministic, plain-language observations. Each one only appears when there is enough data behind it. */
function stats_observations(s, apps, st, jobsById) {
  const t = now();
  const applied = apps.filter((a) => a.stage !== "saved" && a.appliedAt);
  const ghostDays = s.settings.ghostDays || 21;
  const out = [];

  // 1. Silence after the ghost window
  const old = applied.filter((a) => t - a.appliedAt >= ghostDays * DAY);
  const silent = old.filter((a) => !stats_isReplied(a));
  if (old.length >= 3 && silent.length) {
    const most = silent.length / old.length > 0.5;
    out.push({ key: "silent", icon: "ghost", tone: "ghost",
      text: most ? `Most of your applications go silent: ${silent.length} of ${old.length} sent ${ghostDays}+ days ago never got a reply.` : `${silent.length} of ${old.length} applications sent ${ghostDays}+ days ago never got a reply.`,
      hint: `Only counts applications old enough to judge (${ghostDays} days, from your settings).` });
  }

  // 2. Biggest drop-off between funnel steps (each step needs at least 3 at the start)
  const repliedApps = applied.filter(stats_isReplied);
  const positive = applied.filter((a) => ["screen", "interview", "offer"].includes(a.stage) || (a.events || []).some((e) => ["screen", "interview", "offer"].includes(e.to)));
  const interviewed = applied.filter(stats_reachedInterview);
  const decidedInterviews = interviewed.filter((a) => ["offer", "rejected", "ghosted"].includes(a.stage));
  const steps = [
    { from: "sending an application", to: "getting any reply", n: applied.length, k: repliedApps.length },
    { from: "a positive reply", to: "an interview", n: positive.length, k: positive.filter(stats_reachedInterview).length },
    { from: "interviewing", to: "an offer", n: decidedInterviews.length, k: decidedInterviews.filter((a) => a.stage === "offer").length, note: "finished processes only" },
  ].filter((x) => x.n >= 3);
  if (steps.length) {
    const worst = steps.reduce((a, b) => (b.k / b.n < a.k / a.n ? b : a));
    out.push({ key: "drop", icon: "filter", tone: "wait",
      text: `Your biggest drop-off is between ${worst.from} and ${worst.to}: ${worst.k} of ${worst.n} (${fmt.pct(worst.k / worst.n)}) made it through.`,
      hint: steps.length > 1 ? `Compared across ${steps.length} funnel steps${worst.note ? ", " + worst.note : ""}.` : "Other steps need at least 3 applications to compare." });
  }

  // 3. Where rejections happen
  const rej = applied.filter((a) => a.stage === "rejected");
  if (rej.length >= 2) {
    const pre = rej.filter((a) => !stats_reachedInterview(a)).length;
    out.push({ key: "rej", icon: "x", tone: "bad",
      text: pre / rej.length >= 0.5 ? `${pre} of ${rej.length} rejections came before any interview, so the resume screen is where most of them happen.` : `${rej.length - pre} of ${rej.length} rejections came after at least one interview round.`,
      hint: pre / rej.length >= 0.5 ? "Tailoring your resume to each listing usually matters most at this stage." : "Your reflections on those rounds are the best place to look for patterns." });
  }

  // 4. Round outcomes by type
  const byType = {};
  for (const a of apps) for (const r of a.rounds || []) {
    if (r.outcome !== "passed" && r.outcome !== "failed") continue;
    const b = (byType[r.type] = byType[r.type] || { p: 0, f: 0 });
    b[r.outcome === "passed" ? "p" : "f"]++;
  }
  const typed = Object.entries(byType).map(([type, b]) => ({ type, ...b, d: b.p + b.f }));
  const decided = typed.reduce((x, y) => x + y.d, 0);
  const weak = typed.filter((x) => x.d >= 2 && x.f > 0).sort((x, y) => x.p / x.d - y.p / y.d)[0];
  if (weak) out.push({ key: "rounds", icon: "prep", tone: "accent", text: `${ROUND[weak.type]?.label || "These"} rounds are your toughest so far: you passed ${weak.p} of ${weak.d}.`, hint: `Based on ${pluralize(decided, "round")} with a logged outcome.` });
  else if (decided >= 3) {
    const passed = typed.reduce((x, y) => x + y.p, 0);
    out.push({ key: "rounds", icon: "trophy", tone: "ok", text: `You've passed ${passed} of ${decided} interview rounds with a logged outcome.`, hint: "Only counts rounds marked passed or failed." });
  }

  // 5. Reply timing vs. who is still waiting
  if (st.medianReplyDays != null && st.replied >= 3) {
    const waiting = applied.filter((a) => a.stage === "applied" && !stats_isReplied(a) && (t - a.appliedAt) / DAY > st.medianReplyDays);
    out.push({ key: "timing", icon: "clock", tone: "",
      text: `Companies that replied took a median of ${stats_days(st.medianReplyDays)} days.${waiting.length ? ` ${waiting.length === 1 ? "1 application still waiting is" : `${waiting.length} applications still waiting are`} past that point.` : ""}`,
      hint: `n=${st.replied} replies.${waiting.length ? " A short follow-up is reasonable for those." : ""}` });
  }

  // 6. Category response rates (needs applications linked to listings)
  const cats = {};
  for (const a of applied) {
    const j = a.jobId && jobsById.get(a.jobId);
    if (!j) continue;
    const c = (cats[j.cat] = cats[j.cat] || { n: 0, r: 0 });
    c.n++; if (stats_isReplied(a)) c.r++;
  }
  const cl = Object.entries(cats).filter(([, c]) => c.n >= 3).sort((x, y) => y[1].r / y[1].n - x[1].r / x[1].n);
  if (cl.length >= 2) {
    const [hi, lo] = [cl[0], cl[cl.length - 1]];
    if (hi[1].r / hi[1].n > lo[1].r / lo[1].n) out.push({ key: "cat", icon: "layers", tone: "info", text: `${hi[0]} roles reply more often: ${fmt.pct(hi[1].r / hi[1].n)} vs ${fmt.pct(lo[1].r / lo[1].n)} for ${lo[0]}.`, hint: `n=${hi[1].n} and n=${lo[1].n}, from applications linked to listings.` });
  }

  // 7. Applying early (needs linked listings with a posted date)
  const timed = applied.map((a) => ({ a, j: a.jobId && jobsById.get(a.jobId) })).filter((x) => x.j && x.j.p);
  const early = timed.filter((x) => x.a.appliedAt - x.j.p <= 3 * DAY), late = timed.filter((x) => x.a.appliedAt - x.j.p > 3 * DAY);
  if (early.length >= 3 && late.length >= 3) {
    const re = early.filter((x) => stats_isReplied(x.a)).length / early.length, rl = late.filter((x) => stats_isReplied(x.a)).length / late.length;
    if (Math.abs(re - rl) >= 0.1) out.push({ key: "early", icon: "bolt", tone: "accent", text: `Applying within 3 days of posting got replies ${fmt.pct(re)} of the time, vs ${fmt.pct(rl)} when you applied later.`, hint: `n=${early.length} early, n=${late.length} later.` });
  }
  return out;
}

function stats_WeeklyChart({ weeks }) {
  const ref = useRef(null);
  const [w, setW] = useState(640);
  const [hi, setHi] = useState(null);
  useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    setW(Math.max(260, Math.round(el.clientWidth)));
    if (typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver((es) => setW(Math.max(260, Math.round(es[0].contentRect.width))));
    ro.observe(el); return () => ro.disconnect();
  }, []);
  const H = w < 420 ? 200 : 268;
  const m = { l: 28, r: 8, t: 22, b: 28 };
  const n = weeks.length;
  const max = Math.max(1, ...weeks.map((x) => Math.max(x.applied, x.replies)));
  const { step, top } = stats_niceScale(max);
  const iw = w - m.l - m.r, ih = H - m.t - m.b;
  const band = iw / n, bw = Math.min(24, band * 0.5);
  const xc = (i) => m.l + band * (i + 0.5);
  const y = (v) => m.t + ih - (v / top) * ih;
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  const bar = (i, v) => {
    if (!v) return null;
    const x0 = xc(i) - bw / 2, x1 = x0 + bw, yb = y(0), yt = y(v), r = Math.min(4, yb - yt, bw / 2);
    return `M${x0},${yb}V${yt + r}Q${x0},${yt} ${x0 + r},${yt}H${x1 - r}Q${x1},${yt} ${x1},${yt + r}V${yb}Z`;
  };
  const line = weeks.map((x, i) => `${i ? "L" : "M"}${xc(i)},${y(x.replies)}`).join("");
  const every = band < 46 ? 2 : 1;
  const last = n - 1;
  const lbl = (x, i) => i === last ? "This week" : fmt.date(x.start);
  const tip = hi != null ? weeks[hi] : null;
  return html`<div class="st-chart-inner" ref=${ref} style="position:relative">
    <svg class="chart st-chart" width=${w} height=${H} viewBox=${`0 0 ${w} ${H}`} preserveAspectRatio="xMidYMid meet" role="img" aria-label="Applications and replies per week, last 8 weeks">
      ${ticks.map((v) => html`<g key=${"t" + v}>
        <line class=${v === 0 ? "base-line" : "grid-line"} x1=${m.l} x2=${w - m.r} y1=${y(v)} y2=${y(v)} />
        <text x=${m.l - 8} y=${y(v) + 4} text-anchor="end">${v}</text>
      </g>`)}
      ${hi != null && html`<rect class="st-band" x=${xc(hi) - band / 2 + 2} y=${m.t - 6} width=${band - 4} height=${ih + 6} rx="4" />`}
      ${weeks.map((x, i) => html`<path key=${"b" + i} class="st-bar" d=${bar(i, x.applied)} />`)}
      ${weeks.map((x, i) => (i % every === (last % every) ? html`<text key=${"x" + i} class=${cx("st-xl", i === last && "now")} x=${xc(i)} y=${H - 8} text-anchor=${i === last && band < 70 ? "end" : "middle"} dx=${i === last && band < 70 ? bw / 2 + 4 : 0}>${lbl(x, i)}</text>` : null))}
      <path class="st-line" d=${line} />
      ${weeks.map((x, i) => html`<circle key=${"d" + i} class="st-dot" cx=${xc(i)} cy=${y(x.replies)} r=${i === last ? 5 : 4} />`)}
      ${weeks[last].applied > 0 && html`<text class="st-val" x=${xc(last)} y=${y(weeks[last].applied) - 8} text-anchor="middle">${weeks[last].applied}</text>`}
      ${weeks.map((x, i) => html`<rect key=${"h" + i} class="st-hit" x=${xc(i) - band / 2} y=${m.t - 6} width=${band} height=${ih + 6} tabindex="0"
        aria-label=${`Week of ${fmt.date(x.start)}: ${pluralize(x.applied, "application")}, ${pluralize(x.replies, "reply", "replies")}`}
        onMouseEnter=${() => setHi(i)} onMouseLeave=${() => setHi(null)} onFocus=${() => setHi(i)} onBlur=${() => setHi(null)}>
        <title>${`Week of ${fmt.date(x.start)}: ${x.applied} applied, ${x.replies} ${x.replies === 1 ? "reply" : "replies"}`}</title>
      </rect>`)}
    </svg>
    ${tip && html`<div class="st-tip" style=${`left:${clamp(xc(hi), 70, w - 70)}px;top:${y(Math.max(tip.applied, tip.replies)) - 12}px`}>
      <span>${hi === last ? "This week" : "Week of " + fmt.date(tip.start)}</span>
      <span class="st-tip-row"><i class="st-tip-key" style="background:var(--accent)"></i><b>${tip.applied}</b> applied</span>
      <span class="st-tip-row"><i class="st-tip-key" style="background:var(--ok)"></i><b>${tip.replies}</b> ${tip.replies === 1 ? "reply" : "replies"}</span>
    </div>`}
    <table class="sr"><caption>Applications and replies per week</caption><thead><tr><th>Week of</th><th>Applied</th><th>Replies</th></tr></thead>
      <tbody>${weeks.map((x) => html`<tr key=${x.start}><td>${fmt.date(x.start)}</td><td>${x.applied}</td><td>${x.replies}</td></tr>`)}</tbody></table>
  </div>`;
}

/* ===== Today: the home screen ===== */

function today_greeting(h = new Date().getHours()) {
  if (h < 5) return "Good evening";
  if (h < 12) return "Good morning";
  if (h < 18) return "Good afternoon";
  return "Good evening";
}
function today_firstName(name) { return (name || "").trim().split(/\s+/)[0] || ""; }
function today_dayLabel(ts) {
  const diff = Math.round((fmt.startOfDay(ts) - fmt.startOfDay(now())) / DAY);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  return fmt.date(ts, { weekday: "short", month: "short", day: "numeric" });
}
function today_setPrepFocus(focus) { store.set((s) => ({ ...s, ui: { ...s.ui, prepFocus: focus } })); }
function today_undismiss(key, prev) {
  store.set((s) => { const d = { ...s.dismissed }; if (prev) d[key] = prev; else delete d[key]; return { ...s, dismissed: d }; });
}

/* Rounds in the next 7 days (anything starting less than an hour ago still counts as upcoming). */
function today_upcoming(apps) {
  const t = now(), end = fmt.startOfDay(t) + 8 * DAY;
  const items = [];
  for (const a of apps) for (const r of a.rounds || []) {
    if (r.at && r.at >= t - 3600000 && r.at < end && r.outcome !== "cancelled") items.push({ a, r });
  }
  items.sort((x, y) => x.r.at - y.r.at);
  const groups = [];
  for (const it of items) {
    const k = fmt.startOfDay(it.r.at);
    let g = groups[groups.length - 1];
    if (!g || g.day !== k) { g = { day: k, label: today_dayLabel(it.r.at), items: [] }; groups.push(g); }
    g.items.push(it);
  }
  return { items, groups };
}

/* Run a task's primary action. */
function today_runTask(tk) {
  const a = tk.app;
  if (tk.kind === "prep") { today_setPrepFocus({ appId: a.id, roundId: tk.round.id }); go("prep"); }
  else if (tk.kind === "thanks" || tk.kind === "follow") {
    const props = tk.kind === "thanks" ? { appId: a.id, roundId: tk.round.id, kind: "thanks" } : { appId: a.id, kind: "follow" };
    if (MODALS.draft) openModal("draft", props);
    else {
      const prof = store.get().profile;
      copyText(tk.kind === "thanks" ? thankYouTemplate(a, tk.round, prof) : followUpTemplate(a, prof), "Draft copied to your clipboard");
    }
  }
  else if (tk.kind === "ghost") Apps.move(a.id, "ghosted");
  else if (tk.kind === "outcome") openApp(a.id, "rounds");
  else openApp(a.id);
}

/* Small anchored menu (snooze). Fixed-position so it escapes card overflow; closes on outside click, Esc, scroll. */
function today_Menu({ anchor, items, onClose, label }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    const r = anchor.getBoundingClientRect();
    const mw = ref.current ? ref.current.offsetWidth : 200, mh = ref.current ? ref.current.offsetHeight : 140;
    let left = r.right - mw; left = clamp(left, 8, window.innerWidth - mw - 8);
    let top = r.bottom + 4; if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    setPos({ left, top });
    setTimeout(() => ref.current?.querySelector("button")?.focus(), 10);
  }, [anchor]);
  useEffect(() => {
    const down = (e) => { if (!ref.current?.contains(e.target) && !anchor.contains(e.target)) onClose(); };
    const key = (e) => {
      if (e.key === "Escape") { e.stopPropagation(); onClose(); anchor.focus(); }
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        const bs = [...ref.current.querySelectorAll("button")]; const i = bs.indexOf(document.activeElement);
        bs[(i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length]?.focus();
      }
    };
    const scroll = () => onClose();
    document.addEventListener("mousedown", down, true);
    window.addEventListener("keydown", key, true);
    document.getElementById("workspace")?.addEventListener("scroll", scroll, { passive: true });
    window.addEventListener("resize", scroll);
    return () => {
      document.removeEventListener("mousedown", down, true); window.removeEventListener("keydown", key, true);

    };
  }, [anchor, onClose]);
  return html`<div class="menu td-menu" role="menu" aria-label=${label} ref=${ref} style=${pos ? `left:${pos.left}px;top:${pos.top}px` : "visibility:hidden;left:0;top:0"}>

function today_matches(jobs, profile, apps) {
  if (jobs.status !== "ready") return null;
  const tracked = new Set(Object.values(apps).map((a) => a.jobId).filter(Boolean));
  const cut = now() - 3 * DAY;
  const recent = [], older = [], seen = new Set();
  for (const j of jobs.jobs) {
    if (j.g >= 50 || tracked.has(j.id)) continue;
    const dk = j.co + "|" + norm(j.t);
    if (seen.has(dk)) continue;
    const f = fitScore(j, profile);
    if (!f) return { list: [], recentCount: 0, noProfile: true };
    if (f.score < 60) continue;
    seen.add(dk);
    if (j.p >= cut) recent.push({ j, f });
    else { if (recent.length >= 6) break; older.push({ j, f }); if (older.length >= 6) break; }
  }
  // Strongest fits first among the fresh ones, newest first within each band.
  const band = (f) => (f.score >= 80 ? 0 : f.score >= 70 ? 1 : 2);
  const fresh = recent.slice().sort((x, y) => band(x.f) - band(y.f) || y.j.p - x.j.p);
  return { list: fresh.concat(older).slice(0, 6), recentCount: recent.length, noProfile: false };
}

/* ===== Add an interview round to the calendar =====
   1) Viewer has the Google Calendar connector on claude.ai -> create the event directly (they approve the first call).
   2) Otherwise -> an .ics file they can open in any calendar app. */
const CAL_SERVER = "Google Calendar";
const CAL_MIN = 45;
function cal_localISO(ts) { const d = new Date(ts); const p = (n) => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`; }
function cal_utcStamp(ts) { return new Date(ts).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, ""); }
function cal_text(app, round) {
  const type = ROUND[round.type]?.label || "Interview";
  const summary = `${type}: ${app.company}${app.title ? " · " + app.title : ""}`;
  const lines = [`${type} for ${app.title || "the role"} at ${app.company}.`];
  if (round.interviewers) lines.push(`With: ${round.interviewers}`);
  if (round.prep) lines.push(`Prep notes: ${round.prep}`);
  if (app.url) lines.push(`Posting: ${app.url}`);
  lines.push("Added from Heardback.");
  return { summary, description: lines.join("\n") };
}
function cal_ics(app, round) {
  const { summary, description } = cal_text(app, round);
  const esc = (s) => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Heardback//EN", "CALSCALE:GREGORIAN", "BEGIN:VEVENT",
    `UID:${round.id}@heardback`, `DTSTAMP:${cal_utcStamp(now())}`, `DTSTART:${cal_utcStamp(round.at)}`, `DTEND:${cal_utcStamp(round.at + CAL_MIN * 60000)}`,
    `SUMMARY:${esc(summary)}`, `DESCRIPTION:${esc(description)}`,
    "BEGIN:VALARM", "TRIGGER:-PT30M", "ACTION:DISPLAY", "DESCRIPTION:Interview in 30 minutes", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
}
async function addToCalendar(appId, roundId) {
  const app = Apps.get(appId); const round = app?.rounds.find((r) => r.id === roundId);
  if (!app || !round) return;
  if (!round.at) { toast("Set a date and time for this round first."); return; }
  if (caps.mcp) {
    const { summary, description } = cal_text(app, round);
    try {
      await caps.mcp.callTool(CAL_SERVER, "create_event", { summary, description, startTime: cal_localISO(round.at), endTime: cal_localISO(round.at + CAL_MIN * 60000) });
      Apps.updateRound(appId, roundId, { calendar: "google" });
      toast("Added to Google Calendar");
      return;
    } catch (e) {
      const fallthrough = ["server_not_connected", "not_in_manifest", "not_granted", "capability_disabled", "capability_removed", "selection_required", "blocked_by_policy", "consent_required"];
      if (e?.code === "needs_reauth") { toast("Reconnect Google Calendar in claude.ai Settings → Connectors, then try again."); return; }
      if (e?.code === "approval_required") { toast("Google Calendar needs your approval for this page. Try again and choose Allow."); return; }
      if (!fallthrough.includes(e?.code)) { toast("Google Calendar didn't respond. Downloading a calendar file instead."); }
    }
  }
  const ok = await saveFile(`${app.company.replace(/[^\w]+/g, "-").toLowerCase()}-${round.type}.ics`, cal_ics(app, round), "text/calendar");
  if (ok) Apps.updateRound(appId, roundId, { calendar: "ics" });
}
function CalendarButton({ appId, round, size = "sm" }) {
  useCaps();
  if (!round?.at || round.at < now() - DAY) return null;
  const done = round.calendar;
  return html`<${Btn} size=${size} icon=${done ? "check" : "cal"} onClick=${(e) => { e.stopPropagation(); addToCalendar(appId, round.id); }} title=${caps.mcp ? "Adds the event to your Google Calendar" : "Downloads a calendar file you can open in any calendar app"}>${done ? "In calendar" : "Add to calendar"}</${Btn}>`;
}

/* --- js/views/zz-pool.js --- */
/* ===== Pooled reply data ("who actually replies") =====
   Storage: shared db, one document per contributor at pool/<viewer id> (rules: everyone reads, each writes only their own).
   Contents are coarse and anonymous: company, role category, level, week applied, furthest stage, outcome, days to first reply.
   No names, emails, titles, notes or resume text ever leave the browser. */
const POOL_MIN_APPS = 5, POOL_MIN_PEOPLE = 3;
const pool = { status: "idle", byCompany: {}, people: 0, apps: 0, canWrite: null, myId: null, lastShared: null, error: null };
const poolSubs = new Set();
function usePool() { const [v, setV] = useState({ ...pool }); useEffect(() => { const f = () => setV({ ...pool }); poolSubs.add(f); f(); return () => poolSubs.delete(f); }, []); return v; }
const poolEmit = () => poolSubs.forEach((f) => f());

function poolWeek(ts) { const d = new Date(ts); const y = d.getUTCFullYear(); const start = Date.UTC(y, 0, 1); return `${y}-W${String(Math.ceil(((ts - start) / DAY + 1) / 7)).padStart(2, "0")}`; }
function poolEntries(s = store.get()) {
  return Object.values(s.apps)
    .filter((a) => !a.example && a.appliedAt && a.stage !== "saved" && a.company)
    .map((a) => {
      const job = a.jobId ? jobsStore.byId.get(a.jobId) : null;
      const fr = firstReplyAt(a);
      const furthest = (a.events || []).reduce((m, e) => (e.to && STAGE[e.to] && STAGE[e.to].i > m && !["rejected", "ghosted"].includes(e.to) ? STAGE[e.to].i : m), STAGE.applied.i);
      return {
        co: a.company.trim().slice(0, 80), cat: job?.cat || "", lvl: job?.lvl || "", wk: poolWeek(a.appliedAt),
        reached: STAGES[Math.max(furthest, ["screen", "interview", "offer"].includes(a.stage) ? STAGE[a.stage].i : 0)].id,
        out: ["offer", "rejected", "ghosted"].includes(a.stage) ? a.stage : "open",
        rd: fr && fr > a.appliedAt ? Math.round((fr - a.appliedAt) / DAY) : null,
      };
    }).slice(0, 400);
}

async function poolLoad() {
  if (!caps.db) { pool.status = "unavailable"; poolEmit(); return; }
  pool.status = "loading"; poolEmit();
  try {
    if (caps.user) {
      try { pool.myId = await caps.user.id(); } catch {}
      try { const w = await caps.user.can("data.write"); pool.canWrite = w; } catch { pool.canWrite = null; }
    }
    const snap = await caps.db.collection("pool").limit(1000).get();
    const by = {}; let people = 0, apps = 0;
    for (const d of snap.docs) {
      const body = d.data(); if (!body || !Array.isArray(body.entries)) continue;
      people++;
      const seenCo = new Set();
      for (const e of body.entries) {
        if (!e || typeof e.co !== "string") continue;
        apps++;
        const k = norm(e.co);
        const c = by[k] || (by[k] = { name: e.co, n: 0, people: 0, replied: 0, ghosted: 0, rejected: 0, offers: 0, interviews: 0, rds: [] });
        c.n++;
        if (!seenCo.has(k)) { c.people++; seenCo.add(k); }
        if (e.rd != null || ["screen", "interview", "offer"].includes(e.reached) || e.out === "rejected") c.replied++;
        if (e.out === "ghosted") c.ghosted++;
        if (e.out === "rejected") c.rejected++;
        if (e.out === "offer") c.offers++;
        if (["interview", "offer"].includes(e.reached)) c.interviews++;
        if (typeof e.rd === "number" && e.rd >= 0 && e.rd < 365) c.rds.push(e.rd);
      }
      if (d.id === pool.myId) pool.lastShared = body.updatedAt || null;
    }
    Object.assign(pool, { status: "ready", byCompany: by, people, apps, error: null });
  } catch (e) {
    pool.status = "error"; pool.error = e?.code || "unavailable";
  }
  poolEmit();
}
function poolFor(company) {
  const c = pool.byCompany[norm(company || "")];
  if (!c) return null;
  const v = [...c.rds].sort((a, b) => a - b);
  const med = v.length ? (v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2) : null;
  return { ...c, enough: c.n >= POOL_MIN_APPS && c.people >= POOL_MIN_PEOPLE, replyRate: c.n ? c.replied / c.n : null, ghostRate: c.n ? c.ghosted / c.n : null, interviewRate: c.n ? c.interviews / c.n : null, medReply: med };
}
async function poolShare() {
  if (!caps.db || !pool.myId) { toast("Sharing needs a signed-in claude.ai account with access to this page."); return false; }
  const entries = poolEntries();
  try {
    await caps.db.doc(`pool/${pool.myId}`).set({ v: 1, updatedAt: now(), entries });
    store.set((s) => ({ ...s, settings: { ...s.settings, shareAnon: true, lastShared: now() } }));
    toast(`Shared ${pluralize(entries.length, "application")} anonymously. Thank you.`);
    poolLoad();
    return true;
  } catch (e) {
    if (e?.code === "invalid_argument") { pool.canWrite = false; poolEmit(); toast("This page is view-only for your account, so it can't save shared data."); }
    else if (e?.code === "quota_exceeded") toast("The shared data store is full right now. Your data is still safe in this browser.");
    else toast("Couldn't share right now. Try again in a minute.");
    return false;
  }
}
async function poolUnshare() {
  if (!caps.db || !pool.myId) return;
  try { await caps.db.doc(`pool/${pool.myId}`).delete(); store.set((s) => ({ ...s, settings: { ...s.settings, shareAnon: false, lastShared: null } })); toast("Removed your shared data"); poolLoad(); }
  catch { toast("Couldn't remove it right now. Try again in a minute."); }
}
/* Keep a contributor's pooled copy fresh: re-share at most every 6 hours while sharing is on. */
let poolAutoTimer = null;
store.sub((s) => {
  if (!s.settings.shareAnon || !caps.db || !pool.myId || pool.canWrite === false) return;
  if (s.settings.lastShared && now() - s.settings.lastShared < 6 * 3600000) return;
  clearTimeout(poolAutoTimer); poolAutoTimer = setTimeout(() => poolShare(), 4000);
});
capSubs.add(() => { if (caps.ready && pool.status === "idle") poolLoad(); });

/* ----- UI ----- */
function PoolCompanyCard({ company }) {
  const p = usePool();
  const c = poolFor(company);
  const head = html`<div class="card-head"><${Icon} name="reply" /><h3>Reply data from Heardback users</h3></div>`;
  if (p.status === "unavailable" || p.status === "error") {
    return html`<div class="card">${head}<div class="card-body stack-sm"><p class="muted" style="font-size:var(--fs-sm)">Reply data loads when you open Heardback on claude.ai while signed in.</p></div></div>`;
  }
  if (p.status !== "ready") return html`<div class="card">${head}<div class="card-body"><div class="skel" style="height:14px;width:60%"></div></div></div>`;
  if (!c || !c.enough) {
    return html`<div class="card">${head}<div class="card-body stack-sm">
      <p style="font-size:var(--fs-sm)"><strong>Not enough data yet.</strong> <span class="muted">We show reply rates once at least ${POOL_MIN_APPS} applications from ${POOL_MIN_PEOPLE} different people are shared${c ? `. So far: ${pluralize(c.n, "application")} from ${pluralize(c.people, "person", "people")}` : ""}.</span></p>
      <${PoolShareInline} />
    </div></div>`;
  }
  const rows = [["Got any reply", fmt.pct(c.replyRate)], ["Reached interviews", fmt.pct(c.interviewRate)], ["Ghosted", fmt.pct(c.ghostRate)], ["Median days to first reply", c.medReply == null ? "—" : `${Math.round(c.medReply)} days`]];
  return html`<div class="card">${head}<div class="card-body stack">
    <dl class="kv">${rows.map(([k, v]) => html`<dt>${k}</dt><dd class="num" style="font-weight:600">${v}</dd>`)}</dl>
    <span class="hint">Based on ${pluralize(c.n, "application")} shared anonymously by ${pluralize(c.people, "person", "people")}. Small samples can mislead.</span>
  </div></div>`;
}
function PoolShareInline() {
  const p = usePool();
  const s = useStore((s) => s.settings);
  if (p.canWrite === false) return html`<span class="hint">Your access to this page is view-only, so you can't add data here yet.</span>`;
  if (s.shareAnon) return html`<span class="hint">You're sharing anonymously. Thank you.</span>`;
  return html`<div class="row wrap"><${Btn} size="sm" icon="shield" onClick=${() => openModal("pool")}>Share my outcomes anonymously</${Btn}></div>`;
}
MODALS.pool = () => {
  const entries = poolEntries();
  const s = useStore((s) => s.settings);
  const p = usePool();
  return html`<${Modal} title="Share your outcomes anonymously" onClose=${closeModal} foot=${html`
    ${s.shareAnon && html`<${Btn} kind="ghost" cls="danger" onClick=${() => { poolUnshare(); closeModal(); }}>Stop sharing and remove</${Btn}>`}
    <span style="flex:1"></span>
    <${Btn} onClick=${closeModal}>Cancel</${Btn}>
    <${Btn} kind="primary" icon="shield" disabled=${!entries.length || p.canWrite === false || !caps.db} onClick=${async () => { if (await poolShare()) closeModal(); }}>${s.shareAnon ? "Update shared data" : `Share ${pluralize(entries.length, "application")}`}</${Btn}>`}>
    <p class="muted" style="font-size:var(--fs-sm)">Help other job seekers see which companies actually reply. Heardback pools outcomes and only shows a company's numbers once ${POOL_MIN_PEOPLE} or more people have shared.</p>
    <div class="callout"><${Icon} name="shield" /><div class="stack-sm">
      <strong style="color:var(--fg)">What's shared</strong>
      <span>Company name, role area, level, the week you applied, how far you got, the outcome, and days until the first reply.</span>
      <strong style="color:var(--fg); margin-top:6px">Never shared</strong>
      <span>Your name, email, resume, notes, contacts, job titles or exact dates. Example applications are never shared.</span>
    </div></div>
    ${!caps.db && html`<div class="callout wait"><${Icon} name="info" /><span>Sharing works when Heardback is open on claude.ai and you're signed in.</span></div>`}
    ${p.canWrite === false && html`<div class="callout wait"><${Icon} name="info" /><span>Your access to this page is view-only, so it can't save shared data. Your own tracking still works.</span></div>`}
    ${entries.length ? html`<div class="stack-sm"><span class="label">Preview (${entries.length})</span><div class="table-wrap card" style="max-height:220px;overflow:auto"><table class="table"><thead><tr><th>Company</th><th>Week</th><th>Reached</th><th>Outcome</th><th>Reply after</th></tr></thead><tbody>
      ${entries.slice(0, 50).map((e, i) => html`<tr key=${i} style="cursor:default"><td>${e.co}</td><td class="num">${e.wk}</td><td>${STAGE[e.reached]?.label}</td><td>${e.out === "open" ? "In progress" : STAGE[e.out]?.label}</td><td class="num">${e.rd == null ? "—" : e.rd + "d"}</td></tr>`)}
    </tbody></table></div></div>` : html`<p class="hint">You have no real applications to share yet. Example applications are never shared.</p>`}
  </${Modal}>`;
};
function PoolSettingsCard() {
  const p = usePool();
  const s = useStore((s) => s.settings);
  return html`<div class="card"><div class="card-head"><${Icon} name="shield" /><h3>Anonymous reply data</h3><span class="spacer"></span>${s.shareAnon ? html`<${Badge} kind="ok">Sharing</${Badge}>` : html`<${Badge}>Off</${Badge}>`}</div>
    <div class="card-body stack">
      <p class="muted" style="font-size:var(--fs-sm)">Share coarse, anonymous outcomes so everyone can see which companies reply. Nothing is shared unless you turn this on.${p.status === "ready" ? ` So far ${pluralize(p.apps, "application")} from ${pluralize(p.people, "person", "people")} are pooled.` : ""}</p>
      <div class="row wrap"><${Btn} icon="shield" onClick=${() => openModal("pool")}>${s.shareAnon ? "Review what's shared" : "Review and share"}</${Btn}>${s.lastShared && html`<span class="hint">Last updated ${fmt.ago(s.lastShared)}</span>`}</div>
    </div></div>`;
}
