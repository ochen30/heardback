<title>Heardback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Heardback: find real internship and new-grad jobs, spot ghost listings, and track every application and interview round.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (232px) + top bar + scrolling workspace; bottom tab bar under 760px.
   Identity: cool ink neutrals with a faint blue bias, one cobalt accent, semantic status hues kept apart from the accent. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --surface-3: #e8ebf0;
  --line: #e2e6ec;
  --line-strong: #cfd5de;
  --fg: #12161d;
  --fg-2: #4a5361;
  --fg-3: #626b79;
  --accent: #3150d6;
  --accent-hover: #2843bb;
  --accent-soft: #eaeefc;
  --accent-fg: #ffffff;
  --accent-text: #2a46c4;
  --ok: #1d7a4f;
  --ok-soft: #e5f4ec;
  --wait: #9a6100;
  --wait-soft: #fbf1dd;
  --bad: #c0352b;
  --bad-soft: #fbe9e7;
  --ghost: #6d6787;
  --ghost-soft: #eeedf4;
  --info: #2a6f9e;
  --info-soft: #e5f0f8;
  --shadow-float: 0 1px 2px rgba(18, 22, 29, .06), 0 8px 24px rgba(18, 22, 29, .10);
  --shadow-pop: 0 2px 4px rgba(18, 22, 29, .06), 0 16px 48px rgba(18, 22, 29, .16);
  --scrim: rgba(18, 22, 29, .32);
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);

  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 14px;
  --fs-lg: 17px;
  --fs-xl: 24px;

  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --rail: 232px;
  --top: 56px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-fast: 120ms;
  --t-med: 180ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --surface-3: #232830;
    --line: #262b33; --line-strong: #353c46;
    --fg: #e9ecf1; --fg-2: #aab2bf; --fg-3: #8a93a1;
    --accent: #6f8bff; --accent-hover: #8aa0ff; --accent-soft: #1c2440; --accent-fg: #0b1020; --accent-text: #93a8ff;
    --ok: #4cc38a; --ok-soft: #12291e; --wait: #e2a740; --wait-soft: #2b2112; --bad: #f0776c; --bad-soft: #2e1715;
    --ghost: #a59fc2; --ghost-soft: #221f2e; --info: #6cb4e6; --info-soft: #132433;
    --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
    --shadow-pop: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 48px rgba(0, 0, 0, .6);
    --scrim: rgba(0, 0, 0, .66);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #14171c; --surface-2: #1a1e24; --surface-3: #232830;
  --line: #262b33; --line-strong: #353c46;
  --fg: #e9ecf1; --fg-2: #aab2bf; --fg-3: #8a93a1;
  --accent: #6f8bff; --accent-hover: #8aa0ff; --accent-soft: #1c2440; --accent-fg: #0b1020; --accent-text: #93a8ff;
  --ok: #4cc38a; --ok-soft: #12291e; --wait: #e2a740; --wait-soft: #2b2112; --bad: #f0776c; --bad-soft: #2e1715;
  --ghost: #a59fc2; --ghost-soft: #221f2e; --info: #6cb4e6; --info-soft: #132433;
  --shadow-float: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .45);
  --shadow-pop: 0 2px 4px rgba(0, 0, 0, .4), 0 16px 48px rgba(0, 0, 0, .6);
  --scrim: rgba(0, 0, 0, .66);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--fs-md); line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01" on, "cv11" on;
  overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: var(--fs-xs); }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: var(--r-sm); }
::selection { background: var(--accent-soft); }

/* ---------- App frame ---------- */
#app { height: 100%; }
.frame { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); height: 100%; }
.rail {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px; min-height: 0;
  padding: 12px 10px 12px max(10px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.brand-name { font-weight: 650; font-size: var(--fs-lg); letter-spacing: -0.02em; }
.brand-mark { width: 26px; height: 26px; flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.nav-label { font-size: var(--fs-xs); color: var(--fg-3); padding: 6px 10px 4px; letter-spacing: .02em; }
.nav-item {
  display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 10px;
  border-radius: var(--r-md); color: var(--fg-2); font-weight: 500; border: 0; background: none; width: 100%; text-align: left;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); text-decoration: none; }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent-text); }
.nav-item[aria-current="page"] .ico { color: var(--accent-text); }
.nav-item .ico { color: var(--fg-3); }
.nav-count { margin-left: auto; font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.nav-item[aria-current="page"] .nav-count { color: var(--accent-text); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 4px 0; }
.goal-card { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.goal-top { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-sm); }
.meter { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width var(--t-med) var(--ease); }
.meter.ok > i { background: var(--ok); }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
.topbar {
  height: var(--top); flex: none; display: flex; align-items: center; gap: 12px;
  padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 20px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.top-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.015em; white-space: nowrap; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search-trigger {
  display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; min-width: 260px;
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); color: var(--fg-3);
  transition: border-color var(--t-fast);
}
.search-trigger:hover { border-color: var(--line-strong); }
.search-trigger .kbd { margin-left: auto; }
.workspace { flex: 1; min-height: 0; overflow: auto; scroll-behavior: smooth; }
.page { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
.page.wide { max-width: none; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: var(--fs-xl); letter-spacing: -0.025em; }
.page-head p { color: var(--fg-2); margin-top: 4px; }
.page-head .spacer { flex: 1; }
.bottom-nav { display: none; }
.example-banner {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 8px 8px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2);
  font-size: var(--fs-sm); color: var(--fg-2);
}
.example-banner b { color: var(--fg); font-weight: 600; }
.example-banner .spacer { flex: 1; }

/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--fg); font-weight: 500; font-size: var(--fs-sm); white-space: nowrap;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), color var(--t-fast);
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:active { transform: translateY(0.5px); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--bad); }
.btn.primary.danger-solid { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.primary.danger-solid:hover { filter: brightness(.94); background: var(--bad); }
.btn.sm { height: 28px; padding: 0 9px; font-size: var(--fs-xs); border-radius: var(--r-sm); }
.btn.icon { width: 34px; padding: 0; }
.btn.sm.icon { width: 28px; }
.btn.block { width: 100%; }
.btn .kbd { margin-left: 4px; }
.kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px;
  border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface);
  font-family: var(--mono); font-size: 11px; color: var(--fg-3); line-height: 1;
}
.btn.primary .kbd { background: transparent; border-color: rgba(255,255,255,.35); color: inherit; opacity: .85; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: var(--fs-sm); font-weight: 500; color: var(--fg); }
.hint { font-size: var(--fs-xs); color: var(--fg-3); }
.input, .select, .textarea {
  width: 100%; min-height: 34px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-md);
  background: var(--surface); color: var(--fg); font-size: var(--fs-sm);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--fg-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.textarea { resize: vertical; line-height: 1.5; min-height: 96px; }
.select { appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.input-icon { position: relative; display: flex; align-items: center; }
.input-icon .ico { position: absolute; left: 10px; color: var(--fg-3); pointer-events: none; }
.input-icon .input { padding-left: 32px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-sm); cursor: pointer; min-height: 28px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-strong); transition: background var(--t-fast); pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform var(--t-med) var(--ease); }
.switch input:checked + i { background: var(--accent); border-color: var(--accent); }
.switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i { box-shadow: var(--focus); }

.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); gap: 2px; }
.seg button { height: 28px; padding: 0 10px; border: 0; background: transparent; border-radius: 6px; font-size: var(--fs-sm); color: var(--fg-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(18,22,29,.08), 0 0 0 1px var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px;
  border: 1px solid var(--line-strong); background: var(--surface); font-size: var(--fs-sm); color: var(--fg-2); font-weight: 500;
  transition: all var(--t-fast) var(--ease);
}
.chip:hover { border-color: var(--fg-3); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }

/* ---------- Badges & status ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px;
  font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); border: 1px solid transparent;
  font-variant-numeric: tabular-nums;
}
.badge.outline { background: transparent; border-color: var(--line-strong); }
.badge.accent { background: var(--accent-soft); color: var(--accent-text); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.wait { background: var(--wait-soft); color: var(--wait); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.ghost { background: var(--ghost-soft); color: var(--ghost); }
.badge.info { background: var(--info-soft); color: var(--info); }
.badge.example { background: transparent; border: 1px solid var(--line-strong); color: var(--fg-3); display: none; }
.drawer-head .badge.example { display: inline-flex; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-3); }
.dot.saved { background: var(--fg-3); }
.dot.applied { background: var(--accent); }
.dot.screen { background: var(--info); }
.dot.interview { background: var(--wait); }
.dot.offer { background: var(--ok); }
.dot.rejected { background: var(--bad); }
.dot.ghosted { background: var(--ghost); }
.logo {
  width: 32px; height: 32px; flex: none; border-radius: var(--r-md); display: grid; place-items: center;
  font-weight: 600; font-size: var(--fs-sm); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line);
  letter-spacing: -0.02em;
}
.logo.lg { width: 48px; height: 48px; font-size: var(--fs-lg); border-radius: var(--r-lg); }
.logo.sm { width: 24px; height: 24px; font-size: 11px; border-radius: var(--r-sm); }

/* ghost meter */
.gscore { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.gbars { display: inline-flex; gap: 2px; align-items: flex-end; }
.gbars i { width: 3px; border-radius: 1px; background: var(--surface-3); }
.gbars i:nth-child(1) { height: 6px; } .gbars i:nth-child(2) { height: 9px; } .gbars i:nth-child(3) { height: 12px; }
.gscore.low { color: var(--ok); } .gscore.low .gbars i:nth-child(1) { background: var(--ok); }
.gscore.mid { color: var(--wait); } .gscore.mid .gbars i:nth-child(-n+2) { background: var(--wait); }
.gscore.high { color: var(--bad); } .gscore.high .gbars i { background: var(--bad); }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.card-pad { padding: 16px; }
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { font-size: var(--fs-md); font-weight: 600; }
.card-head .spacer { flex: 1; }
.card-body { padding: 16px; }
.section-title { font-size: var(--fs-md); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.section-title .count { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row .spacer { flex: 1; }
.divider { height: 1px; background: var(--line); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.stat { display: flex; flex-direction: column; gap: 4px; padding: 16px; min-width: 0; }
.stat-label { font-size: var(--fs-sm); color: var(--fg-2); }
.stat-value { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-sub { font-size: var(--fs-xs); color: var(--fg-3); }
.stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stats-row > .stat + .stat { border-left: 1px solid var(--line); }

/* table */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-sm); }
.table th { text-align: left; font-weight: 500; color: var(--fg-3); font-size: var(--fs-xs); padding: 0 12px; height: 36px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.table th button { border: 0; background: none; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 4px; align-items: center; }
.table td { padding: 0 12px; height: 48px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr { transition: background var(--t-fast); cursor: pointer; }
.table tbody tr:hover { background: var(--surface-2); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tr[aria-selected="true"] { background: var(--accent-soft); }

/* empty, skeleton */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 48px 24px; }
.empty .empty-ico { width: 44px; height: 44px; border-radius: var(--r-lg); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line); }
.empty h3 { font-size: var(--fs-md); }
.empty p { color: var(--fg-2); max-width: 42ch; font-size: var(--fs-sm); }
.skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-sm); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade var(--t-med) var(--ease); }
.scrim.modal-scrim { z-index: 50; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal {
  position: fixed; z-index: 51; left: 50%; top: 12vh; transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px)); max-height: 76vh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop);
  animation: rise var(--t-med) var(--ease);
}
.modal.lg { width: min(760px, calc(100vw - 32px)); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; }
.modal-head h2 { font-size: var(--fs-lg); }
.modal-head .spacer { flex: 1; }
.modal-body { padding: 4px 18px 18px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
.drawer {
  position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-pop);
  display: flex; flex-direction: column; animation: slide var(--t-med) var(--ease);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-body { flex: 1; overflow: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 20px; }
.drawer-foot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.menu { position: fixed; z-index: 60; min-width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-float); padding: 4px; animation: rise var(--t-fast) var(--ease); }
.menu button { display: flex; width: 100%; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; background: none; border-radius: var(--r-sm); font-size: var(--fs-sm); text-align: left; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); box-shadow: none; }

/* command palette */
.palette { top: 14vh; width: min(620px, calc(100vw - 32px)); max-height: 64vh; overflow: hidden; }
.palette-input { display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; border-bottom: 1px solid var(--line); }
.palette-input input { flex: 1; border: 0; background: none; outline: none; font-size: var(--fs-lg); min-width: 0; }
.palette-list { overflow: auto; padding: 6px; }
.palette-group { font-size: var(--fs-xs); color: var(--fg-3); padding: 10px 10px 4px; }
.palette-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 6px 10px; border: 0; background: none; border-radius: var(--r-md); text-align: left; font-size: var(--fs-sm); }
.palette-item[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-text); }
.palette-item .sub { color: var(--fg-3); font-size: var(--fs-xs); }
.palette-item[aria-selected="true"] .sub { color: var(--accent-text); opacity: .8; }
.palette-foot { display: flex; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--line); font-size: var(--fs-xs); color: var(--fg-3); }

/* toast */
.toasts { position: fixed; z-index: 70; bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); left: calc(var(--rail) + 24px); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; background: var(--fg); color: var(--bg); border-radius: var(--r-md); box-shadow: var(--shadow-float); font-size: var(--fs-sm); animation: rise var(--t-med) var(--ease); max-width: calc(100vw - 32px); }
.toast button { border: 0; background: none; color: inherit; font-weight: 600; opacity: .85; padding: 2px 6px; border-radius: 4px; }
.toast button:hover { opacity: 1; }
.toast .ico { flex: none; }

/* ---------- Find ---------- */
.find-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; }
.filters { position: sticky; top: 0; display: flex; flex-direction: column; gap: 18px; }
.filter-group { display: flex; flex-direction: column; gap: 8px; }
.filter-group h4 { font-size: var(--fs-xs); font-weight: 500; color: var(--fg-3); letter-spacing: .02em; }
.job-row {
  display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 16px; cursor: pointer; transition: background var(--t-fast);
  background: var(--surface);
}
.job-row:hover { background: var(--surface-2); }
.job-row[aria-selected="true"] { background: var(--accent-soft); }
.job-title { font-weight: 500; color: var(--fg); }
.job-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; color: var(--fg-2); font-size: var(--fs-sm); min-width: 0; }
.job-meta .sep { color: var(--line-strong); }
.job-side { display: flex; align-items: center; gap: 10px; }
.fresh { font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fresh.new { color: var(--ok); font-weight: 500; }
.fit { font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--fg-2); min-width: 40px; text-align: center; }
.fit.hi { background: var(--accent-soft); color: var(--accent-text); }

/* ---------- Pipeline ---------- */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; min-height: 420px; align-items: start; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); display: flex; flex-direction: column; min-height: 160px; transition: border-color var(--t-fast), background var(--t-fast); }
.col.drop { border-color: var(--accent); background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px; font-weight: 600; font-size: var(--fs-sm); }
.col-head .count { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.col-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 10px; min-height: 60px; }
.app-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  cursor: grab; transition: box-shadow var(--t-fast), border-color var(--t-fast), transform var(--t-fast);
}
.app-card:hover { border-color: var(--line-strong); box-shadow: 0 1px 2px rgba(18,22,29,.06); }
.app-card.dragging { opacity: .45; }
.app-card:focus-visible { box-shadow: var(--focus); }
.app-card-top { display: flex; gap: 10px; align-items: flex-start; }
.app-card-title { font-weight: 500; font-size: var(--fs-sm); line-height: 1.35; }
.app-card-co { font-size: var(--fs-xs); color: var(--fg-2); }
.app-card-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--fg-3); }

/* timeline */
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; }
.tl-item { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; }
.tl-item::before { content: ""; position: absolute; left: 9px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
.tl-item:last-child::before { display: none; }
.tl-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg-3); }
.tl-text { font-size: var(--fs-sm); }
.tl-when { font-size: var(--fs-xs); color: var(--fg-3); }

/* rounds */
.round { border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.round-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stage-steps { display: flex; gap: 4px; }
.stage-steps button { flex: 1; height: 6px; border-radius: 99px; border: 0; background: var(--surface-3); padding: 0; }
.stage-steps button.on { background: var(--accent); }

/* today */
.task { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; }
.task-ico { width: 28px; height: 28px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--surface-2); color: var(--fg-2); }
.task-ico.wait { background: var(--wait-soft); color: var(--wait); }
.task-ico.accent { background: var(--accent-soft); color: var(--accent-text); }
.task-ico.ok { background: var(--ok-soft); color: var(--ok); }
.task-ico.ghost { background: var(--ghost-soft); color: var(--ghost); }
.task-ico.bad { background: var(--bad-soft); color: var(--bad); }
.task-title { font-size: var(--fs-sm); font-weight: 500; }
.task-sub { font-size: var(--fs-xs); color: var(--fg-2); }
.task-actions { display: flex; gap: 6px; }
.greeting h1 { font-size: var(--fs-xl); letter-spacing: -0.025em; }
.greeting p { color: var(--fg-2); margin-top: 4px; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--fg-3); font-size: 11px; font-family: var(--font); }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.funnel-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) 72px; gap: 12px; align-items: center; font-size: var(--fs-sm); }
.funnel-bar { height: 26px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.funnel-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; transition: width var(--t-med) var(--ease); }

/* onboarding */
.onboard-wrap { position: fixed; inset: 0; z-index: 45; background: var(--bg); overflow: auto; display: flex; justify-content: center; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.onboard { width: min(600px, 100%); display: flex; flex-direction: column; gap: 24px; }
.onboard-steps { display: flex; gap: 6px; }
.onboard-steps i { flex: 1; height: 4px; border-radius: 99px; background: var(--surface-3); }
.onboard-steps i.on { background: var(--accent); }
.onboard h1 { font-size: var(--fs-xl); letter-spacing: -0.025em; }
.onboard .lede { color: var(--fg-2); font-size: var(--fs-md); margin-top: 6px; }

/* misc */
.ai-box { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); padding: 12px 14px; font-size: var(--fs-sm); white-space: pre-wrap; line-height: 1.6; }
.ai-label { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--fg-3); }
.reason-list { display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); }
.reason-list li { display: flex; gap: 8px; align-items: flex-start; }
.reason-list ul, ul.reason-list { list-style: none; margin: 0; padding: 0; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 16px; font-size: var(--fs-sm); }
.kv dt { color: var(--fg-3); }
.kv dd { margin: 0; min-width: 0; }
.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); color: var(--fg-2); border: 1px solid var(--line); }
.callout.info { background: var(--info-soft); border-color: transparent; color: var(--fg); }
.callout.wait { background: var(--wait-soft); border-color: transparent; color: var(--fg); }
.callout .ico { flex: none; margin-top: 2px; }
.footer-note { font-size: var(--fs-xs); color: var(--fg-3); text-align: center; padding: 8px 16px 24px; }
.celebrate { position: fixed; inset: 0; pointer-events: none; z-index: 80; display: grid; place-items: center; }
.celebrate-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 22px 26px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; animation: rise 240ms var(--ease); }
.celebrate-ring { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
.ico { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }
.ico.lg { width: 20px; height: 20px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .find-layout { grid-template-columns: minmax(0, 1fr); }
  .filters { position: static; }
  .cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats-row > .stat:nth-child(3) { border-left: 0; }
  .stats-row > .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .search-trigger { min-width: 0; }
  .search-trigger .label-text, .search-trigger .kbd { display: none; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); flex: none; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .bottom-nav button { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--fg-3); font-size: 11px; font-weight: 500; }
  .bottom-nav button[aria-current="page"] { color: var(--accent-text); }
  .topbar { padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .page { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 18px; }
  .cols-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }
  .drawer { width: 100vw; border-left: 0; }
  .kv { grid-template-columns: 110px minmax(0, 1fr); }
  .hide-sm { display: none !important; }
  .toasts { bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  .modal { top: auto; bottom: 0; transform: translateX(-50%); width: 100vw; border-radius: var(--r-lg) var(--r-lg) 0 0; max-height: 88vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .palette { top: 8px; bottom: auto; border-radius: var(--r-lg); width: calc(100vw - 16px); }
}
@media (max-width: 520px) {
  .cols-4 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .job-row { grid-template-columns: 32px minmax(0, 1fr); }
  .job-side { grid-column: 2; justify-content: flex-start; }
  .top-title { font-size: var(--fs-md); }
  .funnel-row { grid-template-columns: 84px minmax(0, 1fr) 56px; }
  .btn { min-height: 36px; }
  .nav-item, .chip { min-height: 36px; }
}
@media (min-width: 861px) { .show-sm { display: none !important; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

.drawer:focus, .drawer:focus-visible, .modal:focus, .modal:focus-visible { outline: none; box-shadow: var(--shadow-pop); }
.switch i::after { background: #fff; }
.logo { background: var(--surface-2); color: var(--fg-2); }
.chip { border-color: var(--line); }
.chip[aria-pressed="true"] { border-color: var(--accent); }
.chip[aria-pressed="true"] .ico { color: var(--accent-text); }
.example-banner { max-width: 100%; }
@media (min-width: 861px) { .top-title { display: none; } }
@media (max-width: 860px) {
  .page-head h1 { display: none; }
  .toasts { left: 50%; transform: translateX(-50%); align-items: center; }
  .toasts.over-drawer { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .drawer { border-left-color: var(--line-strong); } :root:not([data-theme="light"]) .switch i::after { background: #c9ced6; } :root:not([data-theme="light"]) .switch input:checked + i::after { background: #fff; } }
:root[data-theme="dark"] .drawer { border-left-color: var(--line-strong); }
:root[data-theme="dark"] .switch i::after { background: #c9ced6; }
:root[data-theme="dark"] .switch input:checked + i::after { background: #fff; }
/* Underline tabs (navigation inside drawers/pages) */
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { position: relative; height: 38px; padding: 0 2px; border: 0; background: none; color: var(--fg-2); font-weight: 500; font-size: var(--fs-sm); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.tabs .count { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
/* Drawer sections (instead of cards inside drawers) */
.dsec { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.dsec:first-child { border-top: 0; padding-top: 0; }
.dsec > h3 { font-size: var(--fs-sm); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dsec > h3 .spacer { flex: 1; }

/* v4 core polish */
.toast { background: var(--fg); color: var(--bg); white-space: nowrap; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: var(--surface-3); color: var(--fg); border: 1px solid var(--line-strong); } }
:root[data-theme="dark"] .toast { background: var(--surface-3); color: var(--fg); border: 1px solid var(--line-strong); }
@media (min-width: 861px) {
  .toasts { left: auto; right: 24px; align-items: flex-end; }
  .toasts.over-drawer { right: calc(min(560px, 100vw) + 24px); }
}
@media (max-width: 860px) {
  .toasts.over-drawer { top: auto; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .toast { max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
}
.palette-input input:focus, .palette-input input:focus-visible { box-shadow: none; outline: none; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
.btn.primary .kbd { border-color: color-mix(in srgb, currentColor 35%, transparent); }
/* Custom checkbox: consistent in both themes */
input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; flex: none; border: 1.5px solid var(--line-strong); border-radius: 4px; background: var(--surface); display: inline-grid; place-content: center; cursor: pointer; transition: background var(--t-fast), border-color var(--t-fast); }
input[type="checkbox"]:hover { border-color: var(--fg-3); }
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after { content: ""; width: 8px; height: 4.5px; border: 2px solid var(--accent-fg); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.switch input[type="checkbox"] { width: 100%; height: 100%; border: 0; background: transparent; opacity: 0; }
.switch input[type="checkbox"]::after { display: none; }
input[type="radio"] { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; flex: none; border: 1.5px solid var(--line-strong); border-radius: 50%; background: var(--surface); display: inline-grid; place-content: center; cursor: pointer; }
input[type="radio"]:hover { border-color: var(--fg-3); }
input[type="radio"]:checked { border-color: var(--accent); }
input[type="radio"]:checked::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.meth-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.meth-bar i { display: block; min-width: 2px; }
.meth-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--fs-xs); color: var(--fg-2); }
.meth-legend span { display: inline-flex; align-items: center; gap: 6px; }
.meth-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.meth-table td { vertical-align: top; padding-block: 10px; height: auto; }
.modal-body > * { flex-shrink: 0; }

/* ===== Find jobs, job drawer, companies, company drawer ===== */
.find-page { gap: 20px; }
.find-aside { top: 16px; max-height: calc(100vh - var(--top) - 32px); overflow-y: auto; padding: 2px 4px 8px 2px; margin: -2px 0 0 -2px; scrollbar-width: thin; }
.find-fgroups { display: flex; flex-direction: column; gap: 20px; }
.find-fgroups .filter-group h4 { margin: 0; }
.find-fgroups .seg { align-self: flex-start; }
.find-fgroups .hint { line-height: 1.4; }
.chip .find-chip-n { font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; font-weight: 400; }
.chip[aria-pressed="true"] .find-chip-n { color: var(--accent-text); opacity: .75; }
.find-chip:disabled { opacity: .45; cursor: default; pointer-events: none; }
.find-fgroups .chips { gap: 6px; }
.find-fgroups .chip { height: 28px; padding: 0 10px; font-size: var(--fs-sm); }
.find-fgroups .filter-group h4 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.find-h-clear { font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0; }
/* compact checkbox / radio list */
.find-opts { display: flex; flex-direction: column; margin: 0 -8px; }
.find-opt { display: flex; align-items: center; gap: 10px; min-height: 30px; padding: 0 8px; border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-sm); color: var(--fg-2); }
.find-opt:hover { background: var(--surface-2); color: var(--fg); }
.find-opt input { width: 15px; height: 15px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
.find-opt input:checked ~ .find-opt-l { color: var(--fg); font-weight: 500; }
.find-opt-l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.find-opt-n { font-size: var(--fs-xs); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.find-opt:has(input:focus-visible) { box-shadow: 0 0 0 2px var(--accent); }
.find-more-link { align-self: flex-start; font-size: var(--fs-sm); }

/* toolbar */
.find-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.find-search { flex: 1; min-width: 200px; }
.find-search .input { height: 40px; font-size: var(--fs-md); padding-right: 36px; }
.find-search .input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; display: none; }
.find-search .find-qclear { position: absolute; right: 4px; width: 32px; height: 32px; color: var(--fg-3); }
.find-search .find-qclear:hover { color: var(--fg); }
.find-search .find-qclear .ico { position: static; }
.find-kbd { position: absolute; right: 10px; pointer-events: none; }
.find-fbtn { display: none; height: 40px; }
.find-fcount { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: var(--accent-fg); font-size: var(--fs-xs); font-weight: 600; }
.find-bar { display: flex; align-items: center; gap: 12px; min-height: 34px; flex-wrap: wrap; }
.find-bar .spacer { flex: 1; }
.find-count { font-size: var(--fs-sm); color: var(--fg-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.find-count strong { color: var(--fg); font-weight: 600; }
.find-prefs { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-3); }
.find-prefs .sep { color: var(--line-strong); }
.find-dsub .sep { color: var(--fg-3); }
.find-link { border: 0; background: none; padding: 0; color: var(--accent-text); font-size: inherit; font-weight: 500; cursor: pointer; }
.find-link:hover { text-decoration: underline; text-underline-offset: 2px; }
.find-sort-sm { width: auto; min-width: 150px; }

/* results */
.find-results { overflow: hidden; }
.find-row { min-height: 64px; }
.find-row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.find-row-title {
  display: block; max-width: 100%; border: 0; background: none; padding: 0; text-align: left; color: var(--fg);
  font-weight: 500; font-size: var(--fs-md); line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer;
}
.find-row-meta { font-size: var(--fs-sm); color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.4; }
/* Ghost column auto-sizes (empty when risk is low); the action column only widens when a row shows a stage badge. */
.find-side { display: grid; grid-template-columns: auto 60px 84px 36px; align-items: center; gap: 8px; justify-items: end; }
.find-has-stage .find-side { grid-template-columns: auto 60px 84px 92px; }
.find-c-ghost { grid-column: 1; } .find-c-fit { grid-column: 2; } .find-c-fresh { grid-column: 3; } .find-c-act { grid-column: 4; }
.find-c-ghost:empty { display: none; }
.find-c-fit, .find-c-ghost, .find-c-fresh, .find-c-act { display: inline-flex; align-items: center; justify-content: flex-end; }
.find-c-fit .fit { min-width: 56px; white-space: nowrap; }
.find-c-fresh .fresh { text-align: right; }
.find-save.on { color: var(--accent-text); }
.find-stage { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 99px; }
.find-more { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 0; font-size: var(--fs-sm); flex-wrap: wrap; }
.find-keys { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-xs); color: var(--fg-3); }
.find-keys .kbd + .kbd { margin-left: -2px; }
.find-keys .kbd { margin-left: 6px; }
.find-foot { padding-top: 0; }
.find-row-co { grid-template-columns: minmax(0, 1fr) auto; }
.find-results-tight .find-side { grid-template-columns: auto 60px 64px 36px; }
.find-results-tight .find-c-act .badge { display: none; }

/* drawer */
.find-dhead { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: flex-start; }
.find-dtitle { font-size: var(--fs-lg); line-height: 1.3; letter-spacing: -0.015em; }
.find-dsub { font-size: var(--fs-sm); gap: 6px; }
.find-co { font-size: var(--fs-sm); }
.find-ext { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); }
.find-kv { grid-template-columns: 120px minmax(0, 1fr); row-gap: 10px; }
.find-locs { display: flex; flex-direction: column; gap: 2px; }
.find-small { font-size: var(--fs-sm); }
.find-h-meta { font-weight: 500; font-size: var(--fs-xs); }
button.find-h-meta { font-size: var(--fs-sm); }
.dsec > h3 .count { color: var(--fg-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.find-applied-q { margin-bottom: -4px; }
/* listing check */
.find-gline { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--fg); }
.find-gline .gscore { flex: none; }
.find-reasons { padding-left: 18px !important; list-style: disc !important; color: var(--fg-2); gap: 4px; }
.find-reasons li { display: list-item; }
.find-details { font-size: var(--fs-sm); }
.find-details summary { cursor: pointer; color: var(--fg-3); font-size: var(--fs-xs); font-weight: 500; width: max-content; max-width: 100%; border-radius: var(--r-sm); list-style: none; display: inline-flex; align-items: center; gap: 4px; }
.find-details summary::-webkit-details-marker { display: none; }
.find-details summary::after { content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); margin-left: 2px; transition: transform var(--t-fast); }
.find-details[open] summary::after { transform: rotate(45deg); margin-top: -3px; }
.find-details summary:hover { color: var(--fg); }
.find-details-body { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; color: var(--fg-2); line-height: 1.55; }
.find-rubric { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--fg-2); }
.find-rubric b { color: var(--fg); font-weight: 500; }
/* fit */
.find-fit-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-sm); }
.find-fit-list li { display: grid; grid-template-columns: 20px 72px minmax(0, 1fr); gap: 8px; align-items: start; }
.find-fit-k { color: var(--fg); font-weight: 500; }
.find-fit-ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; }
.find-fit-ico.ok { background: var(--ok-soft); color: var(--ok); }
.find-fit-ico.bad { background: var(--bad-soft); color: var(--bad); }
.find-fit-ico.none { background: var(--surface-2); color: var(--fg-3); font-size: var(--fs-xs); }
.find-fit-list + .stack-sm { margin-top: 4px; }
.find-season-line { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; line-height: 1.5; }
a.find-link { cursor: pointer; }
.find-dsub-co { column-gap: 14px; }

/* Claude blocks */
.find-jd { min-height: 72px; }
.find-think { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); }
.find-pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: find-pulse 1.2s var(--ease) infinite; }
@keyframes find-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
.find-ai-out { display: flex; flex-direction: column; gap: 10px; }
.find-yn { gap: 16px; }
.find-yn-h { font-size: var(--fs-xs); font-weight: 600; color: var(--fg-2); margin-bottom: 6px; }
.find-yn .reason-list li { display: list-item; margin-left: 16px; list-style: disc; color: var(--fg-2); }
.find-yn ul.reason-list { list-style: disc; }
.find-bullets { display: flex; flex-direction: column; }
.find-bullet { padding: 10px 0; display: flex; flex-direction: column; gap: 4px; }
.find-bullet + .find-bullet { border-top: 1px solid var(--line); }
.find-bullet:first-child { padding-top: 0; }
.find-bullet-row { display: flex; align-items: flex-start; gap: 8px; }
.find-bullet-from { font-size: var(--fs-xs); color: var(--fg-3); line-height: 1.45; }
.dsec > h3 .find-h-btn { margin: -6px -8px -6px 0; }
.find-bullet-to { flex: 1; font-size: var(--fs-sm); color: var(--fg); }
.find-brief { font-size: var(--fs-sm); line-height: 1.6; color: var(--fg); display: flex; flex-direction: column; gap: 6px; }
.find-brief .reason-list { color: var(--fg); }
.find-brief-pre { white-space: pre-wrap; display: block; }
.find-brief-cta { gap: 12px; }

/* company drawer */
.find-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 16px; }
.find-stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.find-stat .stat-label { font-size: var(--fs-xs); color: var(--fg-3); }
.find-stat-v { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
.find-nd { font-size: var(--fs-sm); font-weight: 500; }
.find-stat-v:has(.find-nd) { display: flex; align-items: center; min-height: calc(var(--fs-lg) * 1.3); }
.find-stat .stat-sub { line-height: 1.4; }
.find-season-nums { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--fs-sm); justify-content: space-between; }
.find-dlist { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -20px; }
.find-dlist .job-row { padding-left: 20px; padding-right: 20px; }
.find-applink, .find-corow {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%;
  padding: 10px 16px; min-height: 56px; border: 0; background: var(--surface); text-align: left; cursor: pointer; transition: background var(--t-fast);
}
.find-dlist .find-applink { padding: 10px 20px; background: transparent; }
.find-applink:hover, .find-corow:hover { background: var(--surface-2); }
.find-corow { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; }

/* companies table */
.find-cotable th.r, .find-cotable td.r { text-align: right; }
.find-cotable td:first-child { max-width: 320px; }
.find-coname { font-weight: 500; }
.find-cotable tbody tr:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 0; }
.find-split { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); }
.find-split-bar { width: 56px; height: 6px; border-radius: 99px; background: var(--info-soft); overflow: hidden; flex: none; }
.find-split-bar i { display: block; height: 100%; background: var(--accent); }
.find-th-help { display: inline-flex; align-items: center; gap: 4px; cursor: help; }
.find-th-help .ico { color: var(--fg-3); opacity: .7; }
.find-gshare { color: var(--fg-2); }
.find-gshare.mid { color: var(--wait); }
.find-gshare.high { color: var(--bad); }

@media (max-width: 1100px) {
  .find-aside { display: none; }
  .find-fbtn { display: inline-flex; }
}
@media (max-width: 860px) {
  .find-kv { grid-template-columns: 110px minmax(0, 1fr); }
  .find-yn { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .find-search { min-width: 0; }
  .find-co-toolbar .find-search { flex-basis: 100%; }
  .find-co-toolbar .find-sort-sm { width: 100%; }
  .find-row { align-items: start; padding: 12px 16px; row-gap: 6px; }
  /* one calm row so the primary CTA sits clear of toasts */
  .drawer-foot:has(.find-apply) { flex-wrap: nowrap; gap: 8px; }
  .drawer-foot:has(.find-apply) > .btn { height: 44px; flex: none; }
  .drawer-foot:has(.find-apply) > .find-apply { flex: 1 1 auto; min-width: 0; justify-content: center; }
  .find-row-co { grid-template-columns: minmax(0, 1fr); }
  .find-row-co .find-side { grid-column: 1; }
  .find-row-title { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .find-row-meta { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .find-side { grid-column: 2; display: flex; justify-content: flex-start; gap: 10px; flex-wrap: wrap; }
  .find-c-fit:empty { display: none; }
  .find-c-act { margin-left: auto; }
  .find-c-act .btn.sm.icon { width: 36px; height: 36px; }
  .find-c-fit .fit { min-width: 0; }
  .find-stats { gap: 12px; }
  .find-stat-v { font-size: var(--fs-md); }
  .find-dhead .logo { display: none; }
  .find-c-ghost:empty { display: none; }
}

/* ===== Pipeline ===== */
.pl-page.wide { max-width: 1680px; }
.pl-head { align-items: flex-end; }
.pl-head-title p { font-size: var(--fs-sm); }
.pl-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pl-filter { width: 240px; }
.pl-filter .input { height: 34px; }
.pl-filter input::-webkit-search-cancel-button { cursor: pointer; }
.pl-linkbtn { border: 0; background: none; padding: 0; color: var(--accent-text); font: inherit; font-weight: 500; cursor: pointer; }
.pl-linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
.pl-small { font-size: var(--fs-xs); }
.pl-sep { color: var(--line-strong); }
.pl-warn { color: var(--wait); font-weight: 600; }
.pl-err { font-size: var(--fs-xs); color: var(--bad); }
.input[aria-invalid="true"] { border-color: var(--bad); }
.input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px var(--bad-soft); }
.pl-eyebrow { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; letter-spacing: .02em; }

/* Board */
.pl-board {
  display: flex; gap: 10px; align-items: flex-start; overflow-x: auto; overscroll-behavior-x: contain;
  min-height: 0; padding-bottom: 10px; scroll-padding-inline: 2px;
}
.pl-col { flex: 1 1 0; min-width: 200px; max-width: 340px; min-height: 0; align-self: flex-start; }
.pl-col .col-head { min-height: 44px; padding: 10px 8px 6px 12px; }
.pl-col .col-head .spacer { flex: 1; }
.pl-col .col-body { padding: 2px 8px 8px; gap: 8px; min-height: 0; }
.pl-col-closed .col-head { color: var(--fg-2); }
.pl-col-hide { color: var(--fg-3); }
.pl-col-empty {
  min-height: 56px; display: grid; place-items: center; text-align: center; padding: 10px 12px;
  border: 1px solid transparent; border-radius: var(--r-md); color: var(--fg-3); font-size: var(--fs-xs);
}
.pl-col-empty.dz { border: 1px dashed var(--line-strong); }
.col.drop .pl-col-empty { border-color: var(--accent); color: var(--accent-text); }
.pl-rail {
  flex: none; width: 44px; align-self: flex-start; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0 12px;
  border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface-2); color: var(--fg-2);
  transition: border-color var(--t-fast), background var(--t-fast);
}
button.pl-rail:hover { border-color: var(--line-strong); color: var(--fg); }
.pl-rail .ico { color: var(--fg-3); }
.pl-rail-count { font-size: var(--fs-xs); color: var(--fg-3); font-weight: 500; }
.pl-rail-label { writing-mode: vertical-rl; font-size: var(--fs-sm); font-weight: 600; letter-spacing: .01em; }
.pl-rail.dragging { width: 112px; padding: 8px; }
.pl-drop-pair { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.pl-drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 88px; padding: 8px;
  border: 1px dashed var(--line-strong); border-radius: var(--r-md); font-size: var(--fs-xs); font-weight: 500; color: var(--fg-2); background: var(--surface);
}
.pl-col-closed .pl-drop-pair { flex-direction: row; }
.pl-col-closed .pl-drop { flex: 1; min-height: 64px; }
.pl-drop.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); }

.pl-card { position: relative; gap: 4px; padding: 10px 10px 10px 12px; user-select: none; -webkit-user-select: none; }
.pl-card:active { cursor: grabbing; }
.pl-card:focus-visible { border-color: var(--accent); }
.pl-card.closed { opacity: .82; }
.pl-card.closed:hover, .pl-card.closed:focus-visible { opacity: 1; }
.pl-card-top { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 2px; }
.pl-card-co { flex: 1; font-size: var(--fs-xs); color: var(--fg-2); font-weight: 500; }
.pl-card-title {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  color: var(--fg); overflow-wrap: anywhere;
}
.pl-card-loc { font-size: var(--fs-xs); color: var(--fg-3); }
.pl-card-foot { flex-wrap: nowrap; min-height: 22px; padding-top: 8px; border-top: 1px solid var(--line); margin-top: 6px; min-width: 0; }
.pl-status { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl-status .truncate { min-width: 0; }
.pl-status-main { flex: none; }
.pl-status-dot { flex: none; margin-inline: -2px; color: var(--fg-3); font-weight: 400; }
.pl-status-extra { color: var(--fg-2); font-weight: 400; }
.pl-status .ico { flex: none; }
.pl-status.accent { color: var(--fg); font-weight: 500; }
.pl-status.accent .ico { color: var(--accent-text); }
.pl-status.wait { color: var(--wait); font-weight: 500; }
.pl-status.ok { color: var(--fg); font-weight: 500; }
.pl-status.ok .ico { color: var(--ok); }
.pl-more {
  flex: none; width: 26px; height: 26px; margin: -4px -2px -4px 0; display: grid; place-items: center;
  border: 0; border-radius: var(--r-sm); background: transparent; color: var(--fg-3); opacity: 0;
  transition: opacity var(--t-fast), background var(--t-fast);
}
.pl-card:hover .pl-more, .pl-card:focus-within .pl-more, .pl-more:focus-visible, .pl-more[aria-expanded="true"] { opacity: 1; }
.pl-more:hover { background: var(--surface-2); color: var(--fg); }
@media (hover: none) { .pl-more { opacity: 1; } }
/* On pointer devices the menu button floats over the card corner instead of reserving width */
@media (hover: hover) {
  .pl-more { position: absolute; top: 7px; right: 7px; margin: 0; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
  .pl-more:hover { background: var(--surface-2); }
}
.pl-tip { font-size: var(--fs-xs); color: var(--fg-3); display: flex; align-items: center; gap: 6px; margin-top: -10px; align-self: flex-start; }
.pl-tip .kbd { min-width: 18px; height: 18px; }
.pl-tip-x { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: var(--r-sm); background: none; color: var(--fg-3); }
.pl-tip-x:hover { background: var(--surface-2); color: var(--fg); }

.pl-menu { width: 216px; }
.pl-menu-label { font-size: var(--fs-xs); color: var(--fg-3); padding: 6px 10px 4px; }
.pl-menu-sep { height: 1px; background: var(--line); margin: 4px 0; }
.pl-menu button[aria-checked="true"] { color: var(--fg); font-weight: 500; }
.pl-menu button .ico { color: var(--fg-3); }

/* Table */
.pl-table-card { overflow: hidden; }
.pl-table { min-width: 860px; }
.pl-table th:first-child, .pl-table td:first-child { padding-left: 16px; }
.pl-table th:last-child, .pl-table td:last-child { padding-right: 16px; }
.pl-table td { height: 56px; }
.pl-table th button { height: 100%; }
.pl-table th button:hover { color: var(--fg); }
.pl-table th[aria-sort="ascending"] button, .pl-table th[aria-sort="descending"] button { color: var(--fg); }
.pl-num { text-align: right; }
.pl-table th.pl-num { text-align: right; }
.pl-table th.pl-num button { position: relative; }
.pl-table th.pl-num button .ico { position: absolute; left: 100%; margin-left: 2px; }
.pl-sort { transition: transform var(--t-fast); transform: rotate(180deg); }
.pl-sort.desc { transform: none; }
.pl-sort-idle { opacity: 0; }
.pl-table th button:hover .pl-sort-idle { opacity: .7; }
.pl-table tbody tr:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 0; }
.pl-tcell { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 380px; }
.pl-tname { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.35; }
.pl-ttitle { font-weight: 500; color: var(--fg); }
.pl-tco { font-size: var(--fs-xs); color: var(--fg-2); }
.pl-next.pl-tnext-m { display: none; font-size: var(--fs-xs); }
.pl-stage-sel { position: relative; display: inline-flex; align-items: center; }
.pl-stage-sel .dot { position: absolute; left: 10px; pointer-events: none; }

.pl-round-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.pl-quicknote { display: flex; gap: 8px; }

.pl-tl { padding-top: 6px; }

.pl-notes { min-height: 340px; line-height: 1.6; font-size: var(--fs-md); }

.pl-draft { min-height: 260px; font-size: var(--fs-sm); line-height: 1.6; }

.pl-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: pl-spin 0.8s linear infinite; }
@keyframes pl-spin { to { transform: rotate(360deg); } }

.pl-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
.pl-form .field > label .faint { font-weight: 400; font-size: var(--fs-xs); margin-left: 4px; }

.pl-raw-tools { justify-content: flex-end; margin-bottom: -2px; }

.pl-raw-sum { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-sm); color: var(--fg-2); }
.pl-raw-sum > .ico { flex: none; color: var(--fg-3); }
.pl-raw-sum .truncate { flex: 1; min-width: 0; }
.pl-ai-row { margin-top: -4px; }
.pl-samples { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

.pl-preview { display: flex; flex-direction: column; overflow: hidden; }
.pl-preview-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pl-preview-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 14px; }
.pl-span2 { grid-column: 1 / -1; }
.pl-plan { display: flex; gap: 10px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--fg); }

.pl-plan p { margin: 0; }
.pl-plan .pl-eyebrow { display: block; margin-bottom: 2px; }

/* Responsive */
@media (max-width: 1100px) {
  .pl-filter { width: 200px; }
}
@media (max-width: 860px) {
  .pl-page { gap: 14px; }
  .pl-head { align-items: stretch; flex-direction: column; gap: 10px; }
  .pl-head > .spacer { display: none; }
  .pl-tools { width: 100%; flex-wrap: nowrap; }
  .pl-filter { flex: 1 1 auto; width: auto; min-width: 0; order: 2; }
  .pl-filter .input { height: 40px; }
  .pl-tools .seg { flex: none; order: 1; }
  .pl-banner { flex-wrap: nowrap; padding: 4px 4px 4px 12px; }
  .pl-banner .btn { height: 32px; }
  .pl-board { margin-inline: -16px; padding-inline: 16px; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; gap: 10px; }
  .pl-col { flex: 0 0 288px; min-width: 0; max-width: none; scroll-snap-align: start; }
  .pl-rail { scroll-snap-align: start; }
  .pl-close-btn { height: 36px; }
  .pl-kv { grid-template-columns: 110px minmax(0, 1fr); }
  .pl-preview-grid, .pl-form { grid-template-columns: minmax(0, 1fr); }
  .pl-round-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .pl-dhead .logo { display: none; }
  .pl-steps { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, .8fr); }
  .pl-stage-line > .pl-small { flex-basis: 100%; margin-bottom: 2px; }
  .pl-stage-line > .spacer { display: none; }
  .pl-close-btn { flex: 1; justify-content: center; }
  .pl-col { flex-basis: 82%; }
  .pl-round-name { min-width: 0; }
  .pl-round-sum { flex-wrap: wrap; row-gap: 4px; }
  .pl-round-meta { order: 3; flex-basis: 100%; }
  .pl-round-edit { margin-left: auto; }
  .pl-table { min-width: 0; table-layout: fixed; }
  .pl-table th:nth-child(3) { width: 134px; }
  .pl-table th.pl-chk-cell { width: 40px; }
  .pl-table th:nth-child(n+4), .pl-table td:nth-child(n+4) { display: none; }
  .pl-table td { height: auto; padding-block: 10px; }
  .pl-table td.pl-chk-cell, .pl-table th.pl-chk-cell { padding-left: 12px; } .pl-table td:nth-child(3) { padding-right: 12px; }
  .pl-table td.pl-chk-cell { vertical-align: top; padding-top: 12px; }
  .pl-tcell .logo { display: none; }
  .pl-tcell { align-items: flex-start; }
  .pl-tcell .badge { display: none; }
  .pl-next.pl-tnext-m { display: flex; margin-top: 2px; white-space: normal; }
